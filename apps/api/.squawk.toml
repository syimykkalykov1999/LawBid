# Squawk (https://squawkhq.com, version pinned in .github/workflows/api-ci.yml)
# lints every NEW migration for locks that stall a big table. Run by
# scripts/check-migrations.mjs; rules explained in docs/architecture/ONLINE_DDL.md.
pg_version = "16.0"
# Prisma runs each migration.sql in one transaction.
assume_in_transaction = true
excluded_rules = [
  # style, not locking
  "prefer-robust-stmts",
  "prefer-bigint-over-int",
  "prefer-bigint-over-smallint",
  "prefer-identity",
  "prefer-text-field",
  "prefer-timestamptz",
  "require-statement-timeout",
  # drop / rename are the expand-contract rules of check-migrations.mjs
  # (they carry the `-- migration-safety: contract` waiver the team uses)
  "ban-drop-column",
  "ban-drop-table",
  "ban-drop-not-null",
  "renaming-column",
  "renaming-table",
  "ban-drop-index",
  # needed by the NOT VALID -> VALIDATE -> SET NOT NULL -> DROP CONSTRAINT pattern
  "ban-drop-constraint",
  # not a locking problem
  "require-enum-value-ordering",
]
