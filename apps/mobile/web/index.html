<!DOCTYPE html>
<html lang="en">
<head>
  <!-- `flutter build web --base-href` replaces this; "/" on lawbid.dev. -->
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="LawBid: clients post cases, licensed attorneys send offers.">
  <!-- The signed-in app is private: search engines index only the public
       pages (docs: plan/web-seo-plan.md). -->
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0B0B0D" media="(prefers-color-scheme: dark)">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="LawBid">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">
  <title>LawBid</title>
  <style>
    /* Same background as the app (AppColorsLight/Dark.bg) while it loads. */
    html, body { margin: 0; height: 100%; background: #FFFFFF; }
    @media (prefers-color-scheme: dark) { html, body { background: #0B0B0D; } }
  </style>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
