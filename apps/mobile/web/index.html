<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <script>
    /* Owner 2026-10-18 (iPhone): Flutter replaces this tag with one that
       allows zoom up to 5x, and its hidden text fields are 14px, so iOS
       Safari zoomed into the page on every tap in a field and half the
       screen went off the edge. Keep our tag: no automatic zoom (pinch still
       works on iOS), and the notch area is ours (viewport-fit=cover). */
    (function () {
      var want = 'width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover';
      function fix() {
        var tags = document.querySelectorAll('meta[name="viewport"]');
        for (var i = 0; i < tags.length; i++) {
          if (tags[i].getAttribute('content') !== want) tags[i].setAttribute('content', want);
        }
      }
      new MutationObserver(fix).observe(document.head, { childList: true, subtree: true, attributes: true, attributeFilter: ['content'] });
      /* After the keyboard closes iOS can leave the page shifted up. */
      document.addEventListener('focusout', function () {
        setTimeout(function () { if (window.scrollY || window.scrollX) window.scrollTo(0, 0); }, 60);
      });
    })();
  </script>
  <meta name="description" content="LawBid: post your legal matter, licensed attorneys respond with offers, you choose. Find a lawyer by state and practice area.">
  <!-- Search engines: the address / and the public pages (scripts/seo) are
       indexed; every other address of the app answers with an
       `X-Robots-Tag: noindex` header (infra/modules/web). -->
  <meta name="theme-color" content="#0A1A3C" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0D1117" media="(prefers-color-scheme: dark)">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="LawBid">
  <meta property="og:title" content="LawBid: find a licensed lawyer, compare offers">
  <meta property="og:description" content="Post your legal matter and licensed attorneys in your state respond with offers. You choose.">
  <meta property="og:image" content="icons/Icon-512.png">
  <meta name="twitter:card" content="summary">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="LawBid">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>LawBid: find a licensed lawyer, compare offers</title>
  <link rel="manifest" href="manifest.json">
  <style>
    /* Owner 2026-10-15: something is on screen the moment the page opens,
       while the app (a few MB) downloads; it goes away with the first frame. */
    html, body { margin: 0; height: 100%; background: #fff; }
    #boot { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #fff; z-index: 1; pointer-events: none; transition: opacity .25s; }
    #boot img { width: 96px; height: 96px; border-radius: 22px; animation: boot-pulse 1.4s ease-in-out infinite; }
    #boot.gone { opacity: 0; pointer-events: none; }
    @keyframes boot-pulse { 0%, 100% { transform: scale(1); opacity: .9; } 50% { transform: scale(1.06); opacity: 1; } }
    @media (prefers-color-scheme: dark) { html, body, #boot { background: #0D1117; } }
    @media (prefers-reduced-motion: reduce) { #boot img { animation: none; } }
    /* Text for search engines and readers without the app; not drawn. */
    #seo { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  </style>
</head>
<body>
  <div id="boot"><img src="icons/Icon-192.png" alt="LawBid" width="96" height="96"></div>
  <main id="seo">
    <h1>LawBid: find a licensed lawyer and compare offers</h1>
    <p>Post your legal matter. Licensed attorneys in your state respond with offers, and you choose who to talk to.</p>
    <nav>
      <a href="/lawyers/">Find a lawyer by state</a>
      <a href="/practice-areas/family-law/">Family law</a>
      <a href="/practice-areas/immigration/">Immigration</a>
      <a href="/practice-areas/criminal-defense/">Criminal defense</a>
      <a href="/practice-areas/personal-injury/">Personal injury</a>
      <a href="/about/">About LawBid</a>
      <a href="/pricing/">Pricing</a>
      <a href="/faq/">FAQ</a>
      <a href="/privacy/">Privacy</a>
      <a href="/terms/">Terms</a>
    </nav>
  </main>
  <noscript>LawBid needs JavaScript. You can still browse <a href="/lawyers/">lawyers by state and practice area</a>.</noscript>
  <script>
    function hideBoot() {
      var b = document.getElementById('boot');
      if (!b) return;
      b.classList.add('gone');
      setTimeout(function () { b.remove(); }, 400);
    }
    window.addEventListener('flutter-first-frame', hideBoot);
    setTimeout(hideBoot, 30000); // never stays if the event does not come
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
  <script>
    /* Owner 2026-10-20: a link or QR code for the app (profile, group, case,
       post...) opened in a phone's browser because the app is not installed
       (or the phone did not hand the link over): offer "Open in LawBid" —
       the app when it is there, the store when it is not. Phones only; the
       bar can be closed. (Add <meta name="apple-itunes-app"
       content="app-id=<App Store id>"> in <head> once the App Store id of
       the listing exists: iOS Safari then shows its own banner too.) */
    (function () {
      var m = location.pathname.match(/^\/(u|g|case|lawyer|post|r|q)\/([^\/]+)/);
      var ua = navigator.userAgent || '';
      var android = /Android/i.test(ua);
      var ios = /iPhone|iPad|iPod/i.test(ua);
      if (!m || !(android || ios)) return;
      try { if (sessionStorage.getItem('openAppClosed')) return; } catch (e) {}
      var ru = /^ru/i.test(navigator.language || '');
      var label = ru ? 'Открыть в LawBid' : 'Open in LawBid';
      var close = ru ? 'Закрыть' : 'Close';
      var play = 'https://play.google.com/store/apps/details?id=com.lawbid.lawbid';
      var href = android
        ? 'intent://lawbid.dev' + location.pathname + '#Intent;scheme=https;package=com.lawbid.lawbid;S.browser_fallback_url=' + encodeURIComponent(play) + ';end'
        : 'lawbid://' + m[1] + '/' + m[2];
      var bar = document.createElement('div');
      bar.setAttribute('role', 'region');
      bar.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:2147483647;display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top) + 6px) 12px 6px;background:#0A1A3C;color:#fff;font:600 14px/1.2 -apple-system,Roboto,sans-serif;box-shadow:0 1px 6px rgba(0,0,0,.35)';
      var a = document.createElement('a');
      a.href = href;
      a.textContent = label;
      a.style.cssText = 'flex:1;color:#fff;text-decoration:none;padding:8px 0';
      var x = document.createElement('button');
      x.type = 'button';
      x.setAttribute('aria-label', close);
      x.textContent = '\u2715';
      x.style.cssText = 'border:0;background:none;color:#fff;font-size:18px;min-width:44px;min-height:44px';
      x.onclick = function () {
        try { sessionStorage.setItem('openAppClosed', '1'); } catch (e) {}
        bar.remove();
      };
      bar.appendChild(a);
      bar.appendChild(x);
      document.body.appendChild(bar);
    })();
  </script>
</body>
</html>
