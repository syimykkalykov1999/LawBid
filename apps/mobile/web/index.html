<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <!-- Owner 2026-10-22 (audit #7): no inline scripts (strict CSP). -->
  <script src="boot_head.js"></script>
  <meta name="description" content="LawBid: post your legal matter, licensed attorneys respond with offers, you choose. Find a lawyer by state and practice area.">
  <!-- Search engines: the address / and the public pages (scripts/seo) are
       indexed; every other address of the app answers with an
       `X-Robots-Tag: noindex` header (infra/modules/web). -->
  <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0B0B0D" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="LawBid">
  <meta property="og:title" content="LawBid: find a licensed lawyer, compare offers">
  <meta property="og:description" content="Post your legal matter and licensed attorneys in your state respond with offers. You choose.">
  <!-- Owner 2026-10-22 (audit #4 §9): Open Graph needs an absolute
       address (ogp.me); a relative one shows no picture in chats. -->
  <meta property="og:image" content="https://lawbid.dev/icons/Icon-512.png">
  <meta property="og:image:width" content="512">
  <meta property="og:image:height" content="512">
  <meta name="twitter:card" content="summary">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="LawBid">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <!-- Owner 2026-10-23 (web speed pass): the TLS handshake with the API is
       done while the app downloads, so the first request does not wait for
       it. (The host is the production API; a preview build just wastes one
       idle connection.) -->
  <link rel="preconnect" href="https://api.lawbid.dev" crossorigin>

  <title>LawBid: find a licensed lawyer, compare offers</title>
  <link rel="manifest" href="manifest.json">
  <style>
    /* Owner 2026-10-15: something is on screen the moment the page opens,
       while the app downloads; it goes away with the first frame.
       2026-10-23: the colours are the app's own theme tokens (light:
       AppColorsLight.bg / gold, dark: AppColorsDark.bg / gold), so the
       hand-over to the first Flutter frame does not flash. */
    :root { --boot-bg: #fff; --boot-fg: #0B1330; --boot-dim: #5B6784; --boot-ring: #C8A765; --boot-track: #DDE2EE; }
    @media (prefers-color-scheme: dark) { :root { --boot-bg: #0B0B0D; --boot-fg: #F3EFE3; --boot-dim: #9A9AA6; --boot-ring: #D8BC84; --boot-track: #2A2A31; } }
    html, body { margin: 0; height: 100%; background: var(--boot-bg); }
    #boot { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px; background: var(--boot-bg); z-index: 1; pointer-events: none; transition: opacity .25s; }
    #boot img { width: 96px; height: 96px; border-radius: 22px; animation: boot-pulse 1.4s ease-in-out infinite; }
    #boot i { width: 26px; height: 26px; border-radius: 50%; border: 3px solid var(--boot-track); border-top-color: var(--boot-ring); animation: boot-spin .9s linear infinite; }
    #boot p { margin: 0; max-width: 280px; text-align: center; font: 500 14px/1.4 -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--boot-dim); }
    #boot button { margin-top: 12px; pointer-events: auto; border: 0; border-radius: 12px; padding: 12px 22px; font: 600 15px/1 -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--boot-ring); color: #0B0B0D; cursor: pointer; }
    #boot.gone { opacity: 0; pointer-events: none; }
    @keyframes boot-pulse { 0%, 100% { transform: scale(1); opacity: .9; } 50% { transform: scale(1.06); opacity: 1; } }
    @keyframes boot-spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { #boot img { animation: none; } #boot i { animation-duration: 3s; } }
    /* Text for search engines and readers without the app; not drawn. */
    #seo { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  </style>
</head>
<body>
  <div id="boot" role="status" aria-label="LawBid"><img src="icons/Icon-192.png" alt="LawBid" width="96" height="96" fetchpriority="high"><i aria-hidden="true"></i></div>
  <main id="seo">
    <h1>LawBid: find a licensed lawyer and compare offers</h1>
    <p>Post your legal matter. Licensed attorneys in your state respond with offers, and you choose who to talk to.</p>
    <nav>
      <a href="/lawyers/">Find a lawyer by state</a>
      <a href="/practice-areas/family-law/">Family law</a>
      <a href="/practice-areas/immigration/">Immigration</a>
      <a href="/practice-areas/criminal-defense/">Criminal defense</a>
      <a href="/practice-areas/personal-injury/">Personal injury</a>
      <a href="/about/">About LawBid</a>
      <a href="/pricing/">Pricing</a>
      <a href="/faq/">FAQ</a>
      <a href="/privacy/">Privacy</a>
      <a href="/terms/">Terms</a>
    </nav>
  </main>
  <noscript>LawBid needs JavaScript. You can still browse <a href="/lawyers/">lawyers by state and practice area</a>.</noscript>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <!-- Owner 2026-10-22 (passkeys, checklist §1): the WebAuthn bridge of the
       `passkeys` plugin (corbado). Pinned release; the web CSP
       (infra/modules/web) must allow this origin for script-src, else the
       browser simply reports «no passkey support» and the app hides the
       button. -->
  <script src="https://github.com/corbado/flutter-passkeys/releases/download/2.4.0/bundle.js" type="application/javascript" async></script>
  <script src="boot_end.js"></script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
