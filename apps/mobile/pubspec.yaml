name: lawbid
description: "LawBid — доска объявлений для клиентов и адвокатов (US legal-services marketplace)."
publish_to: "none"
# 1.0.0 = version users see (raise by hand for a release).
# +1 = automatic build number: release builds replace it with the minutes
# since 2026-01-01 UTC (android/app/build.gradle.kts, iOS build phase
# "Auto build number"), so every store upload is higher on its own.
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

  # State management (file 01 §5.1)
  flutter_riverpod: ^3.4.3
  riverpod_annotation: ^4.0.7

  # Navigation — StatefulShellRoute.indexedStack (file 01 §5.1 names "go_router с ShellRoute";
  # this is the modern variant that preserves each tab's own Navigator stack, chosen per
  # stage 1.5 architecture review — see docs/CHANGELOG.md stage 1.5 entry)
  # D1-24 (13.11): 14 -> 17.5 (migration guides 15-17: case-sensitive URLs,
  # GoRouteData unused here, shell observers kept off in app_router.dart).
  # Row 148 (14.11): 17.5 -> 18.1.3 (newest release at least 7 days old;
  # 18.0 only moved its own pages onto package:material_ui and raised the SDK
  # floor). With this app's flutter/material MaterialApp, go_router 18 sees a
  # plain WidgetsApp, so every route builds its own page (`pageBuilder:`,
  # app_page_transitions.dart; the tab roots use MaterialPage as 17 did), the
  # unknown-URL page is ours (app_router.dart), and the Hero widgets carry
  # Material's arc tween themselves: the look and swipe-back stay as on 17.
  go_router: 18.1.4

  # Models (stage 1.5 doesn't define any yet; locked in now so stage 1.7+ doesn't fight
  # version skew across the monorepo)
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0

  # Local key-value persistence (theme mode now; auth/session/feature-flags in later stages,
  # all behind the same repository-interface pattern — see LocalKvStore)
  shared_preferences: ^2.5.6

  # Networking (real backend wiring pass, docs/CHANGELOG.md): dio for the
  # HTTP client + interceptors (headers/auth/refresh), flutter_secure_storage
  # for the refresh token only (see core/session/token_secure_store.dart's
  # doc comment for why it's not in LocalKvStore/SharedPreferences).
  dio: ^5.9.0
  # S8-1 (speed): iOS URLSession / Android Cronet transport (HTTP/2+3, OS
  # connection reuse) behind a fallback to dart:io (core/network/http_transport*.dart).
  native_dio_adapter: ^1.8.0
  http: ^1.5.0
  # Browser file save (core/platform/web_download_web.dart).
  web: ^1.1.2
  # Row 149 (14.11): 9 -> 11. 11 no longer reads Android's
  # EncryptedSharedPreferences (where 9 kept the tokens); the app moves them
  # itself before the first read (core/session/legacy_secure_storage.dart,
  # android .../LegacySecureStorage.kt). Needs win32 6 (row 118 first).
  flutter_secure_storage: ^11.2.0

  crypto: ^3.0.8
  flutter_contacts: ^2.6.0

  # Biometric reauth (Phase 4 of the auth networking work, docs/CHANGELOG.md):
  # local Face ID/Touch ID/fingerprint gate (file 01 §10.1) used as a local
  # device-owner check ahead of the phone+OTP step that actually mints a
  # `POST /auth/reauth` token server-side — see
  # core/session/biometric_auth_service.dart's doc comment for why the
  # server-side trust boundary is still OTP-only this stage.
  local_auth: ^3.0.2

  # Local SQLite cache for the real, backend-driven L10n layer (file 01
  # §9.4, stage 1.6 — see core/l10n/l10n_database.dart). `drift_flutter`
  # supplies `driftDatabase()`, the standard cross-platform (native +
  # sqlite3_flutter_libs under the hood, web via wasm) connection opener
  # for a Flutter app — no separate sqlite3_flutter_libs/path_provider
  # dependency needed, drift_flutter pulls those in itself.
  drift: ^2.35.3
  drift_flutter: ^0.3.1
  # The web build's in-tab fallback database (core/persistence/
  # drift_memory_web.dart); the same version drift already uses.
  sqlite3: ^3.9.0

  # CLDR plural rules + date/number/currency formatting per interface
  # language (file 01 §9.2/§9.4 — core/l10n/plural_rules.dart,
  # core/l10n/l10n_formats.dart). Already in the lockfile transitively.
  intl: ^0.20.2
  flutter_animate: ^4.5.2
  # p12 leaf-1.4 (mobile platform): real installed version for
  # X-App-Version; deep links (custom scheme + universal/App Links, file 01
  # §12); opening the store from the update prompts; Android SMS Retriever
  # OTP autofill (file 01 §10.2 D).
  package_info_plus: ^10.2.2
  app_links: ^7.2.2
  flutter_displaymode: 0.7.0
  url_launcher: ^6.3.3
  # Owner 2026-11-05: a downloaded case document opens in the system viewer
  # (file:// through url_launcher is refused on both platforms). BSD-3.
  open_filex: ^5.0.0
  smart_auth: ^4.0.0
  # Connectivity (docs/01 §8.3 "Offline (баннер сверху, показ кэша)",
  # p12 leaf-1.6): the OS network-interface signal behind
  # core/connectivity/connectivity_service.dart. It only says whether an
  # interface is up; real reachability comes from dio network errors
  # (ReachabilityInterceptor) and a /health/live probe.
  connectivity_plus: ^7.3.1
  # Generated API client (docs/01 §6.3, p12 leaf-1.3): models + retrofit
  # clients from packages/api-contract/openapi.json — regenerate with
  # packages/api-contract/generate.sh, never hand-edit.
  lawbid_api:
    path: ../../packages/api-contract/dart
  # docs/03 §4.1 profile photo (stage 3.9, OQ-012): gallery/camera pick,
  # downscaled to 1024 px before the presign → S3 POST → confirm upload.
  image_picker: ^1.2.4
  camera: ^0.12.2
  # Row 149 (14.11): 11 -> 13.3.2 (the federated rewrite: a list instead of
  # FilePickerResult, PlatformFile.readAsBytes/lengthSync instead of
  # bytes/size); file_picker_web for its web options (core/files).
  file_picker: 13.4.0
  file_picker_web: 4.2.1
  share_plus: ^13.3.1
  socket_io_client: ^3.1.6
  cached_network_image: ^4.0.6
  # Owner 2026-10-22 (load audit finding 8): its own picture caches
  # (lib/core/media/app_image_cache.dart); already in the lock as
  # cached_network_image's dependency.
  flutter_cache_manager: ^3.5.0
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1
  # Owner 2026-10-22: native crashes / ANRs in Sentry (prod release only,
  # core/diagnostics/sentry_native.dart).
  sentry_flutter: ^10.3.0
  app_badge_plus: ^1.4.0
  flutter_timezone: ^5.1.1
  flutter_stripe: ^15.0.0
  # Flutter 3.50 (11.11) deprecated the in-SDK material/cupertino libraries
  # (docs.flutter.dev breaking-changes material-ui-and-cupertino-ui); the app
  # imports these standalone packages (dart fix migrate_design_widgets).
  material_ui: ^1.11.1
  cupertino_ui: ^1.1.7
  record: ^7.1.2
  just_audio: ^0.10.6
  path_provider: ^2.1.6
  flutter_webrtc: ^1.6.3
  # Owner 2026-10-05 (docs/ops/demo-world.md): Android Play Install Referrer —
  # `lawbid_ref=<CODE>` from the store link becomes the pending referral
  # code applied once after onboarding (features/referrals/application/
  # install_referrer.dart). MIT. NOTE: pub.dev marks 0.4.0 (Apr 2024) as the
  # final release and points to `play_install_referrer` (same API, class
  # `PlayInstallReferrer`) as its successor — swap when convenient.
  android_play_install_referrer: ^0.4.0
  flutter_callkit_incoming: ^3.1.6
  font_awesome_flutter: ^11.0.0
  video_player: ^2.14.1
  visibility_detector: ^0.4.0+2
  audio_session: ^0.2.4
  # Voice notes held to the ear (WhatsApp): near the face the sound moves to
  # the earpiece and the screen goes dark.
  proximity_sensor: ^2.0.0
  v_video_compressor: ^3.0.1
  device_info_plus: ^13.3.0
  flutter_local_notifications: ^23.0.0
  timezone: ^0.11.2
  phone_numbers_parser: ^9.0.29
  # Owner 2026-10-20: the system dialogs (date, time, OK / Cancel) speak the
  # app's language (core/l10n/material_locale.dart). Part of the Flutter SDK.
  flutter_localizations:
    sdk: flutter
  # Owner 2026-10-20 (WeChat-style QR): `qr` draws our own QR cards (pure
  # Dart, no plugin); `mobile_scanner` reads codes from the camera and from
  # a gallery picture (compileSdk 36, AGP 9 aware); `gal` saves the QR card
  # picture to the phone's gallery.
  qr: ^4.0.1
  mobile_scanner: ^7.5.0
  gal: ^3.0.1
  # Owner 2026-10-20: «Перевести» on the phone instead of paid Google
  # Translate. Free, offline after a one-time ~30 MB language download.
  # Android + iOS only (iOS 15.5+); the web says «in the app».
  google_mlkit_translation: ^1.0.3
  google_mlkit_language_id: ^1.0.3
  # Owner 2026-10-28 (ID selfie camera, docs/architecture/
  # ID_SELFIE_CAPTURE_2026-10-28.md): free on-device face detection (one
  # face in the oval + blink / head-turn liveness) and text recognition
  # (a soft "ID card is in the frame" hint). Same ML Kit release train as
  # translation (google_mlkit_commons ^0.13.0); nothing leaves the phone.
  google_mlkit_face_detection: ^1.0.3
  google_mlkit_text_recognition: ^1.0.3
  # Owner 2026-10-22 (audit #4 §3): the persistent media queue hands each
  # S3 POST to the OS (Android WorkManager, iOS background URLSession), so
  # an upload continues while the app is closed (core/uploads/
  # background_transport_io.dart). bbflight, BSD-3, actively maintained.
  background_downloader: ^9.6.6
  # Security research #5 (2026-10-22), B1: Firebase App Check — the proof
  # the request comes from our app (core/security/app_check.dart,
  # docs/runbooks/APP_CHECK.md). Official FlutterFire; the version pairs
  # with the pinned firebase_core.
  firebase_app_check: ^0.5.1
  passkeys: ^2.24.1
  # Its availability query (features/auth/data/passkey_authenticator.dart).
  passkeys_platform_interface: ^2.11.0
  in_app_review: ^2.0.12
  swipeable_page_route: ^0.4.8
  image: ^4.12.0
  geolocator: ^14.0.2
  flutter_blurhash: ^0.9.1
  fl_chart: ^1.3.0
  desktop_drop: ^0.8.4
  battery_plus: ^7.1.2
  # Row 149: 1.8.0, the newest on dbus 0.7. Rechecked 25.11 (item 26):
  # wakelock_plus >=1.8.1 and connectivity_plus 7.3.2 (nm 0.6) need dbus 0.8,
  # and three others still allow only dbus 0.7 in their newest releases:
  # desktop_drop 0.8.4, geolocator_linux 0.2.6 (+ geoclue 0.1.1) and
  # battery_plus 7.1.2 (upower ^0.7; upower 0.8 is from 23.11). desktop_drop
  # 0.9 drops dbus but needs cross_file 0.4, which share_plus 13.3.1,
  # file_picker 13.4.1, image_picker / camera / file_selector platform
  # interfaces still exclude (^0.3). Details: docs/dev/VERSIONS_AUDIT_2026-11-14.md.
  wakelock_plus: 1.8.0
  cupertino_interactive_keyboard: ^1.0.0
  openmls: ^4.0.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  # 2026-10-18 (speed): on-device scroll measurements —
  # integration_test/scroll_perf_test.dart + test_driver/perf_driver.dart;
  # 2026-10-23: the full suite integration_test/perf/ (vm_service = Dart heap).
  integration_test:
    sdk: flutter
  vm_service: ^15.4.0
  flutter_driver:
    sdk: flutter
  riverpod_generator: ^4.0.9
  build_runner: ^2.17.1
  freezed: ^4.0.2
  json_serializable: ^6.14.1
  # Codegen for the `@DriftDatabase` table classes in
  # core/l10n/l10n_database.dart — same `dart run build_runner build` pass
  # as riverpod_generator/freezed/json_serializable above.
  drift_dev: ^2.23.0
  # custom_lint / riverpod_lint: TEMPORARILY REMOVED — 2026-09-22, UPDATE 2026-09-22.
  # Original reason: custom_lint ^0.7.x pulled analyzer_plugin ~0.12.0, which broke against
  # the analyzer version resolved elsewhere in the graph (Element -> Element2 migration),
  # failing `dart run build_runner build` entirely.
  # Update: the app's whole Riverpod 2->3 / Freezed 2->4 migration (see CHANGELOG, same date)
  # already happened to fix the build, so custom_lint 0.8.1 + riverpod_lint ^3.x (which need
  # riverpod 3.x) are now compatible with this pubspec — no longer blocked. Not re-added here
  # anyway, to keep this pass scoped to "unblock the build"; re-adding IDE-lint-only tooling
  # is a separate, deliberate decision, not a version-conflict problem anymore. See CHANGELOG.
  very_good_analysis: ^11.0.0
  golden_toolkit: ^0.15.0

  fake_async: any
  # Owner 2026-10-22: the fake store-review platform in
  # test/core/platform/review_prompter_test.dart.
  in_app_review_platform_interface: ^2.0.5
  # ROUND1 25.11 row 18: the fake camera of
  # test/features/stories/story_camera_interrupt_test.dart (the version the
  # camera plugin already resolves).
  camera_platform_interface: ^2.15.1
  # Owner 2026-10-22: uploads the release symbols to Sentry (fastlane
  # `sentry_symbols`; config in `sentry:` below).
  sentry_dart_plugin: ^3.4.0
flutter:
  uses-material-design: true
  # Plain `flutter run` / `flutter build` without --flavor builds the dev
  # variant ("LawBid Dev", lib/main.dart = dev) — p12 leaf-1.4 flavors.
  default-flavor: dev

  assets:
    - assets/fonts/OFL-SourceSerif4.txt
    - assets/fonts/OFL-Inter.txt
    # Licence audit 17.11: the Phosphor licence and the app's notices,
    # read by core/licenses/bundled_licenses.dart for the licence list.
    - assets/fonts/LICENSE-Phosphor.txt
    - THIRD_PARTY_NOTICES.md
    - assets/practice_art/
    # OQ-041/044: call tones and in-app message sounds.
    - assets/sounds/
    # Web bundle budget (15.11): the pickers' CLDR language names
    # (tool/gen_language_display_names.mjs), read by language_catalog.dart.
    - assets/l10n/language_display_names.json
    # Web bundle budget (17.11): the compiled-in ru/en strings for the web
    # build only (tool/gen_static_strings.dart, lib/core/l10n/static_strings.dart);
    # phones keep them as Dart constants.
    - path: assets/l10n/static_strings_ru.json
      platforms: [web]
    - path: assets/l10n/static_strings_en.json
      platforms: [web]

  fonts:
    # Owner 2026-10-01: Phosphor icons (MIT, assets/fonts/LICENSE-Phosphor.txt).
    - family: PhosphorBold
      fonts:
        - asset: assets/fonts/PhosphorBold.ttf
    - family: PhosphorFill
      fonts:
        - asset: assets/fonts/PhosphorFill.ttf
    - family: Source Serif 4
      fonts:
        - asset: assets/fonts/SourceSerif4-Variable.ttf
          weight: 600
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf
          weight: 400
        - asset: assets/fonts/Inter-Variable.ttf
          weight: 500
        - asset: assets/fonts/Inter-Variable.ttf
          weight: 600

dependency_overrides:
  # Riverpod bumped 2.x -> 3.x on 2026-09-22 specifically to escape this: riverpod_generator
  # 2.x's analyzer-touching chain (riverpod_analyzer_utils, custom_lint_core, analyzer_plugin)
  # was never updated for analyzer's Element -> Element2 migration and cannot build against any
  # analyzer version the current Dart SDK accepts. 3.x/4.x generations fix this. No overrides
  # needed after the bump; keeping this file present as a documented marker.

  # Owner 2026-10-15 (web): the published flutter_secure_storage_web (dart:html)
  # does not compile to WebAssembly. This local copy (package:web) is used by
  # the web build only; Android and iOS never load it.
  flutter_secure_storage_web:
    path: third_party/flutter_secure_storage_web

  # Owner 2026-10-23 (web speed pass): upstream passkeys_web closes the
  # window / throws at startup when bundle.js is missing, e.g. when the page's
  # content security policy refuses the github.com script — the web app then
  # never drew a first frame. Patched copy (BSD-3, Corbado): the app starts,
  # passkeys are simply unavailable (third_party/passkeys_web/lib).
  passkeys_web:
    path: third_party/passkeys_web

  # KNOWN_ERRORS 230 (owner 18.11, «the screen goes empty, nothing responds»):
  # go_router 18.1.4 (BSD-3, flutter/packages) with one patch — a pop that
  # would leave no page is refused instead of emptying the router (upstream
  # only asserts in debug; release built SizedBox.shrink() for the whole
  # app). Same version as `go_router:` above; re-copy on every update and
  # keep the patch (test/core/navigation/last_page_guard_test.dart).
  go_router:
    path: third_party/go_router

# Owner 2026-10-22 (audit #11): `dart run sentry_dart_plugin` after a prod
# release build (fastlane `sentry_symbols`) uploads the Dart symbols of
# `--split-debug-info=build/symbols/<platform>` and the native debug files
# (iOS dSYMs) to Sentry. Org and token only from the environment:
# SENTRY_ORG, SENTRY_AUTH_TOKEN (docs/runbooks/STORE_RELEASE.md §6).
sentry:
  project: lawbid-mobile
  upload_debug_symbols: true
  upload_source_maps: false
  upload_sources: false
  symbols_path: build/symbols
  commits: false
  ignore_missing: true
