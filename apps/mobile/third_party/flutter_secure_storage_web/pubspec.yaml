name: flutter_secure_storage_web
description: >-
  LawBid's web implementation of flutter_secure_storage, on package:web
  (WebAssembly). Plain sessionStorage (owner 2026-10-15): the published 2.x
  encrypts into localStorage, a different format that would sign every
  website user out. Used only by the web build
  (dependency_overrides in apps/mobile/pubspec.yaml); Android and iOS never
  load it.
version: 2.1.1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_secure_storage_platform_interface: ^2.1.0
  flutter_web_plugins:
    sdk: flutter
  web: ">=0.5.0 <2.0.0"

flutter:
  plugin:
    platforms:
      web:
        pluginClass: FlutterSecureStorageWeb
        fileName: flutter_secure_storage_web.dart
