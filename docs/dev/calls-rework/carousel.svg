 fill="#222" text-anchor="middle">5 · Сетка (кнопка ⤢)</text><text x="1120" y="558" font-size="8" fill="#555" text-anchor="middle">все плитками; тап по плитке — на</text><text x="1120" y="569" font-size="8" fill="#555" text-anchor="middle">весь экран; ⤢ — обратно</text><text x="630" y="605" font-size="10" fill="#555" text-anchor="middle">Все переходы 300–400 мс с плавным замедлением: карточка «вырастает» в большой экран и обратно, ничего не пропадает скачком. В 1:1 свайп меняет местами тебя и собеседника. Аудио — то же, вместо видео аватары.</text></svg>