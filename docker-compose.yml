# LawBid local dev infrastructure — docs/01_FOUNDATION_AUTH.md §15, stage 1.1.
# CockroachDB single-node, Redis, MinIO (local S3), Mailhog (local SMTP/email OTP capture).
name: lawbid-dev

services:
  cockroachdb:
    image: cockroachdb/cockroach:v24.1.5
    command: start-single-node --insecure
    ports:
      - "26257:26257" # SQL
      - "8080:8080"   # DB console
    volumes:
      - cockroach-data:/cockroach/cockroach-data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health?ready=1"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: lawbid
      MINIO_ROOT_PASSWORD: lawbid_dev_only
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # Console
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI

volumes:
  cockroach-data:
  redis-data:
  minio-data:
