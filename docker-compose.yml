# LawBid local dev infrastructure — docs/01_FOUNDATION_AUTH.md §15, stage 1.1.
# PostgreSQL, Redis, MinIO (local S3), Mailhog (local SMTP/email OTP capture).
name: lawbid

services:
  postgres:
    # 17.11 (CONTENT_MEDIA_VERIFY №1): the same engines as prod and CI —
    # RDS PostgreSQL 18.6 and ElastiCache Valkey 9.1, pinned by digest.
    # PostgreSQL 18 images keep data in /var/lib/postgresql/18/docker, so the
    # volume is mounted one level up and is a NEW volume (postgres18-data): the
    # old PostgreSQL 16 volume `postgres-data` is left untouched (a 16 data
    # directory cannot be opened by 18). After `docker compose up -d` run the
    # migrations and the seed on the fresh 18 database (npm run db:migrate).
    # The old volume can be removed by hand once it is not needed.
    image: postgres:18.6@sha256:e3d24f6906d0760bf4da0dae872415391ededefad23fd471c47dc53b0ddf3c42
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: lawbid
      POSTGRES_DB: lawbid
    ports:
      - "5432:5432"
    volumes:
      - postgres18-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d lawbid"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    # Valkey 9.1 = prod's ElastiCache engine (Redis-protocol compatible; the
    # service keeps the name `redis` so REDIS_URL and scripts stay the same).
    # New volume: Valkey does not read the newest Redis 7.4 RDB format.
    image: valkey/valkey:9.1.3-alpine@sha256:bf09d58e96d6b4524a15396b65b242bbe18beebbcc15a04d8ee75ddac62fae0b
    ports:
      - "6379:6379"
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: lawbid
      MINIO_ROOT_PASSWORD: lawbid_dev_only
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # Console
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI

  # OQ-041: TURN relay for in-app calls when a direct WebRTC path fails
  # (strict NAT, mobile carriers). Logins are short-lived HMACs from the
  # API (TURN REST API): TURN_SECRET here = TURN_SECRET in apps/api/.env.
  coturn:
    image: coturn/coturn:4.6
    command:
      - -n
      - --log-file=stdout
      - --listening-port=3478
      - --min-port=49160
      - --max-port=49200
      - --use-auth-secret
      - --static-auth-secret=${TURN_SECRET:-lawbid-dev-turn-secret}
      - --realm=lawbid.local
      - --fingerprint
      - --no-cli
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"
      - "49160-49200:49160-49200/udp"

volumes:
  postgres18-data:
  valkey-data:
  minio-data:
