# LawBid local dev infrastructure — docs/01_FOUNDATION_AUTH.md §15, stage 1.1.
# CockroachDB single-node, Redis, MinIO (local S3), Mailhog (local SMTP/email OTP capture).
name: lawbid-dev

services:
  cockroachdb:
    image: cockroachdb/cockroach:v24.1.5
    command: start-single-node --insecure
    ports:
      - "26257:26257" # SQL
      - "8080:8080"   # DB console
    volumes:
      - cockroach-data:/cockroach/cockroach-data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health?ready=1"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: lawbid
      MINIO_ROOT_PASSWORD: lawbid_dev_only
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # Console
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI

  # OQ-041: TURN relay for in-app calls when a direct WebRTC path fails
  # (strict NAT, mobile carriers). Logins are short-lived HMACs from the
  # API (TURN REST API): TURN_SECRET here = TURN_SECRET in apps/api/.env.
  coturn:
    image: coturn/coturn:4.6
    command:
      - -n
      - --log-file=stdout
      - --listening-port=3478
      - --min-port=49160
      - --max-port=49200
      - --use-auth-secret
      - --static-auth-secret=${TURN_SECRET:-lawbid-dev-turn-secret}
      - --realm=lawbid.local
      - --fingerprint
      - --no-cli
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"
      - "49160-49200:49160-49200/udp"

volumes:
  cockroach-data:
  redis-data:
  minio-data:
