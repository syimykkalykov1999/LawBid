# docs/06_PRODUCTION.md §4.4 (stage 6.1): pinned lock files, updates via PR.
#
# Security research #5 (2026-10-22), A1: `cooldown` — a release is only
# proposed once it has been public for 7 days (14 for a new major), so a
# package hijacked and fixed within days never reaches a PR. Security
# updates ignore the cooldown by design. The same 7 days are
# `min-release-age` in the root .npmrc.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
      semver-major-days: 14
    # S11-11: fewer, bigger PRs. Groups take minor + patch only (a major comes as
    # its own PR and is never auto-merged); .github/workflows/dependabot-automerge.yml
    # merges a green minor/patch group through the merge queue.
    groups:
      nestjs:
        patterns: ["@nestjs/*"]
        update-types: ["minor", "patch"]
      aws-sdk:
        patterns: ["@aws-sdk/*", "@smithy/*"]
        update-types: ["minor", "patch"]
      dev-tooling:
        dependency-type: "development"
        update-types: ["minor", "patch"]
      prod-minor-patch:
        dependency-type: "production"
        update-types: ["minor", "patch"]
  - package-ecosystem: pub
    directory: "/apps/mobile"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
      semver-major-days: 14
    # KNOWN_ERRORS 64: flutter_secure_storage 10+/11 cannot resolve next to our
    # path copy third_party/flutter_secure_storage_web (needs the platform
    # interface ^1) nor next to file_picker/share_plus (win32 5 vs 6), so every
    # group refresh failed with dependency_file_not_resolvable. Majors are taken
    # by hand together with the web copy.
    # https://docs.github.com/en/code-security/dependabot/working-with-dependabot/dependabot-options-reference (read 2026-11-07)
    ignore:
      - dependency-name: "flutter_secure_storage"
        update-types: ["version-update:semver-major"]
    groups:
      pub-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    # One PR for all action bumps (Node 20 actions are removed from the runners:
    # keeping them current is a security and a build-health matter).
    groups:
      actions:
        patterns: ["*"]
  # The node base image is pinned by digest in both Dockerfiles; dependabot
  # bumps the tag and the digest together.
  - package-ecosystem: docker
    directory: "/apps/api"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: docker
    directory: "/apps/admin"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
