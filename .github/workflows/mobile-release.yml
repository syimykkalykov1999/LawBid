# docs/06 §7.4 — release builds on a version tag (v1.2.3; the build number
# is automatic: minutes since 2026-01-01, android/app/build.gradle.kts
# autoBuildNumber), Fastlane lanes, release notes from Conventional Commits.
# Store uploads (Play Internal / TestFlight) run ONLY when the owner
# dispatches the workflow with upload=true: the owner tests on Android
# first and decides the closed-beta moment (docs/06 §11.2). Signing keys
# and API keys live in GitHub Secrets only.
#
# S11-12 staged rollout (a bad binary cannot be rolled back, so exposure ramps):
#   stage=internal    build + upload to Play Internal / TestFlight (the default)
#   stage=closed      promote the internal build to the Play closed track (no rebuild)
#   stage=production  promote closed -> production at `rollout` (default 5 %) +
#                     App Store release with a 7-day phased release
#   stage=promote     raise the production rollout to `rollout` (0.2 / 0.5 / 1.0)
#   stage=halt        halt the production rollout (Play); iOS: App Store Connect ->
#                     Pause phased release (no API lane exists for it)
# Between the steps the owner looks at Crashlytics / Sentry. A tag build or an
# upload FAILS when the signing secrets are empty (no debug-signed binaries are
# published). Docs: docs/runbooks/mobile-staged-rollout.md.
name: Mobile release

on:
  push:
    tags: ["v*.*.*"]
  # Store release (.github/workflows/store-release.yml, action=beta) calls this same
  # build + signing + upload, so the signing steps exist once.
  workflow_call:
    inputs:
      upload: { type: boolean, default: false }
      flavor: { type: string, default: prod }
      stage: { type: string, default: internal }
      rollout: { type: string, default: "0.05" }
  workflow_dispatch:
    inputs:
      upload:
        description: "Upload to Play Internal testing / TestFlight"
        type: boolean
        default: false
      flavor:
        description: "Flavor to build"
        type: choice
        options: [prod, staging]
        default: prod
      stage:
        description: "Release stage (see the header of this workflow)"
        type: choice
        options: [internal, closed, production, promote, halt]
        default: internal
      rollout:
        description: "Production rollout fraction for stage production / promote (0.05, 0.2, 0.5, 1.0)"
        type: string
        default: "0.05"

permissions:
  contents: write

env:
  FLAVOR: ${{ inputs.flavor || 'prod' }}

jobs:
  # A tag build is a release candidate: its commit must be green first.
  gate:
    name: Wait for green CI
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: read
      checks: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Every CI check of the tagged commit is green
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          scripts/ci/require-green.sh "$GITHUB_SHA" '^(Analyze, lint|Build check|gitleaks|CodeQL|API |Admin CI)' \
            '^(Wait for green CI|Release notes|Android|iOS|GitHub release|Promote|Notify)'

  notes:
    name: Release notes (Conventional Commits)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      body: ${{ steps.notes.outputs.body }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - id: notes
        run: |
          prev=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || git rev-list --max-parents=0 HEAD)
          {
            echo "body<<EOF"
            git log --pretty='- %s' "$prev..HEAD" | grep -E '^- (feat|fix|perf)(\(.*\))?!?:' || echo "- maintenance"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

  android:
    name: Android ${{ inputs.flavor || 'prod' }} AAB
    needs: [notes, gate]
    if: ${{ always() && needs.notes.result == 'success' && (needs.gate.result == 'success' || needs.gate.result == 'skipped') && (inputs.stage == '' || inputs.stage == 'internal') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Signing secrets only inside the protected `release` environment.
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with: { distribution: temurin, java-version: "17" }
      - name: Flutter version (apps/mobile/.fvmrc is the single pin)
        id: fv
        run: echo "v=$(jq -r .flutter apps/mobile/.fvmrc)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with: { flutter-version: "${{ steps.fv.outputs.v }}", channel: stable, cache: true }
      - uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1.336.0
        with: { ruby-version: "3.3", bundler-cache: true, working-directory: apps/mobile }
      - name: Dart defines
        working-directory: apps/mobile
        env:
          DART_DEFINES_JSON: ${{ secrets.MOBILE_DART_DEFINES_JSON }}
        run: |
          printf '%s' "$DART_DEFINES_JSON" > "config/${FLAVOR}.json"
          # Fail now (seconds), not after the build or in a published app.
          # Stripe / Sentry / App Store id may be empty until the owner fills
          # them: a warning, not a stop.
          bash ../../scripts/ci/check-dart-defines.sh "config/${FLAVOR}.json" --require API_BASE_URL DEEP_LINK_HOST --warn STRIPE_PUBLISHABLE_KEY SENTRY_DSN APP_STORE_ID
      - name: Keystore
        working-directory: apps/mobile
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          REQUIRE_SIGNING: ${{ (startsWith(github.ref, 'refs/tags/') || inputs.upload == true) && 'true' || 'false' }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
          elif [ "$REQUIRE_SIGNING" = "true" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is empty on a tag / upload build: refusing to publish a debug-signed binary"
            exit 1
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 not set — debug-signed build (never uploaded)"
          fi
      - name: Firebase config (prod flavor only)
        if: ${{ (inputs.flavor || 'prod') == 'prod' }}
        working-directory: apps/mobile
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
          REQUIRE_FIREBASE: ${{ (startsWith(github.ref, 'refs/tags/') || inputs.upload == true) && 'true' || 'false' }}
        run: |
          # google-services.json is git-ignored and the Gradle plugin only WARNs
          # when it is missing: a prod AAB would ship without push / App Check.
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            mkdir -p android/app/src/prod
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > android/app/src/prod/google-services.json
            jq -e .project_info android/app/src/prod/google-services.json >/dev/null || { echo "::error::GOOGLE_SERVICES_JSON_BASE64 is not a google-services.json"; exit 1; }
          elif [ "$REQUIRE_FIREBASE" = "true" ]; then
            echo "::error::GOOGLE_SERVICES_JSON_BASE64 is empty on a tag / upload build: the app would ship without push and App Check"
            exit 1
          else
            echo "::warning::GOOGLE_SERVICES_JSON_BASE64 not set: push is off in this build (never uploaded)"
            # build.gradle.kts fails a prod release without the file; this
            # dry run (never uploaded) is the one allowed exception.
            echo "LAWBID_ALLOW_NO_FIREBASE=1" >> "$GITHUB_ENV"
          fi
      - run: flutter pub get && dart run build_runner build --delete-conflicting-outputs
        working-directory: apps/mobile
      - name: fastlane build
        working-directory: apps/mobile/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: bundle exec fastlane android build flavor:${FLAVOR}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-${{ env.FLAVOR }}-aab
          path: apps/mobile/build/app/outputs/bundle/*/*.aab
      # Owner 2026-11-02: the Dart symbols of the obfuscated build, kept for every
      # release (a crash stack of build_id X is unreadable without them). Not
      # shipped in the app. docs/runbooks/STORE_RELEASE.md §6 (flutter symbolize).
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-${{ env.FLAVOR }}-symbols
          path: apps/mobile/build/symbols/android
          retention-days: 400
          if-no-files-found: error
      - name: Upload to Play Internal testing (owner-triggered only)
        if: ${{ inputs.upload == true && env.FLAVOR == 'prod' }}
        working-directory: apps/mobile/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          printf '%s' "$PLAY_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/play.json"
          PLAY_JSON_KEY_FILE="$RUNNER_TEMP/play.json" bundle exec fastlane android internal

  ios:
    name: iOS ${{ inputs.flavor || 'prod' }} IPA
    needs: [notes, gate]
    if: ${{ always() && needs.notes.result == 'success' && (needs.gate.result == 'success' || needs.gate.result == 'skipped') && (inputs.stage == '' || inputs.stage == 'internal') }}
    runs-on: macos-latest
    timeout-minutes: 60
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Xcode with the current iOS SDK (fail now, not at the store upload)
        run: bash scripts/ci/select-xcode.sh
      - name: Flutter version (apps/mobile/.fvmrc is the single pin)
        id: fv
        run: echo "v=$(jq -r .flutter apps/mobile/.fvmrc)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with: { flutter-version: "${{ steps.fv.outputs.v }}", channel: stable, cache: true }
      - uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1.336.0
        with: { ruby-version: "3.3", bundler-cache: true, working-directory: apps/mobile }
      - name: Dart defines
        working-directory: apps/mobile
        env:
          DART_DEFINES_JSON: ${{ secrets.MOBILE_DART_DEFINES_JSON }}
        run: |
          printf '%s' "$DART_DEFINES_JSON" > "config/${FLAVOR}.json"
          # Fail now (seconds), not after the build or in a published app.
          # Stripe / Sentry / App Store id may be empty until the owner fills
          # them: a warning, not a stop.
          bash ../../scripts/ci/check-dart-defines.sh "config/${FLAVOR}.json" --require API_BASE_URL DEEP_LINK_HOST --warn STRIPE_PUBLISHABLE_KEY SENTRY_DSN APP_STORE_ID
      # Same scheme as "Mobile testers": Xcode cloud-managed signing through the
      # App Store Connect API key (no p12 / provisioning-profile secrets, which
      # do not exist). Docs: docs/runbooks/mobile-testers-ci.md.
      - name: App Store Connect key (signing + upload)
        working-directory: apps/mobile
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          REQUIRE_SIGNING: ${{ (startsWith(github.ref, 'refs/tags/') || inputs.upload == true) && 'true' || 'false' }}
        run: |
          set -eu
          missing=""
          for v in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_CONTENT APPLE_TEAM_ID; do
            [ -n "$(printenv "$v")" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            if [ "$REQUIRE_SIGNING" = "true" ]; then echo "::error::iOS signing secrets are empty on a tag / upload build:$missing (docs/runbooks/mobile-testers-ci.md)"; exit 1; fi
            echo "::warning::iOS signing secrets not set ($missing ) - build skipped"; echo "SKIP_IOS=1" >> "$GITHUB_ENV"; exit 0
          fi
          echo "$ASC_KEY_CONTENT" | base64 -d > "$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          sed -i "" "s/REPLACE_TEAM_ID/$APPLE_TEAM_ID/" ios/ExportOptions.plist
          # Key file for fastlane (pilot) in its api_key_path format.
          ruby -rjson -e 'puts JSON.generate(key_id: ENV["ASC_KEY_ID"], issuer_id: ENV["ASC_ISSUER_ID"], key: File.read("#{ENV["RUNNER_TEMP"]}/AuthKey_#{ENV["ASC_KEY_ID"]}.p8"), in_house: false)' > "$RUNNER_TEMP/asc.json"
      - name: Firebase config (prod flavor only)
        if: ${{ env.SKIP_IOS != '1' && (inputs.flavor || 'prod') == 'prod' }}
        working-directory: apps/mobile
        env:
          GOOGLE_SERVICE_INFO_PLIST_BASE64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
          REQUIRE_FIREBASE: ${{ (startsWith(github.ref, 'refs/tags/') || inputs.upload == true) && 'true' || 'false' }}
        run: |
          if [ -n "$GOOGLE_SERVICE_INFO_PLIST_BASE64" ]; then
            echo "$GOOGLE_SERVICE_INFO_PLIST_BASE64" | base64 -d > ios/Runner/GoogleService-Info.plist
            grep -q "GOOGLE_APP_ID" ios/Runner/GoogleService-Info.plist || { echo "::error::GOOGLE_SERVICE_INFO_PLIST_BASE64 is not a GoogleService-Info.plist"; exit 1; }
          elif [ "$REQUIRE_FIREBASE" = "true" ]; then
            echo "::error::GOOGLE_SERVICE_INFO_PLIST_BASE64 is empty on a tag / upload build: the app would ship without push and App Check"
            exit 1
          else
            echo "::warning::GOOGLE_SERVICE_INFO_PLIST_BASE64 not set: push is off in this build (never uploaded)"
            # The Xcode "Firebase config" phase fails a Release-prod build
            # without the plist; this dry run (never uploaded) may skip it.
            echo "LAWBID_ALLOW_NO_FIREBASE=1" >> "$GITHUB_ENV"
          fi
      - run: flutter pub get && dart run build_runner build --delete-conflicting-outputs
        if: env.SKIP_IOS != '1'
        working-directory: apps/mobile
      - name: Flutter build (no signing; installs pods, obfuscated)
        if: env.SKIP_IOS != '1'
        working-directory: apps/mobile
        run: |
          flutter build ios --release --no-codesign --flavor "$FLAVOR" -t "lib/main_${FLAVOR}.dart" \
            --obfuscate --split-debug-info=build/symbols/ios \
            --dart-define-from-file="config/${FLAVOR}.json"
      - name: Archive + export (Xcode cloud-managed signing via the API key)
        if: env.SKIP_IOS != '1'
        working-directory: apps/mobile/ios
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -eu
          # Same place `flutter build ipa` used: sentry_dart_plugin finds the dSYMs here.
          ARCHIVE="$GITHUB_WORKSPACE/apps/mobile/build/ios/archive/Runner.xcarchive"
          mkdir -p "$(dirname "$ARCHIVE")"
          AUTH=(-allowProvisioningUpdates
                -authenticationKeyPath "$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
                -authenticationKeyID "$ASC_KEY_ID"
                -authenticationKeyIssuerID "$ASC_ISSUER_ID")
          xcodebuild archive -workspace Runner.xcworkspace -scheme "$FLAVOR" -configuration "Release-$FLAVOR" \
            -destination 'generic/platform=iOS' -archivePath "$ARCHIVE" "${AUTH[@]}"
          xcodebuild -exportArchive -archivePath "$ARCHIVE" \
            -exportPath "$RUNNER_TEMP/ipa" -exportOptionsPlist ExportOptions.plist "${AUTH[@]}"
      - name: Sentry symbols (prod; skips itself without a token)
        if: ${{ env.SKIP_IOS != '1' && env.FLAVOR == 'prod' }}
        continue-on-error: true  # a Sentry problem must not block the IPA / TestFlight
        working-directory: apps/mobile/ios
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
        run: bundle exec fastlane ios sentry_symbols
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: env.SKIP_IOS != '1'
        with:
          name: ios-${{ env.FLAVOR }}-ipa
          path: ${{ runner.temp }}/ipa/*.ipa
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: env.SKIP_IOS != '1'
        with:
          name: ios-${{ env.FLAVOR }}-symbols
          path: apps/mobile/build/symbols/ios
          retention-days: 400
          if-no-files-found: error
      - name: Upload to TestFlight (owner-triggered only)
        if: ${{ env.SKIP_IOS != '1' && inputs.upload == true && env.FLAVOR == 'prod' }}
        working-directory: apps/mobile/ios
        env:
          RELEASE_NOTES: ${{ needs.notes.outputs.body }}
        run: |
          bundle exec fastlane run upload_to_testflight \
            api_key_path:"$RUNNER_TEMP/asc.json" ipa:"$(ls "$RUNNER_TEMP"/ipa/*.ipa | head -1)" \
            changelog:"$RELEASE_NOTES" skip_waiting_for_build_processing:true

  # Stages after the build: no compile, only the store APIs.
  android-stage:
    name: Play stage ${{ inputs.stage }}
    if: ${{ inputs.stage == 'closed' || inputs.stage == 'production' || inputs.stage == 'promote' || inputs.stage == 'halt' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1.336.0
        with: { ruby-version: "3.3", bundler-cache: true, working-directory: apps/mobile }
      - name: Play lane
        working-directory: apps/mobile/android
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          STAGE: ${{ inputs.stage }}
          ROLLOUT: ${{ inputs.rollout }}
        run: |
          set -eu
          if [ -z "$PLAY_SERVICE_ACCOUNT_JSON" ]; then echo "::error::PLAY_SERVICE_ACCOUNT_JSON is empty"; exit 1; fi
          case "$ROLLOUT" in 0.05|0.1|0.2|0.5|1.0|1) ;; *) echo "::error::rollout must be 0.05, 0.1, 0.2, 0.5 or 1.0"; exit 1 ;; esac
          printf '%s' "$PLAY_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/play.json"
          PLAY_JSON_KEY_FILE="$RUNNER_TEMP/play.json" bundle exec fastlane android "$STAGE" rollout:"$ROLLOUT"

  ios-release:
    name: App Store phased release
    if: ${{ inputs.stage == 'production' }}
    runs-on: macos-latest
    timeout-minutes: 20
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1.336.0
        with: { ruby-version: "3.3", bundler-cache: true, working-directory: apps/mobile }
      - name: Submit the TestFlight build with a 7-day phased release
        working-directory: apps/mobile/ios
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
        run: bundle exec fastlane ios release_phased

  github-release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [notes, android, ios]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { path: dist }
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          body: ${{ needs.notes.outputs.body }}
          files: dist/**/*
