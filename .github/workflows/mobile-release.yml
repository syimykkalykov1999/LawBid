# docs/06 §7.4 — release builds on a version tag (v1.2.3 → build number =
# run number), Fastlane lanes, release notes from Conventional Commits.
# Store uploads (Play Internal / TestFlight) run ONLY when the owner
# dispatches the workflow with upload=true: the owner tests on Android
# first and decides the closed-beta moment (docs/06 §11.2). Signing keys
# and API keys live in GitHub Secrets only.
name: Mobile release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      upload:
        description: "Upload to Play Internal testing / TestFlight"
        type: boolean
        default: false
      flavor:
        description: "Flavor to build"
        type: choice
        options: [prod, staging]
        default: prod

permissions:
  contents: write

env:
  FLAVOR: ${{ inputs.flavor || 'prod' }}
  BUILD_NUMBER: ${{ github.run_number }}

jobs:
  notes:
    name: Release notes (Conventional Commits)
    runs-on: ubuntu-latest
    outputs:
      body: ${{ steps.notes.outputs.body }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - id: notes
        run: |
          prev=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || git rev-list --max-parents=0 HEAD)
          {
            echo "body<<EOF"
            git log --pretty='- %s' "$prev..HEAD" | grep -E '^- (feat|fix|perf)(\(.*\))?!?:' || echo "- maintenance"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

  android:
    name: Android ${{ inputs.flavor || 'prod' }} AAB
    needs: [notes]
    runs-on: ubuntu-latest
    # Signing secrets only inside the protected `release` environment.
    environment: release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - uses: ruby/setup-ruby@v1
        with: { ruby-version: "3.3", bundler-cache: true, working-directory: apps/mobile }
      - name: Dart defines
        working-directory: apps/mobile
        env:
          DART_DEFINES_JSON: ${{ secrets.MOBILE_DART_DEFINES_JSON }}
        run: printf '%s' "$DART_DEFINES_JSON" > "config/${FLAVOR}.json"
      - name: Keystore
        working-directory: apps/mobile
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 not set — debug-signed build"
          fi
      - run: flutter pub get && dart run build_runner build --delete-conflicting-outputs
        working-directory: apps/mobile
      - name: fastlane build
        working-directory: apps/mobile/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: bundle exec fastlane android build flavor:${FLAVOR}
      - uses: actions/upload-artifact@v4
        with:
          name: android-${{ env.FLAVOR }}-aab
          path: apps/mobile/build/app/outputs/bundle/*/*.aab
      - name: Upload to Play Internal testing (owner-triggered only)
        if: ${{ inputs.upload == true && env.FLAVOR == 'prod' }}
        working-directory: apps/mobile/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          printf '%s' "$PLAY_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/play.json"
          PLAY_JSON_KEY_FILE="$RUNNER_TEMP/play.json" bundle exec fastlane android internal

  ios:
    name: iOS ${{ inputs.flavor || 'prod' }} IPA
    needs: [notes]
    runs-on: macos-latest
    environment: release
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - uses: ruby/setup-ruby@v1
        with: { ruby-version: "3.3", bundler-cache: true, working-directory: apps/mobile }
      - name: Dart defines
        working-directory: apps/mobile
        env:
          DART_DEFINES_JSON: ${{ secrets.MOBILE_DART_DEFINES_JSON }}
        run: printf '%s' "$DART_DEFINES_JSON" > "config/${FLAVOR}.json"
      - name: Signing (certificate + profile from secrets)
        env:
          IOS_CERT_P12_BASE64: ${{ secrets.IOS_CERT_P12_BASE64 }}
          IOS_CERT_PASSWORD: ${{ secrets.IOS_CERT_PASSWORD }}
          IOS_PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
        run: |
          if [ -z "$IOS_CERT_P12_BASE64" ]; then echo "::warning::iOS signing secrets not set — build skipped"; echo "SKIP_IOS=1" >> "$GITHUB_ENV"; exit 0; fi
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          security create-keychain -p "" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "" "$KEYCHAIN"
          echo "$IOS_CERT_P12_BASE64" | base64 -d > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$IOS_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN"
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$IOS_PROFILE_BASE64" | base64 -d > ~/Library/MobileDevice/Provisioning\ Profiles/lawbid.mobileprovision
      - run: flutter pub get && dart run build_runner build --delete-conflicting-outputs
        if: env.SKIP_IOS != '1'
        working-directory: apps/mobile
      - name: fastlane build
        if: env.SKIP_IOS != '1'
        working-directory: apps/mobile/ios
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          sed -i "" "s/REPLACE_TEAM_ID/$APPLE_TEAM_ID/" ExportOptions.plist
          bundle exec fastlane ios build flavor:${FLAVOR}
      - uses: actions/upload-artifact@v4
        if: env.SKIP_IOS != '1'
        with:
          name: ios-${{ env.FLAVOR }}-ipa
          path: apps/mobile/build/ios/ipa/*.ipa
      - name: Upload to TestFlight (owner-triggered only)
        if: ${{ env.SKIP_IOS != '1' && inputs.upload == true && env.FLAVOR == 'prod' }}
        working-directory: apps/mobile/ios
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
          RELEASE_NOTES: ${{ needs.notes.outputs.body }}
        run: bundle exec fastlane ios testflight_upload

  github-release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [notes, android, ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist }
      - uses: softprops/action-gh-release@v2
        with:
          body: ${{ needs.notes.outputs.body }}
          files: dist/**/*
