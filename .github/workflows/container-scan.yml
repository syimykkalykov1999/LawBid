# docs/06_PRODUCTION.md §4.4 (stage 6.1): build the API image and scan it
# with Trivy; CRITICAL/HIGH vulnerabilities fail the check.
name: Container scan

on:
  pull_request:
    branches: [main, master]
    paths:
      - "apps/api/**"
      - "packages/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/container-scan.yml"
  push:
    branches: [main, master]

permissions:
  contents: read
  security-events: write

jobs:
  trivy:
    name: Build image + Trivy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -f apps/api/Dockerfile -t lawbid-api:ci .
      # npm itself (the node image's own CLI, only used by the migrate task)
      # is skipped: its bundled packages are not reachable from requests.
      # The trivy-action tag 0.28.0 no longer resolves, so run the pinned
      # Trivy CLI image against the local image instead.
      - name: Trivy (fail on CRITICAL/HIGH)
        run: |
          # Readable list in the log first, then the gating SARIF run.
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD:/out" \
            aquasec/trivy:0.58.0 image \
            --severity CRITICAL,HIGH --ignore-unfixed --exit-code 0 \
            --skip-dirs /usr/local/lib/node_modules/npm \
            --ignorefile /out/.trivyignore \
            --format table lawbid-api:ci
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD:/out" \
            aquasec/trivy:0.58.0 image \
            --severity CRITICAL,HIGH --ignore-unfixed --exit-code 1 \
            --skip-dirs /usr/local/lib/node_modules/npm \
            --ignorefile /out/.trivyignore \
            --format sarif --output /out/trivy.sarif lawbid-api:ci
      - uses: github/codeql-action/upload-sarif@v4
        if: ${{ always() && vars.CODE_SCANNING_ENABLED == 'true' && hashFiles('trivy.sarif') != '' }}
        # Needs GitHub code scanning; a private repo without it must not
        # turn the scan itself red.
        continue-on-error: true
        with:
          sarif_file: trivy.sarif
