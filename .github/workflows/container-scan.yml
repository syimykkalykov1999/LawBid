# docs/06_PRODUCTION.md §4.4 (stage 6.1): build the API image and scan it
# with Trivy; CRITICAL/HIGH vulnerabilities fail the check.
name: Container scan

on:
  # Runs after a merge into main and once a day (not on every PR); results go to Security → Code scanning.
  # Dedup D-27: deploy.yml already builds the API image on every push to main,
  # so a push builds it a second time here only when API-related files
  # changed; the daily run scans the image whatever changed.
  push:
    branches: [main, master]
    paths:
      - "apps/api/**"
      - "packages/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/container-scan.yml"
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  trivy:
    name: Build image + Trivy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Build image
        run: docker build -f apps/api/Dockerfile -t lawbid-api:ci .
      # npm itself (the node image's own CLI, only used by the migrate task)
      # is skipped: its bundled packages are not reachable from requests.
      # The trivy-action tag 0.28.0 no longer resolves, so run the pinned
      # Trivy CLI image against the local image instead.
      - name: Trivy (fail on CRITICAL/HIGH)
        run: |
          # The vulnerability DB is fetched once into a shared cache, trying
          # each official mirror in turn (mirror.gcr.io has served a broken
          # blob), then both scans read it without updating.
          mkdir -p "$RUNNER_TEMP/trivy-cache"
          ok=
          for repo in mirror.gcr.io/aquasec/trivy-db:2 ghcr.io/aquasecurity/trivy-db:2 public.ecr.aws/aquasecurity/trivy-db:2; do
            if docker run --rm -v "$RUNNER_TEMP/trivy-cache:/root/.cache/trivy" \
              aquasec/trivy:0.58.0 image --download-db-only --db-repository "$repo"; then
              ok=1; break
            fi
            echo "Trivy DB from $repo failed, trying the next mirror"
          done
          [ -n "$ok" ] || { echo "No Trivy DB mirror answered"; exit 1; }
          # Readable list in the log first, then the gating SARIF run.
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$RUNNER_TEMP/trivy-cache:/root/.cache/trivy" \
            -v "$PWD:/out" \
            aquasec/trivy:0.58.0 image --skip-db-update \
            --severity CRITICAL,HIGH --ignore-unfixed --exit-code 0 \
            --skip-dirs /usr/local/lib/node_modules/npm \
            --ignorefile /out/.trivyignore \
            --format table lawbid-api:ci
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$RUNNER_TEMP/trivy-cache:/root/.cache/trivy" \
            -v "$PWD:/out" \
            aquasec/trivy:0.58.0 image --skip-db-update \
            --severity CRITICAL,HIGH --ignore-unfixed --exit-code 1 \
            --skip-dirs /usr/local/lib/node_modules/npm \
            --ignorefile /out/.trivyignore \
            --format sarif --output /out/trivy.sarif lawbid-api:ci
      - uses: github/codeql-action/upload-sarif@4bfa242aa49c5f7c6770b98670d354a7dfac05f8 # v3.39.1
        if: ${{ always() && vars.CODE_SCANNING_ENABLED == 'true' && hashFiles('trivy.sarif') != '' }}
        # Needs GitHub code scanning; a private repo without it must not
        # turn the scan itself red.
        continue-on-error: true
        with:
          sarif_file: trivy.sarif

  # S11-6: a failure on main / on a schedule reaches the owner (notify-failure.yml).
  notify:
    name: Notify the owner
    needs: [trivy]
    if: ${{ always() && contains(needs.*.result, 'failure') && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'schedule') }}
    permissions:
      contents: read
      issues: write
      id-token: write
    uses: ./.github/workflows/notify-failure.yml
    with:
      title: "Container scan failed on main (CRITICAL/HIGH vulnerability in the API image)"
      kind: scan
      remind_after_minutes: 720
    secrets: inherit
