# AWS cleanup audit 2026-10-23 - READ-ONLY inventory of the AWS account.
# Actions -> "AWS inventory" -> Run workflow. Lists every resource by service,
# marks the unused / idle / forgotten ones (FLAG), and shows the last 30 days
# of cost by service. The Markdown report is written to the job summary and
# uploaded as the artifact `aws-inventory`. Nothing is changed or deleted.
# Plain-language guide: docs/runbooks/AWS_CLEANUP.md.
#
# Repository secrets (never in the repo):
#   AWS_INVENTORY_ROLE  terraform output `inventory_role_arn` (infra/bootstrap):
#                       a read-only role; until it exists, the deploy role
#                       (AWS_DEPLOY_ROLE_PROD) can be used but sees only a part.
#   AWS_REGION
name: AWS inventory

on:
  workflow_dispatch:
    inputs:
      regions:
        description: "Regions to scan, comma separated (empty = the main region only; add the documents replica region)"
        required: false
        default: ""

permissions:
  id-token: write
  contents: read

concurrency:
  group: aws-inventory
  cancel-in-progress: false

jobs:
  inventory:
    name: List what exists and what looks unused
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ secrets.AWS_INVENTORY_ROLE || secrets.AWS_DEPLOY_ROLE_PROD }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Build the report
        env:
          REGIONS: ${{ inputs.regions || secrets.AWS_REGION }}
        run: |
          mkdir -p out
          scripts/aws/inventory.sh "$REGIONS" > out/aws-inventory.md
          # Safety net: the report holds names, ids and sizes only. Stop if
          # anything that looks like a key or a password got in.
          if grep -Eq 'AKIA[0-9A-Z]{16}|aws_secret_access_key|-----BEGIN [A-Z ]*PRIVATE KEY' out/aws-inventory.md; then
            echo "::error::the report looks like it contains a secret; not published"
            rm -f out/aws-inventory.md
            exit 1
          fi
          FLAGS=$(grep -c 'FLAG' out/aws-inventory.md || true)
          {
            echo "## AWS inventory: $FLAGS FLAG lines"
            echo
            cat out/aws-inventory.md
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: aws-inventory
          path: out/aws-inventory.md
          retention-days: 30
