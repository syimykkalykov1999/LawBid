# Copies the multi-arch (amd64 + arm64) ClamAV image into our ECR, tag
# `1.4-debian`, so the worker can run on Graviton (cpu_architecture = ARM64).
# Why not `clamav/clamav:1.4`: that (alpine) image is amd64 only. The
# `clamav/clamav-debian` image is the same ClamAV, published for amd64 AND
# arm64. Fargate never pulls from Docker Hub (rate limits), hence the copy.
# No build: `docker buildx imagetools create` copies the manifest list.
#
# Run once: Actions -> "Mirror ClamAV" -> Run workflow. Then set
#   clamav_image = "<ECR_REGISTRY>/lawbid-clamav:1.4-debian"
# in the prod tfvars (docs/runbooks/DEPLOY_PROD.md, ARM64 step). ECR tags are
# IMMUTABLE: an existing tag is left alone (the run just says so).
# Secrets used: AWS_DEPLOY_ROLE_PROD, AWS_REGION, ECR_REGISTRY (same as deploy.yml).
name: Mirror ClamAV

on:
  workflow_dispatch:
    inputs:
      source:
        description: "Upstream multi-arch image"
        required: false
        default: "clamav/clamav-debian:1.4"
      target_tag:
        description: "Tag in ECR lawbid-clamav"
        required: false
        default: "1.4-debian"

permissions:
  id-token: write
  contents: read

concurrency:
  group: mirror-clamav
  cancel-in-progress: false

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}

jobs:
  mirror:
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_PROD }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Copy the manifest list
        env:
          SOURCE: ${{ inputs.source }}
          TARGET_TAG: ${{ inputs.target_tag }}
        run: |
          if aws ecr describe-images --repository-name lawbid-clamav --image-ids imageTag="$TARGET_TAG" >/dev/null 2>&1; then
            echo "::notice::lawbid-clamav:$TARGET_TAG already in ECR (tags are immutable), nothing to do"
          else
            docker buildx imagetools create -t "$ECR_REGISTRY/lawbid-clamav:$TARGET_TAG" "$SOURCE"
          fi
      - name: Proof - the copy has arm64
        env:
          TARGET_TAG: ${{ inputs.target_tag }}
        run: |
          docker buildx imagetools inspect "$ECR_REGISTRY/lawbid-clamav:$TARGET_TAG" | tee /tmp/inspect.txt
          grep -q "linux/arm64" /tmp/inspect.txt && grep -q "linux/amd64" /tmp/inspect.txt
