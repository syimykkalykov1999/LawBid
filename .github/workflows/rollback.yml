# One-button rollback of production (scaling TZ, point 9): Actions →
# "Rollback production" → Run workflow → the image tag of a previous good
# release (the commit SHA shown in an earlier "Deploy" run). Re-points
# api / worker / admin at that image with the same rolling update as a
# deploy, then runs the smoke checks. It skips staging and migrations on
# purpose: migrations are expand/contract only (docs/02 §7.1), so the
# previous release still runs against the current schema.
# S11-8/9: its OWN concurrency group (`rollback`): an unapproved Deploy waiting
# for a click must never block a rollback in an incident. With an empty
# image_tag it goes back to the last release that passed deploy's smoke +
# synthetic check (SSM /lawbid-prod/deploy/last_good_tag; if that one is the
# release running now, the one before it). `services` limits the roll to the
# failing service(s) (api, worker, admin) so the others are not touched. A
# rollback never reverts the database: new-schema columns stay, the old release
# ignores them (expand/contract, docs/02 §7.1).
# Needs the same secrets as deploy.yml and the `production` environment
# (its required reviewers still approve the rollback).
#
# Audit #10 (2026-10-22): the web app too — `web_release` = a commit SHA
# whose build is still under releases/<sha>/ in the web bucket, or
# `previous` (the release before the current one). One write to the
# CloudFront release switch (scripts/deploy/web-release.sh); nothing is
# uploaded. Leave an input empty to keep that part as it is.
name: Rollback production

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to go back to (commit SHA of a previous good deploy); empty = the last known good release (and keep the web app unless web_release is set)"
        required: false
        default: ""
      services:
        description: "Which services to roll back, space-separated: api worker admin"
        required: false
        default: "api worker admin"
      web_release:
        description: "Web app release to go back to (commit SHA, or 'previous'); empty = keep the web app"
        required: false
        default: ""

permissions:
  id-token: write
  contents: read

concurrency:
  group: rollback
  cancel-in-progress: false

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
  SERVICES: ${{ inputs.services }}

jobs:
  rollback:
    name: Roll production back (${{ inputs.image_tag || 'last good release' }})
    # Web-only rollback (web_release set, no image_tag) leaves the services alone.
    if: ${{ vars.DEPLOY_ENABLED == 'true' && (inputs.image_tag != '' || inputs.web_release == '') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_PROD }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Which release to go back to
        env:
          WANT_TAG: ${{ inputs.image_tag }}
        run: |
          set -eu
          TAG="$WANT_TAG"
          if [ -z "$TAG" ]; then TAG=$(scripts/deploy/rollback-target.sh lawbid-prod); fi
          if ! echo "$TAG" | grep -Eq '^[0-9a-zA-Z._-]{7,128}$'; then echo "::error::not an image tag: '$TAG'"; exit 1; fi
          echo "IMAGE_TAG=$TAG" >> "$GITHUB_ENV"
          echo "Rolling back to **$TAG** (services: $SERVICES)" >> "$GITHUB_STEP_SUMMARY"
      - name: Image exists in ECR
        run: |
          for REPO in lawbid-api lawbid-admin; do
            aws ecr describe-images --repository-name "$REPO" --image-ids imageTag="$IMAGE_TAG" >/dev/null
          done
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Verify the image signatures (hard only when SIGN_REQUIRED=true)
        continue-on-error: ${{ vars.SIGN_REQUIRED != 'true' }}
        run: |
          set -eu
          for repo in lawbid-api lawbid-admin; do
            DIGEST=$(aws ecr describe-images --repository-name "$repo" --image-ids imageTag="$IMAGE_TAG" --query 'imageDetails[0].imageDigest' --output text)
            cosign verify "$ECR_REGISTRY/$repo@$DIGEST" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              --certificate-identity-regexp "(?i)^https://github\.com/${{ github.repository }}/\.github/workflows/deploy\.yml@refs/heads/main$" >/dev/null
            echo "signature OK: $repo@$DIGEST"
          done
      - name: Rolling update (only the chosen services)
        env:
          ROLL_POLL_SECONDS: "10"
        run: scripts/deploy/roll-services.sh lawbid-prod "$IMAGE_TAG" "$SERVICES"
      - name: Smoke (the answering tasks run the rollback tag)
        run: |
          case " $SERVICES " in
            *" api "*) scripts/deploy/smoke.sh "${{ secrets.PROD_API_URL }}" "${{ secrets.PROD_ADMIN_URL }}" "$IMAGE_TAG" ;;
            *) scripts/deploy/smoke.sh "${{ secrets.PROD_API_URL }}" "${{ secrets.PROD_ADMIN_URL }}" ;;
          esac
      - name: The rolled-back release is the last good one again
        continue-on-error: true
        if: ${{ inputs.services == 'api worker admin' }}
        run: aws ssm put-parameter --name "/lawbid-prod/deploy/last_good_tag" --type String --overwrite --value "$IMAGE_TAG" >/dev/null

  web:
    name: Roll the web app back to ${{ inputs.web_release }}
    if: ${{ vars.WEB_DEPLOY_ENABLED == 'true' && inputs.web_release != '' }}
    runs-on: ubuntu-latest
    environment:
      name: production
    # Never at the same time as a web deploy.
    concurrency:
      group: web-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_PROD }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Switch the live web release
        env:
          WANT: ${{ inputs.web_release }}
          BUCKET: ${{ secrets.WEB_BUCKET }}
          DIST: ${{ secrets.WEB_DISTRIBUTION_ID }}
        run: |
          R=scripts/deploy/web-release.sh
          ARN=$($R store "$DIST")
          if [ -z "$ARN" ]; then
            echo "No release switch: infra/modules/web is not applied yet (old root layout, no web rollback)."
            exit 1
          fi
          LIVE=$($R get "$ARN" web_release)
          if [ "$WANT" = "previous" ]; then WANT=$($R get "$ARN" web_previous); fi
          if ! echo "$WANT" | grep -Eq '^[0-9a-f]{7,40}$'; then
            echo "Not a release: '$WANT' (a commit SHA, or 'previous' after two versioned deploys)."
            exit 1
          fi
          aws s3api head-object --bucket "$BUCKET" --key "releases/$WANT/index.html" >/dev/null || {
            echo "releases/$WANT/ is not in the bucket (only the last 10 releases are kept)."
            exit 1
          }
          # The build's top-level names, as the deploy wrote them.
          PATHS=$(aws s3api list-objects-v2 --bucket "$BUCKET" --prefix "releases/$WANT/" --delimiter / \
            --query '[CommonPrefixes[].Prefix, Contents[].Key][]' --output text \
            | tr '\t' '\n' | grep -v '^None$' | sed -e "s|^releases/$WANT/||" -e 's|/$||' | grep -v '^$' | paste -sd, -)
          $R put "$ARN" web_app_paths "$PATHS"
          if [ -n "$LIVE" ] && [ "$LIVE" != "$WANT" ]; then $R put "$ARN" web_previous "$LIVE"; fi
          $R put "$ARN" web_release "$WANT"
          aws s3 cp "s3://$BUCKET/releases/$WANT/index.html" "s3://$BUCKET/index.html" --cache-control "no-cache"
          aws cloudfront create-invalidation --distribution-id "$DIST" --paths "/index.html" >/dev/null
          echo "Live web release: $WANT (was: ${LIVE:-none})"

  notify:
    name: Tell the owner
    needs: [rollback, web]
    if: ${{ always() && needs.rollback.result != 'skipped' || always() && needs.web.result != 'skipped' }}
    permissions:
      contents: read
      issues: write
      id-token: write
    uses: ./.github/workflows/notify-failure.yml
    with:
      title: ${{ (contains(needs.*.result, 'failure') && 'Production ROLLBACK FAILED') || 'Production rollback finished' }}
      kind: rollback
      severity: ${{ (contains(needs.*.result, 'failure') && 'error') || 'info' }}
    secrets: inherit
