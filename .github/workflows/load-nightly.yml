# Owner 2026-10-14 (architecture audit, step 9): a small k6 run against STAGING
# every night, so a slow feed or search shows up before users feel it.
# 2026-10-26 (audit X-14): it now runs the same suite as the big load tests,
# loadtest/k6/main.js with the `nightly` profile (loadtest/profiles.json),
# instead of the older apps/api/k6 scripts. That suite uses minted tokens and
# never requests an SMS code (lib/http.js refuses /auth/otp unless
# K6_SMS_ALLOWED=true), so the nightly run costs nothing in SMS.
# It does nothing until the owner adds three secrets (docs/perf/README.md ->
# "Accounts"): STAGING_API_URL, STAGING_WS_URL and the two JSON files made by
# loadtest/scripts/mint.mjs and discover.mjs: STAGING_TOKENS_JSON,
# STAGING_FIXTURES_JSON.
name: Load test (nightly)

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

# Security research #5 (2026-10-22), A2: least privilege — the job only reads
# the repository (no GITHUB_TOKEN writes anywhere in this workflow).
permissions:
  contents: read

jobs:
  k6:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      STAGING_API_URL: ${{ secrets.STAGING_API_URL }}
    steps:
      - name: Staging is not configured yet
        if: env.STAGING_API_URL == ''
        run: echo "Add the STAGING_* secrets to run the nightly load test."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.STAGING_API_URL != ''
      - uses: grafana/setup-k6-action@43b9fc21641a76002687994433dd586f56e791b1 # v1.2.2
        if: env.STAGING_API_URL != ''
      - name: Write the token and fixture files
        if: env.STAGING_API_URL != ''
        env:
          TOKENS_JSON: ${{ secrets.STAGING_TOKENS_JSON }}
          FIXTURES_JSON: ${{ secrets.STAGING_FIXTURES_JSON }}
        run: |
          printf '%s' "$TOKENS_JSON" > "$RUNNER_TEMP/tokens.json"
          printf '%s' "$FIXTURES_JSON" > "$RUNNER_TEMP/fixtures.json"
      - name: k6 - profile nightly (feed, search, chat, cases; 5 minutes; no SMS)
        if: env.STAGING_API_URL != ''
        env:
          API_URL: ${{ secrets.STAGING_API_URL }}
          WS_URL: ${{ secrets.STAGING_WS_URL }}
        run: |
          host="$(printf '%s' "$API_URL" | sed -E 's#^[a-z]+://([^/:?]+).*#\1#' | tr '[:upper:]' '[:lower:]')"
          k6 run --no-color \
            -e PROFILE=nightly -e API_URL="$API_URL" -e WS_URL="$WS_URL" \
            -e ALLOW_HOSTS="$host" \
            -e TOKENS_FILE="$RUNNER_TEMP/tokens.json" -e FIXTURES_FILE="$RUNNER_TEMP/fixtures.json" \
            loadtest/k6/main.js
