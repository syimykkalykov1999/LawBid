# Mobile CI — docs/01_FOUNDATION_AUTH.md §16 DoD ("CI зелёный: ...,
# сборка Android и iOS"), scoped to apps/mobile.
#
# No melos/fvm config exists in the repo (single Flutter app, not a
# multi-package workspace), so every step runs directly against
# apps/mobile with `working-directory`.
#
# Flutter/Dart version: pubspec.yaml only pins a floor
# (`sdk: ">=3.5.0 <4.0.0"`), not an exact version — no .fvmrc or lockfile
# pins one either. This workflow uses `channel: stable` (always satisfies
# that floor) rather than a pinned old version like the historical
# 3.5.0 minimum, because pubspec.yaml's own comments describe a Riverpod
# 2->3 / Freezed 2->4 migration done specifically to work with a newer
# analyzer than the 3.5.0-era Flutter ships — pinning to the old floor
# would likely fail codegen. Once the team wants fully reproducible builds,
# pin an exact `flutter-version` here (and commit an .fvmrc) instead of
# floating on `stable`.

name: Mobile CI

on:
  merge_group:
    types: [checks_requested]
  pull_request:
    branches: [main, master]
    paths:
      - "apps/mobile/**"
      # The generated API client is a path dependency (lawbid_api).
      - "packages/api-contract/**"
      - ".github/workflows/mobile-ci.yml"
      - ".github/pub-audit-allowlist.json"
      - "scripts/ci/pub-*.mjs"
      - "scripts/ci/check-web-*.sh"
  push:
    branches: [main, master]
    paths:
      - "apps/mobile/**"
      # The generated API client is a path dependency (lawbid_api).
      - "packages/api-contract/**"
      - ".github/workflows/mobile-ci.yml"
      - ".github/pub-audit-allowlist.json"
      - "scripts/ci/pub-*.mjs"
      - "scripts/ci/check-web-*.sh"

# S11-1: only a superseded PR run is cancelled; a push to main must always finish
# (its result is what the deploy gate reads) and a merge-queue run is never cancelled.
concurrency:
  group: mobile-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Security research #5 (2026-10-22), A2: least privilege — the job only reads
# the repository (no GITHUB_TOKEN writes anywhere in this workflow).
permissions:
  contents: read

jobs:
  analyze-and-test:
    name: Analyze, lint checks, unit/widget/golden tests
    # Runs on macOS, not the usual ubuntu-latest, specifically because the
    # golden-test PNGs under apps/mobile/test/**/goldens/ were generated on
    # a macOS dev machine, and this repo's golden tests render real
    # embedded fonts via golden_toolkit's loadAppFonts() (see
    # test/flutter_test_config.dart) rather than a placeholder font — text
    # rasterization for those real fonts is known to differ subtly between
    # macOS and Linux, which risks false-positive golden failures on
    # ubuntu-latest that have nothing to do with an actual regression. This
    # was a judgment call (spec is silent on runner OS) — see docs/
    # CHANGELOG.md's CI-pipeline entry. If goldens still fail here on a
    # real PR with no visual regression, they need regenerating on macOS
    # via `flutter test --update-goldens` and committing the new PNGs, not
    # silencing this job.
    runs-on: macos-latest
    # 40 minutes cut `flutter test` short on busy macOS runners (2026-10-26,
    # #419, #384): the suite itself had not failed.
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The PR's merge commit and its base, for the phone-golden guard.
          fetch-depth: 2

      # Desktop web plan 2026-10-28 §9: the desktop web work never changes
      # the phone — an existing golden outside test/desktop/ may not change
      # (new ones may be added). Owner-approved phone change: PR label
      # "phone-goldens-approved".
      - name: Phone goldens unchanged (blocking)
        if: github.event_name == 'pull_request'
        env:
          ALLOW_PHONE_GOLDEN_CHANGE: ${{ contains(github.event.pull_request.labels.*.name, 'phone-goldens-approved') && '1' || '0' }}
        run: scripts/ci/check-web-phone-goldens.sh

      - name: Flutter version (apps/mobile/.fvmrc is the single pin)
        id: fv
        run: echo "v=$(jq -r .flutter apps/mobile/.fvmrc)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ steps.fv.outputs.v }}
          channel: "stable"

      - name: flutter pub get
        working-directory: apps/mobile
        run: flutter pub get

      - name: Generate code (freezed/riverpod/json_serializable/drift)
        working-directory: apps/mobile
        run: dart run build_runner build --delete-conflicting-outputs

      - name: flutter analyze
        working-directory: apps/mobile
        run: flutter analyze

      - name: No new hardcoded strings or colours (blocking)
        # file 01 §9.4 (localization) and §8.1 (colours), file 06 §7.2.3.
        # Audit #15 (2026-10-22): blocking against a baseline of the
        # findings that existed then (tool/ci/hardcoded_*.allow); a new one
        # fails. How to fix or allow one: the header of
        # tool/ci/hardcoded_check.py.
        working-directory: apps/mobile
        run: python3 tool/ci/hardcoded_check.py

      - name: flutter test (unit, widget, golden)
        working-directory: apps/mobile
        run: flutter test

  # Mobile dependency audit (2026-10-22), docs/06 §4.4. Separate Ubuntu job:
  # the OSV-Scanner action is a Docker action (not available on macOS
  # runners). BLOCKING: a known vulnerability in apps/mobile/pubspec.lock
  # fails the check unless it is in .github/pub-audit-allowlist.json (id,
  # package, reason, expiry date; see scripts/ci/pub-audit-gate.mjs).
  dependency-audit:
    name: Dependency audit (OSV, blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Flutter version (apps/mobile/.fvmrc is the single pin)
        id: fv
        run: echo "v=$(jq -r .flutter apps/mobile/.fvmrc)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ steps.fv.outputs.v }}
          channel: "stable"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.23.4"

      - name: flutter pub get
        working-directory: apps/mobile
        run: flutter pub get

      # Outdated / discontinued packages: information for the job summary,
      # not a gate (a newer major is not a vulnerability).
      - name: dart pub outdated (report)
        working-directory: apps/mobile
        continue-on-error: true
        run: |
          dart pub outdated --json --no-dev-dependencies > "$RUNNER_TEMP/outdated.json"
          node scripts/ci/pub-outdated-summary.mjs "$RUNNER_TEMP/outdated.json" >> "$GITHUB_STEP_SUMMARY"

      # Exit code 1 = vulnerabilities found; the gate below decides
      # (allowlist). Any other failure leaves no JSON and the gate fails.
      - name: OSV-Scanner on pubspec.lock
        continue-on-error: true
        uses: google/osv-scanner-action/osv-scanner-action@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
        with:
          scan-args: |-
            --lockfile=apps/mobile/pubspec.lock
            --format=json
            --output=osv-results.json

      - name: Gate (allowlist .github/pub-audit-allowlist.json)
        run: |
          test -s osv-results.json || { echo "::error::OSV-Scanner produced no result file"; exit 1; }
          node scripts/ci/pub-audit-gate.mjs osv-results.json

  build-android:
    name: Build check — Android (debug)
    needs: analyze-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Flutter version (apps/mobile/.fvmrc is the single pin)
        id: fv
        run: echo "v=$(jq -r .flutter apps/mobile/.fvmrc)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ steps.fv.outputs.v }}
          channel: "stable"

      - name: flutter pub get
        working-directory: apps/mobile
        run: flutter pub get

      - name: Generate code (freezed/riverpod/json_serializable/drift)
        working-directory: apps/mobile
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build debug APK (build-check only — no signing, no publish)
        working-directory: apps/mobile
        run: flutter build apk --debug

  build-web:
    name: Build check — Web (wasm, no deploy)
    needs: analyze-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Flutter version (apps/mobile/.fvmrc is the single pin)
        id: fv
        run: echo "v=$(jq -r .flutter apps/mobile/.fvmrc)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ steps.fv.outputs.v }}
          channel: "stable"

      - name: flutter pub get
        working-directory: apps/mobile
        run: flutter pub get

      - name: Generate code (freezed/riverpod/json_serializable/drift)
        working-directory: apps/mobile
        run: dart run build_runner build --delete-conflicting-outputs

      # Owner 2026-10-15 (web, step 1): the same app builds for the browser
      # (WebAssembly). Build check only: nothing is published, and the
      # bundle stays closed unless WEB_ENABLED is set at deploy time.
      - name: Build web (build-check only — no deploy)
        working-directory: apps/mobile
        run: >-
          flutter build web --wasm -t lib/main_dev.dart
          --dart-define-from-file=config/dev.example.json
          --dart-define=WEB_ENABLED=true

      - name: The web bundle has its database files
        working-directory: apps/mobile
        run: |
          test -s build/web/sqlite3.wasm
          test -s build/web/drift_worker.js
          test -s build/web/main.dart.wasm

      # Privacy round 13 (S13-12): zero third-party analytics / ad tags.
      - name: The web bundle ships no third-party tags
        run: bash scripts/ci/check-web-no-third-party-tags.sh

  build-ios:
    name: Build check — iOS (debug, unsigned)
    needs: analyze-and-test
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Flutter version (apps/mobile/.fvmrc is the single pin)
        id: fv
        run: echo "v=$(jq -r .flutter apps/mobile/.fvmrc)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ steps.fv.outputs.v }}
          channel: "stable"

      - name: flutter pub get
        working-directory: apps/mobile
        run: flutter pub get

      - name: Generate code (freezed/riverpod/json_serializable/drift)
        working-directory: apps/mobile
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build debug iOS app (build-check only — no codesign, no publish)
        working-directory: apps/mobile
        run: flutter build ios --debug --no-codesign

  # S11-6: a failure on main / on a schedule reaches the owner (notify-failure.yml).
  notify:
    name: Notify the owner
    needs: [analyze-and-test, dependency-audit, build-android, build-web, build-ios]
    if: ${{ always() && contains(needs.*.result, 'failure') && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    permissions:
      contents: read
      issues: write
      id-token: write
    uses: ./.github/workflows/notify-failure.yml
    with:
      title: "Mobile CI is red on main"
      kind: ci-mobile
      remind_after_minutes: 360
    secrets: inherit
