# CI audit 2026-11-01 (docs/dev/CI_FAILURES_AUDIT_2026-11-01.md).
#
# ONE status check for the whole pull request: "CI gate". It waits until every
# other check of the PR's head commit has finished and is green
# (scripts/ci/require-green.sh, the same script the deploy gate uses), so a
# repository ruleset needs to require only this one name:
#
#   Settings > Rules > Rulesets > New branch ruleset > main >
#   "Require status checks to pass" > add "CI gate"
#
# Why not require "API CI" / "Mobile CI" / "admin-ci" directly: they have path
# filters, so a PR that touches none of their paths never gets that check and
# the merge hangs at "Expected - waiting for status" forever. Path-filtered
# workflows that did not start are simply absent here, and "Repo guards"
# (no path filter) must always be present, so an untested PR cannot pass.
name: CI gate

on:
  merge_group:
    types: [checks_requested]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-gate-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  checks: read

jobs:
  gate:
    name: CI gate
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # A merge-queue run has its own checks; the queue reads them directly.
    if: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          sparse-checkout: scripts/ci
      - name: Let the other workflows register their checks
        run: sleep 90
      - name: Every other check of this commit is green
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha }}
          REQUIRE_GREEN_TIMEOUT: "5100"
        run: |
          scripts/ci/require-green.sh "$SHA" \
            '^Repo guards$' \
            '^(CI gate|Notify the owner|Dependabot auto-merge|Container scan|Build image \+ Trivy|Synthetic|Self-check)'
