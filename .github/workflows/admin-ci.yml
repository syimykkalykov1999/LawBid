# apps/admin (docs/06 §2, §7.2): types generated from the committed
# openapi.json, then typecheck, lint and a production build. No deploy
# here — §7.3 is a later stage.
name: admin-ci

on:
  merge_group:
    types: [checks_requested]
  push:
    branches: [main, master]
    paths:
      - "apps/admin/**"
      - "packages/api-contract/openapi.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/admin-ci.yml"
      - ".github/npm-audit-allowlist.json"
      - "scripts/ci/npm-audit-gate.mjs"
      - "docs/runbooks/**"
      - "scripts/guides-check.mjs"
  pull_request:
    branches: [main, master]
    paths:
      - "apps/admin/**"
      - "packages/api-contract/openapi.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/admin-ci.yml"
      - ".github/npm-audit-allowlist.json"
      - "scripts/ci/npm-audit-gate.mjs"
      - "docs/runbooks/**"
      - "scripts/guides-check.mjs"

# S11-1: only a superseded PR run is cancelled; a push to main must always finish
# (its result is what the deploy gate reads) and a merge-queue run is never cancelled.
concurrency:
  group: admin-ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: Admin CI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Shallow: the history is ~3 GB and a full clone hit the 15-minute job limit
          # (KNOWN_ERRORS #38). The audit step below only needs the PR base commit,
          # fetched on its own just after.
          fetch-depth: 1
      - name: Fetch the PR base commit (for the audit diff)
        if: ${{ github.event_name == 'pull_request' }}
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: git fetch --depth=1 origin "$BASE"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.12.1"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Generate API types
        run: npm run generate --workspace apps/admin
      - name: Typecheck
        run: npx tsc --noEmit -p apps/admin/tsconfig.json
      - name: Lint
        run: npm run lint --workspace apps/admin
      - name: Unit + component tests
        run: npm test --workspace apps/admin
      - name: Dependency audit (high and critical block)
        # Audit 2026-11-02 (S-7): CI gated only apps/api, so the admin's
        # postcss (high) and tinypool (critical) sat there unseen until #608.
        # Same gate, allowlist and PR-vs-main rule as api-ci.yml: a NEW
        # advisory is only a warning on a PR that changes no dependency, and
        # blocks on push to main and on every PR that does.
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -u
          if [ "${{ github.event_name }}" = "pull_request" ] && [ -n "$BASE" ] \
             && git cat-file -e "$BASE^{commit}" 2>/dev/null \
             && [ -z "$(git diff --name-only "$BASE" HEAD -- package.json package-lock.json 'apps/*/package.json' .github/npm-audit-allowlist.json scripts/ci/npm-audit-gate.mjs)" ]; then
            node scripts/ci/npm-audit-gate.mjs --workspace apps/admin || {
              echo "::warning title=Dependency audit::a new advisory exists, but this PR changes no dependency, so it is not blocked here. Fix it in its own PR or add it to .github/npm-audit-allowlist.json."
              exit 0
            }
          else
            node scripts/ci/npm-audit-gate.mjs --workspace apps/admin
          fi
      - name: Every owner runbook has a guide (docs/runbooks/GUIDES_MAP.json)
        run: npm run guides:check --workspace apps/admin
      - name: Build
        run: npm run build --workspace apps/admin
        env:
          API_BASE_URL: http://localhost:3000/api/v1

  # OPEN_ITEMS_SWEEP 2026-11-09 B-c11: Lighthouse (@lhci/cli, Apache-2.0) on the
  # three heavy admin pages (users, audit journal, cases) against a real API
  # stand: postgres + redis services, migrated schema, the API from this commit,
  # one admin signed in (apps/api/scripts/lhci-admin.ts), the admin built and
  # started like production. Desktop, CPU x4, budgets in apps/admin/lighthouserc.cjs.
  # NON-blocking for now: every stand / Lighthouse step is `continue-on-error`
  # at STEP level (a job-level flag still reports the check red to the deploy
  # gate), so the job records the numbers (summary + artifact) and stays green;
  # the budgets flip to errors once the baseline is known.
  lighthouse:
    name: Admin Lighthouse (3 heavy pages, CPU x4, with API)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16@sha256:9e2cf6287f25c3151f4c9421ccce2b17f3e60061c111a29165e0d2cdd9ff0a97
        env:
          POSTGRES_USER: root
          POSTGRES_PASSWORD: lawbid
          POSTGRES_DB: lawbid_ci
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432
        options: >-
          --health-cmd "pg_isready -U root -d lawbid_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine@sha256:57e4255cc971b1c8d6f8a6ca283ac01bc3ecdd914273ef6bfaede87aaecd6541
        ports:
          - 6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - name: Point the job at its service containers (random host ports)
        env:
          PG_PORT: ${{ job.services.postgres.ports['5432'] }}
          REDIS_PORT: ${{ job.services.redis.ports['6379'] }}
        run: scripts/ci/service-env.sh
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.12.1"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Prisma generate + migrate a clean database
        working-directory: apps/api
        run: npx prisma generate && npx prisma migrate deploy && node prisma/run-concurrent.mjs
      - name: Build and start the API (test env, this commit)
        id: api
        continue-on-error: true
        working-directory: apps/api
        env:
          # nest build needs the same heap as the other API jobs (KNOWN_ERRORS 23 / N-1).
          NODE_OPTIONS: --max-old-space-size=6144
        run: |
          set -eu
          npm run build
          # .env.test = the e2e settings (mock SMS/email, fixed OTP); DATABASE_URL /
          # REDIS_URL from the services above win over the file.
          # .env.test carries localhost:5432 / :6379; the services listen on random
          # ports (service-env.sh), so keep the job's values over the file's.
          DB="$DATABASE_URL"; RD="$REDIS_URL"
          set -a; . ./.env.test; set +a
          export DATABASE_URL="$DB" REDIS_URL="$RD" PORT=3000
          export ADMIN_LOGIN_LIMIT_PER_IP_PER_HOUR=1000
          nohup node dist/src/main.js > "$RUNNER_TEMP/api.log" 2>&1 &
          # A cold runner boots the API in 2–4 min (run 42658592498 was still
          # mapping routes at 120 s): wait up to 6 min, then show warn/error lines only.
          for _ in $(seq 1 180); do curl -fsS http://localhost:3000/health/live >/dev/null 2>&1 && break; sleep 2; done
          curl -fsS http://localhost:3000/health/live >/dev/null || { echo "::error::the API did not start in 6 min"; grep -v '"level":30' "$RUNNER_TEMP/api.log" | tail -40; exit 1; }
      - name: One admin signed in (token for the Lighthouse cookie)
        if: steps.api.outcome == 'success'
        id: admin_token
        continue-on-error: true
        working-directory: apps/api
        run: |
          set -eu
          DB="$DATABASE_URL"
          set -a; . ./.env.test; set +a
          export DATABASE_URL="$DB" API_URL=http://localhost:3000
          TOKEN=$(npx ts-node --transpile-only scripts/lhci-admin.ts)
          echo "::add-mask::$TOKEN"
          echo "LHCI_ADMIN_TOKEN=$TOKEN" >> "$GITHUB_ENV"
      - name: Generate API types, build and start the admin
        if: steps.admin_token.outcome == 'success'
        id: admin
        continue-on-error: true
        env:
          NODE_OPTIONS: --max-old-space-size=6144
          API_BASE_URL: http://localhost:3000/api/v1
          COOKIE_SECURE: "false"
        run: |
          set -eu
          npm run generate --workspace apps/admin
          npm run build --workspace apps/admin
          (cd apps/admin && nohup npm start > "$RUNNER_TEMP/admin.log" 2>&1 &)
          for _ in $(seq 1 30); do curl -fsS -o /dev/null http://localhost:3001/login && break; sleep 2; done
          curl -fsS -o /dev/null http://localhost:3001/login || { echo "::error::the admin did not start"; tail -50 "$RUNNER_TEMP/admin.log"; exit 1; }
      - name: Lighthouse (3 runs per page, median)
        if: steps.admin.outcome == 'success'
        continue-on-error: true
        working-directory: apps/admin
        env:
          LHCI_ADMIN_URL: http://localhost:3001
        run: npx --yes @lhci/cli@0.15.1 autorun --config=lighthouserc.cjs
      - name: Numbers into the job summary
        if: always()
        working-directory: apps/admin
        run: |
          {
            echo "## Admin Lighthouse (desktop, CPU x4)"
            echo "stand: api=${{ steps.api.outcome }} token=${{ steps.admin_token.outcome }} admin=${{ steps.admin.outcome }} (non-blocking first runs)"
            echo "| page | performance | accessibility | LCP ms | TBT ms | CLS |"
            echo "|---|---|---|---|---|---|"
            for f in .lighthouseci/lhr-*.json; do
              [ -f "$f" ] || continue
              jq -r '"| \(.finalDisplayedUrl | sub("https?://[^/]+"; "")) | \((.categories.performance.score*100)|round) | \((.categories.accessibility.score*100)|round) | \(.audits["largest-contentful-paint"].numericValue|round) | \(.audits["total-blocking-time"].numericValue|round) | \(.audits["cumulative-layout-shift"].numericValue*1000|round/1000) |"' "$f"
            done
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the Lighthouse reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: admin-lighthouse
          path: apps/admin/.lighthouseci
          if-no-files-found: ignore

  # S11-6: a failure on main / on a schedule reaches the owner (notify-failure.yml).
  notify:
    name: Notify the owner
    needs: [build]
    if: ${{ always() && contains(needs.*.result, 'failure') && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    permissions:
      contents: read
      issues: write
      id-token: write
    uses: ./.github/workflows/notify-failure.yml
    with:
      title: "Admin CI is red on main"
      kind: ci-admin
      remind_after_minutes: 360
    secrets: inherit
