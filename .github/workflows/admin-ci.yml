# apps/admin (docs/06 §2, §7.2): types generated from the committed
# openapi.json, then typecheck, lint and a production build. No deploy
# here — §7.3 is a later stage.
name: admin-ci

on:
  merge_group:
    types: [checks_requested]
  push:
    branches: [main, master]
    paths:
      - "apps/admin/**"
      - "packages/api-contract/openapi.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/admin-ci.yml"
      - ".github/npm-audit-allowlist.json"
      - "scripts/ci/npm-audit-gate.mjs"
      - "docs/runbooks/**"
      - "scripts/guides-check.mjs"
  pull_request:
    branches: [main, master]
    paths:
      - "apps/admin/**"
      - "packages/api-contract/openapi.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/admin-ci.yml"
      - ".github/npm-audit-allowlist.json"
      - "scripts/ci/npm-audit-gate.mjs"
      - "docs/runbooks/**"
      - "scripts/guides-check.mjs"

# S11-1: only a superseded PR run is cancelled; a push to main must always finish
# (its result is what the deploy gate reads) and a merge-queue run is never cancelled.
concurrency:
  group: admin-ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: Admin CI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Shallow: the history is ~3 GB and a full clone hit the 15-minute job limit
          # (KNOWN_ERRORS #38). The audit step below only needs the PR base commit,
          # fetched on its own just after.
          fetch-depth: 1
      - name: Fetch the PR base commit (for the audit diff)
        if: ${{ github.event_name == 'pull_request' }}
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: git fetch --depth=1 origin "$BASE"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.12.1"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Generate API types
        run: npm run generate --workspace apps/admin
      - name: Typecheck
        run: npx tsc --noEmit -p apps/admin/tsconfig.json
      - name: Lint
        run: npm run lint --workspace apps/admin
      - name: Unit + component tests
        run: npm test --workspace apps/admin
      - name: Dependency audit (high and critical block)
        # Audit 2026-11-02 (S-7): CI gated only apps/api, so the admin's
        # postcss (high) and tinypool (critical) sat there unseen until #608.
        # Same gate, allowlist and PR-vs-main rule as api-ci.yml: a NEW
        # advisory is only a warning on a PR that changes no dependency, and
        # blocks on push to main and on every PR that does.
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -u
          if [ "${{ github.event_name }}" = "pull_request" ] && [ -n "$BASE" ] \
             && git cat-file -e "$BASE^{commit}" 2>/dev/null \
             && [ -z "$(git diff --name-only "$BASE" HEAD -- package.json package-lock.json 'apps/*/package.json' .github/npm-audit-allowlist.json scripts/ci/npm-audit-gate.mjs)" ]; then
            node scripts/ci/npm-audit-gate.mjs --workspace apps/admin || {
              echo "::warning title=Dependency audit::a new advisory exists, but this PR changes no dependency, so it is not blocked here. Fix it in its own PR or add it to .github/npm-audit-allowlist.json."
              exit 0
            }
          else
            node scripts/ci/npm-audit-gate.mjs --workspace apps/admin
          fi
      - name: Every owner runbook has a guide (docs/runbooks/GUIDES_MAP.json)
        run: npm run guides:check --workspace apps/admin
      - name: Build
        run: npm run build --workspace apps/admin
        env:
          API_BASE_URL: http://localhost:3000/api/v1

  # S11-6: a failure on main / on a schedule reaches the owner (notify-failure.yml).
  notify:
    name: Notify the owner
    needs: [build]
    if: ${{ always() && contains(needs.*.result, 'failure') && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    permissions:
      contents: read
      issues: write
      id-token: write
    uses: ./.github/workflows/notify-failure.yml
    with:
      title: "Admin CI is red on main"
      kind: ci-admin
      remind_after_minutes: 360
    secrets: inherit
