# CI audit 2026-11-01 (docs/dev/CI_FAILURES_AUDIT_2026-11-01.md).
#
# Cheap, repo-wide guards that used to live only in path-filtered workflows
# and so were skipped on exactly the PRs that broke them:
#   * i18n audit - ran only in API CI (paths apps/api/**); a mobile-only or
#     admin-only PR that used a key missing from the xlsx was green on the PR
#     and red on main.
#   * SEO generator tests (AASA / assetlinks vs AndroidManifest.xml) - ran only
#     on push to main; a manifest change in a mobile PR broke main
#     (/verification/wizard, 01.11).
# No path filter on purpose, so the check "Repo guards" ALWAYS reports and can
# be a required status check without ever hanging at "Expected".
name: Repo guards

on:
  merge_group:
    types: [checks_requested]
  pull_request:
    branches: [main, master]

concurrency:
  group: repo-guards-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  guards:
    name: Repo guards
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.23.4"

      # The audits need only exceljs and fontkit (versions of package-lock.json),
      # not the whole monorepo install.
      - name: Install exceljs and fontkit only
        run: |
          V=$(node -p "require('./package-lock.json').packages['node_modules/exceljs'].version")
          F=$(node -p "require('./package-lock.json').packages['node_modules/fontkit'].version")
          # Installed beside the repo, not in it: npm 10 cannot re-resolve the
          # whole workspace tree without the lock file (vitest 4 peers crash
          # arborist), and this job needs only exceljs and fontkit.
          mkdir "$RUNNER_TEMP/audit-deps"
          npm install --prefix "$RUNNER_TEMP/audit-deps" --no-save --no-package-lock --ignore-scripts --no-audit --no-fund "exceljs@$V" "fontkit@$F"
          ln -s "$RUNNER_TEMP/audit-deps/node_modules" node_modules

      - name: Translations are complete in every language
        run: node scripts/i18n-audit.mjs --ci

      # Owner 2026-11-02: languages once showed squares/crosses instead of text.
      - name: Fonts cover every language (UI only; server PDFs are a known gap)
        run: node scripts/i18n-glyph-audit.mjs --ci

      - name: SEO generator tests (deep links vs the Android manifest)
        run: node --test scripts/seo/test/*.test.mjs

      - name: Self-tests of the CI helper scripts
        run: |
          node --test scripts/ci/flag-first-check.test.mjs scripts/ci/npm-audit-gate.test.mjs
          bash scripts/ci/require-green.test.sh
          bash scripts/ci/check-dart-defines.test.sh
          bash scripts/ci/select-xcode.test.sh
