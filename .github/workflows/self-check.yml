# Zero maintenance (owner 2026-10-05): every morning, check that the things
# protecting production are still in place — API healthy, alarms wired and
# quiet, alert e-mail confirmed, budget present, services running, a fresh
# database backup, a recent restore drill (scripts/ops/self-check.sh).
# A failed run makes GitHub e-mail the owner; the run summary says in
# Russian what is wrong and what to do.
#
# Read-only. Uses AWS_SELFCHECK_ROLE_PROD (an OIDC role with read access:
# cloudwatch:DescribeAlarms, sns:ListTopics, sns:ListSubscriptionsByTopic,
# budgets:ViewBudget, ecs:DescribeServices) or, until it exists, the deploy
# role. Runs only when DEPLOY_ENABLED is 'true' (after «ставь на AWS»).
name: Self-check (production)

on:
  schedule:
    - cron: "17 13 * * *" # 06:17 in California
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  self-check:
    name: Is everything still protected?
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_SELFCHECK_ROLE_PROD || secrets.AWS_DEPLOY_ROLE_PROD }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Self-check
        run: scripts/ops/self-check.sh prod "${{ secrets.PROD_API_URL }}"

  # S11-6: a failure on main / on a schedule reaches the owner (notify-failure.yml).
  notify:
    name: Notify the owner
    needs: [self-check]
    if: ${{ always() && contains(needs.*.result, 'failure') && true }}
    permissions:
      contents: read
      issues: write
      id-token: write
    uses: ./.github/workflows/notify-failure.yml
    with:
      title: "Daily self-check of production failed (something that protects prod is off)"
      kind: self-check
      remind_after_minutes: 720
    secrets: inherit
