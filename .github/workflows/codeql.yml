# docs/06_PRODUCTION.md §4.4 (stage 6.1): SAST on every PR; critical
# findings block merging through the required check.
name: CodeQL

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]
  schedule:
    - cron: "0 3 * * 1"

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: CodeQL (javascript-typescript)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@4bfa242aa49c5f7c6770b98670d354a7dfac05f8 # v3.39.1
        with:
          languages: javascript-typescript
          queries: security-extended
      # Uploading to the Security tab needs GitHub code scanning enabled on
      # the repository. Set the repository variable CODE_SCANNING_ENABLED
      # to 'true' once it is; until then the results are kept as an
      # artifact so the scan itself does not fail.
      - uses: github/codeql-action/analyze@4bfa242aa49c5f7c6770b98670d354a7dfac05f8 # v3.39.1
        with:
          category: "/language:javascript-typescript"
          upload: ${{ vars.CODE_SCANNING_ENABLED == 'true' && 'always' || 'never' }}
          output: codeql-results
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ always() && vars.CODE_SCANNING_ENABLED != 'true' }}
        with:
          name: codeql-sarif
          path: codeql-results
          if-no-files-found: ignore
