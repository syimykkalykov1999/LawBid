# docs/06_PRODUCTION.md §4.4 (stage 6.1): SAST on every PR; critical
# findings block merging through the required check.
name: CodeQL

on:
  # Runs once per merge into main and once a day (not on every PR): the PR checks that gate a merge are
  # API CI, admin-ci, Mobile CI and Secret scan; CodeQL findings appear under Security → Code scanning.
  push:
    branches: [main, master]
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: CodeQL (javascript-typescript)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: github/codeql-action/init@4bfa242aa49c5f7c6770b98670d354a7dfac05f8 # v3.39.1
        with:
          languages: javascript-typescript
          queries: security-extended
      # Uploading to the Security tab needs GitHub code scanning enabled on
      # the repository. Set the repository variable CODE_SCANNING_ENABLED
      # to 'true' once it is; until then the results are kept as an
      # artifact so the scan itself does not fail.
      - uses: github/codeql-action/analyze@4bfa242aa49c5f7c6770b98670d354a7dfac05f8 # v3.39.1
        with:
          category: "/language:javascript-typescript"
          upload: ${{ vars.CODE_SCANNING_ENABLED == 'true' && 'always' || 'never' }}
          output: codeql-results
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ always() && vars.CODE_SCANNING_ENABLED != 'true' }}
        with:
          name: codeql-sarif
          path: codeql-results
          if-no-files-found: ignore

  # S11-6: a failure on main / on a schedule reaches the owner (notify-failure.yml).
  notify:
    name: Notify the owner
    needs: [analyze]
    if: ${{ always() && contains(needs.*.result, 'failure') && github.event_name != 'pull_request' && github.event_name != 'merge_group' }}
    permissions:
      contents: read
      issues: write
      id-token: write
    uses: ./.github/workflows/notify-failure.yml
    with:
      title: "CodeQL found a problem on main"
      kind: scan-codeql
      remind_after_minutes: 720
    secrets: inherit
