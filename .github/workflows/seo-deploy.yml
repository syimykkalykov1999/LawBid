# Owner 2026-10-15 — the public, search-engine-readable pages of the web
# app (scripts/seo): practice area x state landing pages, attorney
# profiles, sitemap.xml and robots.txt. Built from the API's public
# directory and published next to the web app (same bucket, own
# prefixes). Rebuilt every day so new attorneys appear.
#
# Owner 2026-10-16: the company site (repository LawBidSite: /about, the
# legal pages, pricing, FAQ...) is built here too and published with
# these pages (scripts/seo/merge-site.mjs); the app owns the root. A site
# change shows up with the next daily run, or run this workflow by hand.
#
# Runs only when the repository variable WEB_DEPLOY_ENABLED is 'true'.
# Secrets/variables: see web-deploy.yml (WEB_BUCKET, WEB_DISTRIBUTION_ID,
# AWS_DEPLOY_ROLE_PROD, AWS_REGION) plus
#   WEB_SITE_URL       https://<web host>
#   WEB_SEO_API_URL    https://api.<domain>/api/v1
# Repository variable ANDROID_APP_SHA256: SHA-256 of the app-signing
# certificate (Play Console → App integrity), comma-separated if several.
#
# Programmatic-SEO switches. Owner 2026-10-27: the admin page «Продвижение»
# is the source of truth (GET <WEB_SEO_API_URL>/public/seo-settings, step
# "Resolve the switches"); the repository variables below are the fallback
# where the admin never decided or the API cannot be reached. Every switch
# is OFF when set nowhere, so the public output is unchanged until the owner
# turns it on. What each does: docs/runbooks/SEO_STATIC_PAGES.md
#   SEO_SITEMAP_INDEX=true   /sitemap.xml becomes an index of /sitemaps/*.xml
#   SEO_ROBOTS_AI=true       search/answer bots in, training bots out
#   SEO_LLMS=true            /llms.txt and /llms-full.txt
#   SEO_QUALITY_GATE=true    thin pages: noindex and out of the sitemaps
#   SEO_RAMP_PER_DAY=200     at most N new pages a day enter the index
#   SEO_INCREMENTAL=true     upload only changed files, reset the CDN only for them (<= 30 paths a day)
#   SEO_MAX_PAGES=2000       directory pages of 100 attorneys the build may read; more data FAILS the build instead of truncating
name: SEO pages

on:
  schedule:
    - cron: "17 4 * * *"
  push:
    branches: [main]
    paths:
      - "scripts/seo/**"
      - ".github/workflows/seo-deploy.yml"
  workflow_dispatch:
    inputs:
      index_empty:
        description: "Index state x practice pages that have no attorneys yet"
        type: boolean
        default: false
      dry_run:
        description: "Build and plan only: print what would change, publish nothing"
        type: boolean
        default: false
      allow_mass_delete:
        description: "Allow a run that removes over 30% of the published files"
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

concurrency:
  group: seo-deploy
  cancel-in-progress: false

jobs:
  test:
    name: Generator tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.23.4"
      - run: node --test scripts/seo/test/*.test.mjs

  deploy:
    name: Build and publish the pages
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: ${{ vars.WEB_DEPLOY_ENABLED == 'true' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.23.4"

      # AWS is configured first: the previous run's manifest (content hashes,
      # real lastmod dates, the new-page counter) is read from the bucket.
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_PROD }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Read the previous manifest
        run: aws s3 cp "s3://${{ secrets.WEB_BUCKET }}/seo-manifest.json" prev-seo-manifest.json || echo "no previous manifest (first run)"

      # Owner 2026-10-27: the switches set in the admin («Продвижение») win;
      # the repository variables above are the fallback where the admin never
      # decided (or the API is unreachable). The result lands in $GITHUB_ENV
      # as SEO_* (1 = on, empty = off), read by the steps below.
      - name: Resolve the switches (admin first, repository variables as fallback)
        env:
          VAR_SEO_SITEMAP_INDEX: ${{ vars.SEO_SITEMAP_INDEX }}
          VAR_SEO_ROBOTS_AI: ${{ vars.SEO_ROBOTS_AI }}
          VAR_SEO_LLMS: ${{ vars.SEO_LLMS }}
          VAR_SEO_QUALITY_GATE: ${{ vars.SEO_QUALITY_GATE }}
          VAR_SEO_RAMP_PER_DAY: ${{ vars.SEO_RAMP_PER_DAY }}
          VAR_SEO_INCREMENTAL: ${{ vars.SEO_INCREMENTAL }}
        run: node scripts/seo/resolve-switches.mjs --api "${{ secrets.WEB_SEO_API_URL }}" >> "$GITHUB_ENV"

      - name: Build the pages from the public directory
        env:
          SEO_PREV_MANIFEST: prev-seo-manifest.json
        run: >-
          node scripts/seo/build.mjs
          --api "${{ secrets.WEB_SEO_API_URL }}"
          --site "${{ secrets.WEB_SITE_URL }}"
          --out dist-seo
          --max-pages "${{ vars.SEO_MAX_PAGES || '2000' }}"
          ${{ inputs.index_empty && '--index-empty' || '' }}

      - name: Check out the company site
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: syimykkalykov1999/LawBidSite
          path: site

      - name: Build the company site (static, one folder per page)
        working-directory: site
        env:
          TRAILING_SLASH: "1"
          NEXT_PUBLIC_SITE_URL: ${{ secrets.WEB_SITE_URL }}
          NEXT_PUBLIC_APP_STORE_URL: ${{ vars.NEXT_PUBLIC_APP_STORE_URL }}
          NEXT_PUBLIC_PLAY_STORE_URL: ${{ vars.NEXT_PUBLIC_PLAY_STORE_URL }}
          NEXT_PUBLIC_SUPPORT_EMAIL: ${{ vars.NEXT_PUBLIC_SUPPORT_EMAIL }}
          PRICING_API_URL: ${{ secrets.WEB_SEO_API_URL }}
        run: |
          npm ci
          npm run build:static
          test -s out/about/index.html

      # App links (iOS + Android): written before the merge so that
      # public-paths.txt lists .well-known and web-deploy.yml never deletes it.
      # assetlinks.json needs the Play app-signing SHA-256 (repository
      # variable ANDROID_APP_SHA256); without it only the iOS file is published.
      - name: App links (/.well-known)
        env:
          ANDROID_APP_SHA256: ${{ vars.ANDROID_APP_SHA256 }}
        run: node scripts/seo/well-known.mjs --out dist-seo

      - name: Merge the site into the pages (one sitemap)
        run: >-
          node scripts/seo/merge-site.mjs
          --seo dist-seo --site site/out
          --site-url "${{ secrets.WEB_SITE_URL }}"

      # What changed since the last published run (content hashes). Always
      # computed so the log shows it; only used to publish when
      # SEO_INCREMENTAL=true. Exit 3 = it would delete over 30% of the files.
      - name: Plan the publish
        shell: bash
        continue-on-error: ${{ env.SEO_INCREMENTAL != '1' }}
        run: >-
          node scripts/seo/publish-plan.mjs
          --dir dist-seo --prev prev-seo-manifest.json --plan seo-plan
          ${{ (inputs.dry_run || env.SEO_INCREMENTAL != '1') && '--dry-run' || '' }}
          ${{ inputs.allow_mass_delete && '--allow-mass-delete' || '' }}
          | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Dry run result
        if: ${{ inputs.dry_run }}
        run: |
          cat seo-plan/plan.json
          echo "--- sitemap.xml (head) ---"; head -c 1500 dist-seo/sitemap.xml
          echo "--- robots.txt ---"; cat dist-seo/robots.txt

      # Only changed files go up; the manifest goes LAST, so a failed run is
      # simply planned again. Pages are cached for an hour (max-age=3600);
      # the CDN is reset only for changed paths, at most 30 a day, never /*.
      - name: Publish the changed files
        if: ${{ !inputs.dry_run && env.SEO_INCREMENTAL == '1' }}
        run: |
          B="s3://${{ secrets.WEB_BUCKET }}"
          mkdir -p seo-stage
          if [ -s seo-plan/upload.txt ]; then
            rsync -a --files-from=seo-plan/upload.txt dist-seo/ seo-stage/
            aws s3 cp seo-stage "$B" --recursive --exclude "_next/*" --exclude ".well-known/*" \
              --exclude "seo-manifest.json" --cache-control "public,max-age=3600"
            if [ -d seo-stage/_next ]; then
              aws s3 cp seo-stage/_next "$B/_next" --recursive --cache-control "public,max-age=31536000,immutable"
            fi
          fi
          # App links: always (2 small files); both must be application/json, no redirect.
          for f in apple-app-site-association assetlinks.json; do
            if [ -f "dist-seo/.well-known/$f" ]; then
              aws s3 cp "dist-seo/.well-known/$f" "$B/.well-known/$f" \
                --content-type application/json --cache-control "public,max-age=3600"
            fi
          done
          for f in seo-plan/delete-*.json; do
            [ -f "$f" ] || continue
            aws s3api delete-objects --bucket "${{ secrets.WEB_BUCKET }}" --delete "file://$f" > /dev/null
          done
          if [ -s seo-plan/invalidate.txt ]; then
            # shellcheck disable=SC2046
            aws cloudfront create-invalidation --distribution-id "${{ secrets.WEB_DISTRIBUTION_ID }}" \
              --paths $(tr '\n' ' ' < seo-plan/invalidate.txt)
          fi
          aws s3 cp dist-seo/seo-manifest.json "$B/seo-manifest.json" \
            --content-type application/json --cache-control "no-cache"

      # Each first-level folder is replaced as a whole; the app's own files
      # (index.html, main.dart.*, canvaskit, assets...) are never touched.
      # public-paths.txt tells web-deploy.yml which names to keep.
      - name: Publish (each prefix is replaced as a whole)
        if: ${{ !inputs.dry_run && env.SEO_INCREMENTAL != '1' }}
        working-directory: dist-seo
        run: |
          B="s3://${{ secrets.WEB_BUCKET }}"
          for d in */ .well-known/; do
            [ -d "$d" ] || continue
            d="${d%/}"
            if [ "$d" = "_next" ]; then
              aws s3 sync "_next" "$B/_next" --delete \
                --cache-control "public,max-age=31536000,immutable"
            else
              aws s3 sync "$d" "$B/$d" --delete --cache-control "public,max-age=3600"
            fi
          done
          # App links for the phone apps (iOS needs it served as JSON).
          # Both must be application/json and served without a redirect.
          for f in apple-app-site-association assetlinks.json; do
            if [ -f ".well-known/$f" ]; then
              aws s3 cp ".well-known/$f" "$B/.well-known/$f" \
                --content-type application/json --cache-control "public,max-age=3600"
            fi
          done
          for f in *; do
            [ -f "$f" ] || continue
            case "$f" in
              sitemap.xml) t=application/xml ;;
              robots.txt|public-paths.txt|llms.txt|llms-full.txt) t=text/plain ;;
              *) t="" ;;
            esac
            aws s3 cp "$f" "$B/$f" --cache-control "public,max-age=3600" ${t:+--content-type "$t"}
          done

      # Never /* (that would also reset the app). Wildcards by folder: the
      # public pages' folders, the site's pages and the discovery files; at
      # most 30 paths. `_next` is content-hashed and never needs a reset.
      - name: Reset the CDN cache for the pages
        if: ${{ !inputs.dry_run && env.SEO_INCREMENTAL != '1' }}
        working-directory: dist-seo
        run: |
          paths="/lawyers/* /attorneys/* /practice-areas/* /sitemap.xml /robots.txt"
          [ -d sitemaps ] && paths="$paths /sitemaps/*"
          for f in llms.txt llms-full.txt; do [ -f "$f" ] && paths="$paths /$f"; done
          [ -d .well-known ] && paths="$paths /.well-known/*"
          for n in *; do
            [ -e "$n" ] || continue
            case "$n" in
              _next|lawyers|attorneys|practice-areas|sitemaps|sitemap.xml|robots.txt|llms.txt|llms-full.txt|public-paths.txt|seo-manifest.json|index.html) continue ;;
            esac
            if [ -d "$n" ]; then paths="$paths /$n/*"; else paths="$paths /$n"; fi
          done
          set -f
          # shellcheck disable=SC2086
          set -- $paths
          set +f
          aws cloudfront create-invalidation --distribution-id "${{ secrets.WEB_DISTRIBUTION_ID }}" --paths "${@:1:30}"
