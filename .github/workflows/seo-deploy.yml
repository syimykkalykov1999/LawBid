# Owner 2026-10-15 — the public, search-engine-readable pages of the web
# app (scripts/seo): practice area x state landing pages, attorney
# profiles, sitemap.xml and robots.txt. Built from the API's public
# directory and published next to the web app (same bucket, own
# prefixes). Rebuilt every day so new attorneys appear.
#
# Owner 2026-10-16: the company site (repository LawBidSite: /about, the
# legal pages, pricing, FAQ...) is built here too and published with
# these pages (scripts/seo/merge-site.mjs); the app owns the root. A site
# change shows up with the next daily run, or run this workflow by hand.
#
# Runs only when the repository variable WEB_DEPLOY_ENABLED is 'true'.
# Secrets/variables: see web-deploy.yml (WEB_BUCKET, WEB_DISTRIBUTION_ID,
# AWS_DEPLOY_ROLE_PROD, AWS_REGION) plus
#   WEB_SITE_URL       https://<web host>
#   WEB_SEO_API_URL    https://api.<domain>/api/v1
# Repository variable ANDROID_APP_SHA256: SHA-256 of the app-signing
# certificate (Play Console → App integrity), comma-separated if several.
#
# S20-2 (2026-10-25), hidden-cost switches (repository variables):
#   SEO_REBUILD_MODE     off | on | auto (default auto).
#                        auto = build every night, upload ONLY files whose
#                        content hash changed and invalidate ONLY those
#                        addresses (never "/*"); nothing changed = nothing
#                        uploaded, nothing invalidated.
#                        on   = same, but upload every file and invalidate
#                        the first-level folders again (after a template change).
#                        off  = the nightly schedule does nothing (a push to
#                        scripts/seo or a manual run still publishes).
#   SEO_MAX_PAGES        directory pages of 100 attorneys the build may read
#                        (default 2000 = 200 000 attorneys); more data than
#                        that FAILS the build instead of truncating.
#   SEO_INVALIDATE_MAX   most single page addresses invalidated per run
#                        (default 50); above it, one wildcard per folder.
name: SEO pages

on:
  schedule:
    - cron: "17 4 * * *"
  push:
    branches: [main]
    paths:
      - "scripts/seo/**"
      - ".github/workflows/seo-deploy.yml"
  workflow_dispatch:
    inputs:
      index_empty:
        description: "Index state x practice pages that have no attorneys yet"
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

concurrency:
  group: seo-deploy
  cancel-in-progress: false

jobs:
  test:
    name: Generator tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.23.4"
      - run: node --test scripts/seo/test/*.test.mjs

  deploy:
    name: Build and publish the pages
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: ${{ vars.WEB_DEPLOY_ENABLED == 'true' && !(github.event_name == 'schedule' && vars.SEO_REBUILD_MODE == 'off') }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.23.4"

      - name: Build the pages from the public directory
        run: >-
          node scripts/seo/build.mjs
          --api "${{ secrets.WEB_SEO_API_URL }}"
          --site "${{ secrets.WEB_SITE_URL }}"
          --out dist-seo
          --max-pages "${{ vars.SEO_MAX_PAGES || '2000' }}"
          ${{ inputs.index_empty && '--index-empty' || '' }}

      - name: Check out the company site
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: syimykkalykov1999/LawBidSite
          path: site

      - name: Build the company site (static, one folder per page)
        working-directory: site
        env:
          TRAILING_SLASH: "1"
          NEXT_PUBLIC_SITE_URL: ${{ secrets.WEB_SITE_URL }}
          NEXT_PUBLIC_APP_STORE_URL: ${{ vars.NEXT_PUBLIC_APP_STORE_URL }}
          NEXT_PUBLIC_PLAY_STORE_URL: ${{ vars.NEXT_PUBLIC_PLAY_STORE_URL }}
          NEXT_PUBLIC_SUPPORT_EMAIL: ${{ vars.NEXT_PUBLIC_SUPPORT_EMAIL }}
          PRICING_API_URL: ${{ secrets.WEB_SEO_API_URL }}
        run: |
          npm ci
          npm run build:static
          test -s out/about/index.html

      # App links (iOS + Android): written before the merge so that
      # public-paths.txt lists .well-known and web-deploy.yml never deletes it.
      # assetlinks.json needs the Play app-signing SHA-256 (repository
      # variable ANDROID_APP_SHA256); without it only the iOS file is published.
      - name: App links (/.well-known)
        env:
          ANDROID_APP_SHA256: ${{ vars.ANDROID_APP_SHA256 }}
        run: node scripts/seo/well-known.mjs --out dist-seo

      - name: Merge the site into the pages (one sitemap)
        run: >-
          node scripts/seo/merge-site.mjs
          --seo dist-seo --site site/out
          --site-url "${{ secrets.WEB_SITE_URL }}"

      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_PROD }}
          aws-region: ${{ secrets.AWS_REGION }}

      # S20-2: only files whose content hash changed are uploaded. The
      # previous run's manifest lives in the bucket (seo-manifest.json, named
      # in public-paths.txt so web-deploy.yml keeps it); a missing manifest
      # (first run) means everything is new.
      - name: Work out what changed
        env:
          BUCKET: ${{ secrets.WEB_BUCKET }}
          MODE: ${{ vars.SEO_REBUILD_MODE || 'auto' }}
          INVALIDATE_MAX: ${{ vars.SEO_INVALIDATE_MAX || '50' }}
        run: |
          aws s3 cp "s3://$BUCKET/seo-manifest.json" prev-manifest.json 2>/dev/null || echo '{}' > prev-manifest.json
          FORCE=""
          [ "$MODE" = "on" ] && FORCE="--force"
          node scripts/seo/publish-diff.mjs --dir dist-seo --prev prev-manifest.json \
            --max-paths "$INVALIDATE_MAX" $FORCE
          mkdir -p changed-out
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            mkdir -p "changed-out/$(dirname "$f")"
            cp "dist-seo/$f" "changed-out/$f"
          done < changed.txt

      # Each first-level folder is synced from the changed files only (no
      # --delete: removed files are listed in deleted.txt); the app's own
      # files (index.html, main.dart.*, canvaskit, assets...) are never touched.
      - name: Publish the changed files
        working-directory: changed-out
        env:
          BUCKET: ${{ secrets.WEB_BUCKET }}
        run: |
          B="s3://$BUCKET"
          for d in */ .well-known/; do
            [ -d "$d" ] || continue
            d="${d%/}"
            if [ "$d" = "_next" ]; then
              aws s3 sync "_next" "$B/_next" \
                --cache-control "public,max-age=31536000,immutable"
            else
              aws s3 sync "$d" "$B/$d" --cache-control "public,max-age=3600"
            fi
          done
          # App links for the phone apps (iOS needs it served as JSON).
          # Both must be application/json and served without a redirect.
          for f in apple-app-site-association assetlinks.json; do
            if [ -f ".well-known/$f" ]; then
              aws s3 cp ".well-known/$f" "$B/.well-known/$f" \
                --content-type application/json --cache-control "public,max-age=3600"
            fi
          done
          for f in *; do
            [ -f "$f" ] || continue
            case "$f" in
              sitemap.xml) t=application/xml ;;
              robots.txt|public-paths.txt) t=text/plain ;;
              *) t="" ;;
            esac
            aws s3 cp "$f" "$B/$f" --cache-control "public,max-age=3600" ${t:+--content-type "$t"}
          done

      - name: Remove pages that no longer exist, record the manifest
        env:
          BUCKET: ${{ secrets.WEB_BUCKET }}
        run: |
          B="s3://$BUCKET"
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            aws s3 rm "$B/$f"
          done < deleted.txt
          # Written last: a failed run is not recorded, the next run retries.
          aws s3 cp dist-seo/seo-manifest.json "$B/seo-manifest.json" \
            --content-type application/json --cache-control "no-cache"

      # Only the changed addresses (publish-diff.mjs), never "/*": a wildcard
      # over the whole distribution also evicted the Flutter app files.
      - name: Reset the CDN cache for the changed pages only
        env:
          DISTRIBUTION: ${{ secrets.WEB_DISTRIBUTION_ID }}
        run: |
          if [ ! -s invalidate.txt ]; then
            echo "nothing changed: no invalidation"
            exit 0
          fi
          mapfile -t PATHS < invalidate.txt
          aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION" --paths "${PATHS[@]}"
