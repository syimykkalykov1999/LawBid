# docs/06 §7.3 — main → images → staging → smoke → manual approval →
# migrations (one-off ECS task, lawbid_migrator) → prod rolling deploy →
# smoke. Rollback of a bad rollout is automatic: the ECS deployment circuit
# breaker AND the CloudWatch alarms (ALB 5xx / p95 / unhealthy hosts) that ECS
# watches during the rollout (infra/modules/ecs, docs/runbooks/DEPLOY_SAFETY.md).
# scripts/deploy/roll-services.sh fails this job when ECS rolled the release
# back (rolloutState FAILED) or when it did not finish in ROLL_TIMEOUT_SECONDS.
# P1 supply chain: images are signed with cosign (keyless, GitHub OIDC) and get
# an SPDX SBOM attestation; the prod job verifies the signature before it
# touches anything. Repository variable SIGN_REQUIRED=true makes signing and
# verification hard failures (default: warning only until proven on ECR).
#
# Required repository/environment secrets (never in the repo):
#   AWS_DEPLOY_ROLE_STAGING / AWS_DEPLOY_ROLE_PROD  — OIDC role ARNs
#   AWS_REGION, ECR_REGISTRY (123456789012.dkr.ecr.<region>.amazonaws.com)
#   STAGING_API_URL / PROD_API_URL, STAGING_ADMIN_URL / PROD_ADMIN_URL
# The `production` environment must require reviewers (the manual gate).
# Deploys run only when the repository variable DEPLOY_ENABLED is 'true',
# so a repo without the AWS secrets stays green. Staging runs only when
# the variable STAGING_ENABLED is 'true' (owner 2026-10: no staging, the
# images are pushed with the prod role and go straight to the prod gate).
name: Deploy

on:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - "apps/admin/**"
      - "packages/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Existing image tag to (re)deploy (default: this commit)"
        required: false

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
  IMAGE_TAG: ${{ inputs.image_tag || github.sha }}

jobs:
  build:
    name: Build & push images
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: ${{ vars.DEPLOY_ENABLED == 'true' && !inputs.image_tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: OIDC diagnostics (prints the token's sub, never the token)
        continue-on-error: true
        run: scripts/deploy/oidc-sub.sh
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ vars.STAGING_ENABLED == 'true' && secrets.AWS_DEPLOY_ROLE_STAGING || secrets.AWS_DEPLOY_ROLE_PROD }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7
      # ECR tags are IMMUTABLE (infra/bootstrap): re-running Deploy on a
      # commit whose images are already pushed would fail on the push.
      - name: Images already in ECR?
        id: have
        run: |
          if aws ecr describe-images --repository-name lawbid-api --image-ids imageTag="$IMAGE_TAG" >/dev/null 2>&1 \
            && aws ecr describe-images --repository-name lawbid-admin --image-ids imageTag="$IMAGE_TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::images for $IMAGE_TAG already in ECR, build skipped"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      # Owner 2026-10-22 (cost): the images are multi-arch (amd64 + arm64) so
      # the ECS tasks can run on Graviton (cpu_architecture = "ARM64", about
      # 20 % cheaper) without another build. arm64 is built under QEMU.
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
        if: steps.have.outputs.exists != 'true'
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
        if: steps.have.outputs.exists != 'true'
      - name: Build & push api
        id: build_api
        if: steps.have.outputs.exists != 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/lawbid-api:${{ env.IMAGE_TAG }}
          build-args: APP_VERSION=${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build & push admin
        id: build_admin
        if: steps.have.outputs.exists != 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: apps/admin/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/lawbid-admin:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --- P1 supply chain (2026-10-24): sign + SBOM, by digest ----------------
      # Keyless: the signature is bound to this workflow's GitHub OIDC identity
      # (Sigstore Fulcio certificate + Rekor log), no key to store or rotate.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: steps.have.outputs.exists != 'true'
      - name: Sign images (cosign keyless)
        if: steps.have.outputs.exists != 'true'
        continue-on-error: ${{ vars.SIGN_REQUIRED != 'true' }}
        env:
          API_DIGEST: ${{ steps.build_api.outputs.digest }}
          ADMIN_DIGEST: ${{ steps.build_admin.outputs.digest }}
        run: |
          set -eu
          cosign sign --yes "$ECR_REGISTRY/lawbid-api@$API_DIGEST"
          cosign sign --yes "$ECR_REGISTRY/lawbid-admin@$ADMIN_DIGEST"
      - name: SBOM api (syft, SPDX)
        if: steps.have.outputs.exists != 'true'
        continue-on-error: ${{ vars.SIGN_REQUIRED != 'true' }}
        uses: anchore/sbom-action@fffec3d851af758d56fee099cf3fbf8aa8779843 # v0.24.3
        with:
          image: ${{ env.ECR_REGISTRY }}/lawbid-api@${{ steps.build_api.outputs.digest }}
          format: spdx-json
          output-file: sbom-api.spdx.json
          artifact-name: sbom-api.spdx.json
          upload-release-assets: false
      - name: SBOM admin (syft, SPDX)
        if: steps.have.outputs.exists != 'true'
        continue-on-error: ${{ vars.SIGN_REQUIRED != 'true' }}
        uses: anchore/sbom-action@fffec3d851af758d56fee099cf3fbf8aa8779843 # v0.24.3
        with:
          image: ${{ env.ECR_REGISTRY }}/lawbid-admin@${{ steps.build_admin.outputs.digest }}
          format: spdx-json
          output-file: sbom-admin.spdx.json
          artifact-name: sbom-admin.spdx.json
          upload-release-assets: false
      - name: Attach the SBOMs to the images (cosign attest)
        if: steps.have.outputs.exists != 'true'
        continue-on-error: ${{ vars.SIGN_REQUIRED != 'true' }}
        env:
          API_DIGEST: ${{ steps.build_api.outputs.digest }}
          ADMIN_DIGEST: ${{ steps.build_admin.outputs.digest }}
        run: |
          set -eu
          cosign attest --yes --type spdxjson --predicate sbom-api.spdx.json "$ECR_REGISTRY/lawbid-api@$API_DIGEST"
          cosign attest --yes --type spdxjson --predicate sbom-admin.spdx.json "$ECR_REGISTRY/lawbid-admin@$ADMIN_DIGEST"

  deploy-staging:
    name: Deploy staging
    needs: [build]
    if: ${{ vars.DEPLOY_ENABLED == 'true' && vars.STAGING_ENABLED == 'true' && always() && (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: staging
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_STAGING }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Migrations (one-off task, waits for exit 0)
        run: scripts/deploy/run-migrations.sh lawbid-staging "$IMAGE_TAG"
      # Owner 2026-10-18: the translations table goes up with every release
      # (before, only by hand — the live site missed new texts). Dry run
      # first inside the task; only missing texts are added (admin uploads stay).
      - name: Translations (all 85 languages from translations_seed.xlsx)
        env:
          CLUSTER: lawbid-staging
          SECRET_PREFIX: lawbid-staging
        run: scripts/deploy/prod-admin-ecs.sh "$IMAGE_TAG" i18n
      - name: Roll api / worker / admin (fails if ECS rolled the release back)
        env:
          ROLL_TIMEOUT_SECONDS: "1800"
        run: scripts/deploy/roll-services.sh lawbid-staging "$IMAGE_TAG"
      - name: Smoke
        run: scripts/deploy/smoke.sh "${{ secrets.STAGING_API_URL }}" "${{ secrets.STAGING_ADMIN_URL }}"

  deploy-prod:
    name: Deploy production (manual approval)
    needs: [build, deploy-staging]
    if: ${{ vars.DEPLOY_ENABLED == 'true' && always() && (needs.build.result == 'success' || needs.build.result == 'skipped') && (needs.deploy-staging.result == 'success' || needs.deploy-staging.result == 'skipped') }}
    runs-on: ubuntu-latest
    # The GitHub environment `production` carries the required reviewers:
    # docs/06 §7.3 "ручное подтверждение".
    # Rollout + alarm bake time (ROLL_TIMEOUT_SECONDS) + migrations + smoke.
    timeout-minutes: 90
    environment:
      name: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: OIDC diagnostics (prints the token's sub, never the token)
        continue-on-error: true
        run: scripts/deploy/oidc-sub.sh
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_PROD }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Verify the image signatures (cosign, identity = this workflow on main)
        continue-on-error: ${{ vars.SIGN_REQUIRED != 'true' }}
        run: |
          set -eu
          for repo in lawbid-api lawbid-admin; do
            DIGEST=$(aws ecr describe-images --repository-name "$repo" --image-ids imageTag="$IMAGE_TAG" --query 'imageDetails[0].imageDigest' --output text)
            cosign verify "$ECR_REGISTRY/$repo@$DIGEST" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              --certificate-identity-regexp "(?i)^https://github\.com/${{ github.repository }}/\.github/workflows/deploy\.yml@refs/heads/main$" >/dev/null
            echo "signature OK: $repo@$DIGEST"
          done
      - name: Fresh backup exists (docs/06 §6.4 "перед каждой продовой миграцией")
        run: scripts/deploy/check-backup.sh
      - name: Migrations (expand/contract only, docs/02 §7.1)
        run: scripts/deploy/run-migrations.sh lawbid-prod "$IMAGE_TAG"
      - name: Translations (all 85 languages from translations_seed.xlsx)
        env:
          CLUSTER: lawbid-prod
          SECRET_PREFIX: lawbid-prod
        run: scripts/deploy/prod-admin-ecs.sh "$IMAGE_TAG" i18n
      # ECS rolls back on the circuit breaker or on the 5xx / p95 / unhealthy
      # alarms. The script waits for rolloutState COMPLETED of OUR revision
      # (not just "stable") and goes red on FAILED.
      - name: Rolling deploy api / worker / admin
        env:
          ROLL_TIMEOUT_SECONDS: "2400"
        run: scripts/deploy/roll-services.sh lawbid-prod "$IMAGE_TAG"
      - name: Smoke
        run: scripts/deploy/smoke.sh "${{ secrets.PROD_API_URL }}" "${{ secrets.PROD_ADMIN_URL }}"
