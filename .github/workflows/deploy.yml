# docs/06 §7.3 — main → images → staging → smoke → manual approval →
# migrations (one-off ECS task under MIGRATOR_DATABASE_URL = lawbid_admin;
# lawbid_migrator is planned, not in use — infra/postgres/migration-role.txt) → prod rolling deploy →
# smoke. Rollback of a bad rollout is automatic: the ECS deployment circuit
# breaker AND the CloudWatch alarms (ALB 5xx / p95 / unhealthy hosts) that ECS
# watches during the rollout (infra/modules/ecs, docs/runbooks/DEPLOY_SAFETY.md).
# scripts/deploy/roll-services.sh fails this job when ECS rolled the release
# back (rolloutState FAILED) or when it did not finish in ROLL_TIMEOUT_SECONDS.
# X1 (25.11): when Terraform switched the api to the ECS built-in canary / linear
# deployment (var.api_native_deploy), our canary step is skipped and the same
# script waits for ECS's service deployment (SUCCESSFUL or rolled back) instead.
# P1 supply chain: images are signed with cosign (keyless, GitHub OIDC) and get
# an SPDX SBOM attestation; the prod job verifies the signature before it
# touches anything. Repository variable SIGN_REQUIRED=true makes signing and
# verification hard failures (default: warning only until proven on ECR).
# OWNER STEP: after the first Deploy run that shows "signature OK" in the log,
# set SIGN_REQUIRED=true (Settings -> Secrets and variables -> Actions ->
# Variables) and signing_guard_enabled=true in Terraform.
#
# S11 hardening (2026-10-25):
#  * `gate` first: the build starts only after every CI check of the commit
#    finished green (scripts/ci/require-green.sh); a red or untested main never
#    reaches the approval prompt. A manual run with `image_tag` (an image that is
#    already built) skips the gate on purpose: it is how a known-good tag is redeployed.
#  * Trivy blocks CRITICAL on the pushed digest (both architectures) before signing.
#  * 2026-10-28: amd64 and arm64 are built natively in parallel (`build-arch`,
#    no QEMU) and joined into one manifest list by `build` (same tag/digest use).
#  * prod: real backup age (RDS LatestRestorableTime), a named snapshot before a
#    contract migration, then roll api -> smoke (asserts the answering tasks run
#    THIS tag) -> worker -> admin -> synthetic user flow; only then the tag is
#    written to SSM as last_good_tag (Rollback's default target).
#    (25.11: worker + admin roll while ECS still bakes the api, see below.)
#  * any failure -> notify-failure.yml (issue + SNS alerts topic + chat webhook).
#
# Required repository/environment secrets (never in the repo):
#   AWS_DEPLOY_ROLE_STAGING / AWS_DEPLOY_ROLE_PROD  — OIDC role ARNs
#   AWS_REGION, ECR_REGISTRY (123456789012.dkr.ecr.<region>.amazonaws.com)
#   STAGING_API_URL / PROD_API_URL, STAGING_ADMIN_URL / PROD_ADMIN_URL
# The `production` environment must require reviewers (the manual gate).
# Deploys run only when the repository variable DEPLOY_ENABLED is 'true',
# so a repo without the AWS secrets stays green. Staging runs only when
# the variable STAGING_ENABLED is 'true' (owner 2026-10: no staging, the
# images are pushed with the prod role and go straight to the prod gate).
name: Deploy

on:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - "apps/admin/**"
      - "packages/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Existing image tag to (re)deploy (default: this commit)"
        required: false

permissions:
  id-token: write
  contents: read

# Deploy speed (25.11, owner: «2,5 ч от слияния до прода»): one release at a
# time is enforced on the PROD JOB (job-level `concurrency: deploy` below), not
# on the whole run. The CI gate, the images, Trivy, signing and SBOM of a newer
# commit now run WHILE an older release still rolls (before, the whole run
# waited up to ~40 min in the queue and only then began its ~20 min of gate +
# build). GitHub keeps one pending job per group and cancels the older pending
# one (the same batching as before); the «Deploy order» job makes the prod jobs
# join that queue in run order, so an older commit never replaces a newer one.

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
  IMAGE_TAG: ${{ inputs.image_tag || github.sha }}

jobs:
  # CI audit 2026-11-01: the API/admin release does not wait for the MOBILE checks
  # (macOS, 40+ min): excluded below, so this job holds its runner for the API CI
  # time (~17 min) instead of the mobile one.
  gate:
    name: Wait for green CI
    runs-on: ubuntu-latest
    # 17.11 (KNOWN_ERRORS 195): with the Actions queue at 60-100 runs, main's
    # own CI took longer than 45 min, every gate timed out and prod stayed on
    # 16.11's build. Wait up to 3 h; the green rule itself is unchanged.
    timeout-minutes: 190
    if: ${{ vars.DEPLOY_ENABLED == 'true' && !inputs.image_tag }}
    permissions:
      contents: read
      checks: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Every CI check of this commit is green
        env:
          GH_TOKEN: ${{ github.token }}
          REQUIRE_GREEN_TIMEOUT: "10800"
          # Deploy speed 25.11: 30 s (was 60 s, ~15 s less lost per release on
          # average). Not lower: two gates may now run at once and GITHUB_TOKEN
          # has 1,000 API requests per hour per repository (2 pages per poll).
          REQUIRE_GREEN_POLL: "30"
        run: |
          scripts/ci/require-green.sh "$GITHUB_SHA" \
            '^(API |Admin CI|Build image \+ Trivy|gitleaks|CodeQL)' \
            '^(Wait for green CI|Build & push|Deploy|Web deploy|Which run deploys|Build and publish|Notify|Mobile release|Analyze, lint|Golden tests|Build check|Does the app|Dependency audit \(OSV)'

  # 2026-10-28: run 40632613817 hit the 60-min limit building admin's arm64
  # half under QEMU. Each architecture is now built NATIVELY in its own job
  # (amd64 on ubuntu-latest, arm64 on GitHub's free arm64 runner for public
  # repos, `ubuntu-24.04-arm`, GA 2025-08-07), pushed by digest only (no tag,
  # so the immutable ECR tags are untouched), and the `build` job below joins
  # the two digests into one multi-arch manifest list under the same tag.
  # Deploy speed 25.11: one job per image AND architecture (api and admin used
  # to build one after the other in the same job: 4m12 + 2m34 on amd64). Same
  # Dockerfiles, build args, cache scopes and by-digest pushes as before.
  build-arch:
    name: Build & push ${{ matrix.app }} ${{ matrix.arch }}
    needs: [gate]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    if: ${{ always() && vars.DEPLOY_ENABLED == 'true' && !inputs.image_tag && needs.gate.result == 'success' }}
    strategy:
      fail-fast: true
      matrix:
        app: [api, admin]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.STAGING_ENABLED == 'true' && secrets.AWS_DEPLOY_ROLE_STAGING || secrets.AWS_DEPLOY_ROLE_PROD }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@7290e214a610b32bc0eef81748948b6d466a8783 # v2.2.0
      # ECR tags are IMMUTABLE (infra/bootstrap): a re-run on a commit whose
      # images are already tagged builds nothing (same check as in `build`).
      - name: Images already in ECR?
        id: have
        run: |
          if aws ecr describe-images --repository-name lawbid-api --image-ids imageTag="$IMAGE_TAG" >/dev/null 2>&1 \
            && aws ecr describe-images --repository-name lawbid-admin --image-ids imageTag="$IMAGE_TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::images for $IMAGE_TAG already in ECR, build skipped"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: steps.have.outputs.exists != 'true'
        with:
          # Deploy speed 25.11: the post step removed the builder for 38-54 s on a
          # runner that is thrown away anyway.
          cleanup: false
      # cache-to ignore-error: builds of two commits may now overlap (job-level
      # deploy queue); a cache export that loses the race must not fail the build.
      - name: Build & push api (linux/${{ matrix.arch }}, by digest)
        id: build_api
        if: steps.have.outputs.exists != 'true' && matrix.app == 'api'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: linux/${{ matrix.arch }}
          build-args: |
            APP_VERSION=${{ env.IMAGE_TAG }}
            WITH_FFMPEG=${{ vars.WITH_FFMPEG == '1' && '1' || '0' }}
          outputs: type=image,name=${{ env.ECR_REGISTRY }}/lawbid-api,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=api-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=api-${{ matrix.arch }},ignore-error=true
      - name: Build & push admin (linux/${{ matrix.arch }}, by digest)
        id: build_admin
        if: steps.have.outputs.exists != 'true' && matrix.app == 'admin'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/admin/Dockerfile
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ env.ECR_REGISTRY }}/lawbid-admin,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=admin-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=admin-${{ matrix.arch }},ignore-error=true
      - name: Save the digest
        if: steps.have.outputs.exists != 'true'
        env:
          DIGEST: ${{ matrix.app == 'api' && steps.build_api.outputs.digest || steps.build_admin.outputs.digest }}
        run: |
          set -eu
          [ -n "$DIGEST" ] || { echo "::error::no digest from the ${{ matrix.app }} build"; exit 1; }
          mkdir -p "$RUNNER_TEMP/digests"
          printf '%s\n' "$DIGEST" > "$RUNNER_TEMP/digests/${{ matrix.app }}-${{ matrix.arch }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.have.outputs.exists != 'true'
        with:
          name: digests-${{ matrix.app }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  build:
    name: Build & push images
    needs: [gate, build-arch]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # always(): runs even when build-arch failed, so the guard step below turns
    # that into a FAILED `build` (a skipped `build` would let deploy-* go on).
    if: ${{ always() && vars.DEPLOY_ENABLED == 'true' && !inputs.image_tag && needs.gate.result == 'success' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: OIDC diagnostics (prints the token's sub, never the token)
        continue-on-error: true
        run: scripts/deploy/oidc-sub.sh
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.STAGING_ENABLED == 'true' && secrets.AWS_DEPLOY_ROLE_STAGING || secrets.AWS_DEPLOY_ROLE_PROD }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@7290e214a610b32bc0eef81748948b6d466a8783 # v2.2.0
      # ECR tags are IMMUTABLE (infra/bootstrap): re-running Deploy on a
      # commit whose images are already pushed would fail on the push.
      - name: Images already in ECR?
        id: have
        run: |
          if aws ecr describe-images --repository-name lawbid-api --image-ids imageTag="$IMAGE_TAG" >/dev/null 2>&1 \
            && aws ecr describe-images --repository-name lawbid-admin --image-ids imageTag="$IMAGE_TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::images for $IMAGE_TAG already in ECR, build skipped"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Both architectures built?
        if: steps.have.outputs.exists != 'true'
        env:
          ARCH_RESULT: ${{ needs.build-arch.result }}
        run: |
          if [ "$ARCH_RESULT" != "success" ]; then
            echo "::error::per-arch build result: $ARCH_RESULT"; exit 1
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.have.outputs.exists != 'true'
        with:
          pattern: digests-*
          merge-multiple: true
          path: ${{ runner.temp }}/digests
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: steps.have.outputs.exists != 'true'
        with:
          cleanup: false
      # Owner 2026-10-22 (cost): the images are multi-arch (amd64 + arm64) so
      # the ECS tasks can run on Graviton (cpu_architecture = "ARM64", about
      # 20 % cheaper) without another build (docs/runbooks/ARM64_SPOT.md).
      # The manifest list gets the same tag as before; its digest is what is
      # scanned, signed and attested below (same as the old single-job build).
      - name: Multi-arch manifest api
        id: build_api
        if: steps.have.outputs.exists != 'true'
        run: scripts/deploy/merge-arch-manifests.sh lawbid-api "$RUNNER_TEMP/digests"
      - name: Multi-arch manifest admin
        id: build_admin
        if: steps.have.outputs.exists != 'true'
        run: scripts/deploy/merge-arch-manifests.sh lawbid-admin "$RUNNER_TEMP/digests"

      # S11-10: scan the digest we really ship (both architectures) and stop on a
      # fixable CRITICAL before it is signed.
      - name: Trivy on the pushed digests (CRITICAL blocks)
        if: steps.have.outputs.exists != 'true'
        env:
          API_DIGEST: ${{ steps.build_api.outputs.digest }}
          ADMIN_DIGEST: ${{ steps.build_admin.outputs.digest }}
        run: |
          set -eu
          export TRIVY_USERNAME=AWS
          TRIVY_PASSWORD=$(aws ecr get-login-password --region "$AWS_REGION"); export TRIVY_PASSWORD
          # Deploy speed 25.11: the two images are scanned at the same time (2m14
          # one after the other); both must pass, each log is printed whole.
          scripts/ci/trivy-image.sh "$ECR_REGISTRY/lawbid-api@$API_DIGEST" CRITICAL > trivy-api.log 2>&1 & P1=$!
          RUNNER_TEMP="$RUNNER_TEMP/admin" scripts/ci/trivy-image.sh "$ECR_REGISTRY/lawbid-admin@$ADMIN_DIGEST" CRITICAL > trivy-admin.log 2>&1 & P2=$!
          rc=0
          wait "$P1" || rc=1
          wait "$P2" || rc=1
          echo "::group::Trivy api"; cat trivy-api.log; echo "::endgroup::"
          echo "::group::Trivy admin"; cat trivy-admin.log; echo "::endgroup::"
          exit $rc

      # --- P1 supply chain (2026-10-24): sign + SBOM, by digest ----------------
      # Keyless: the signature is bound to this workflow's GitHub OIDC identity
      # (Sigstore Fulcio certificate + Rekor log), no key to store or rotate.
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        if: steps.have.outputs.exists != 'true'
      - name: Sign images (cosign keyless)
        if: steps.have.outputs.exists != 'true'
        continue-on-error: ${{ vars.SIGN_REQUIRED != 'true' }}
        env:
          API_DIGEST: ${{ steps.build_api.outputs.digest }}
          ADMIN_DIGEST: ${{ steps.build_admin.outputs.digest }}
        run: |
          set -eu
          cosign sign --yes "$ECR_REGISTRY/lawbid-api@$API_DIGEST"
          cosign sign --yes "$ECR_REGISTRY/lawbid-admin@$ADMIN_DIGEST"
      - name: SBOM api (syft, SPDX)
        if: steps.have.outputs.exists != 'true'
        continue-on-error: ${{ vars.SIGN_REQUIRED != 'true' }}
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.ECR_REGISTRY }}/lawbid-api@${{ steps.build_api.outputs.digest }}
          format: spdx-json
          output-file: sbom-api.spdx.json
          artifact-name: sbom-api.spdx.json
          upload-release-assets: false
      - name: SBOM admin (syft, SPDX)
        if: steps.have.outputs.exists != 'true'
        continue-on-error: ${{ vars.SIGN_REQUIRED != 'true' }}
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.ECR_REGISTRY }}/lawbid-admin@${{ steps.build_admin.outputs.digest }}
          format: spdx-json
          output-file: sbom-admin.spdx.json
          artifact-name: sbom-admin.spdx.json
          upload-release-assets: false
      - name: Attach the SBOMs to the images (cosign attest)
        if: steps.have.outputs.exists != 'true'
        continue-on-error: ${{ vars.SIGN_REQUIRED != 'true' }}
        env:
          API_DIGEST: ${{ steps.build_api.outputs.digest }}
          ADMIN_DIGEST: ${{ steps.build_admin.outputs.digest }}
        run: |
          set -eu
          cosign attest --yes --type spdxjson --predicate sbom-api.spdx.json "$ECR_REGISTRY/lawbid-api@$API_DIGEST"
          cosign attest --yes --type spdxjson --predicate sbom-admin.spdx.json "$ECR_REGISTRY/lawbid-admin@$ADMIN_DIGEST"

  deploy-staging:
    name: Deploy staging
    needs: [gate, build]
    if: ${{ vars.DEPLOY_ENABLED == 'true' && vars.STAGING_ENABLED == 'true' && always() && (needs.gate.result == 'success' || needs.gate.result == 'skipped') && (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Deploy speed 25.11: one staging release at a time (was the run-level group).
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    environment:
      name: staging
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_STAGING }}
          aws-region: ${{ env.AWS_REGION }}
      # Deploy safety audit 2026-10-27: the NEW image's env rules against the
      # REAL task env + secrets (+ KMS, Postgres, Redis) BEFORE migrations,
      # so a missing/weak value stops here instead of crash-looping new tasks.
      - name: Config preflight (new image vs real env, before migrations)
        env:
          CLUSTER: lawbid-staging
          SECRET_PREFIX: lawbid-staging
        run: scripts/deploy/prod-admin-ecs.sh "$IMAGE_TAG" config
      - name: Migrations (one-off task, waits for exit 0)
        env:
          # fail (default) | warn | off — prisma/verify-schema.mjs
          SCHEMA_DRIFT_CHECK: ${{ vars.SCHEMA_DRIFT_CHECK }}
        run: scripts/deploy/run-migrations.sh lawbid-staging "$IMAGE_TAG"
      # Owner 2026-10-18: the translations table goes up with every release
      # (before, only by hand — the live site missed new texts). Dry run
      # first inside the task; only missing texts are added (admin uploads stay).
      - name: Translations (all 85 languages from prisma/seed/translations)
        env:
          CLUSTER: lawbid-staging
          SECRET_PREFIX: lawbid-staging
        run: scripts/deploy/prod-admin-ecs.sh "$IMAGE_TAG" i18n
      - name: Roll api / worker / admin (fails if ECS rolled the release back)
        env:
          ROLL_TIMEOUT_SECONDS: "1800"
        run: scripts/deploy/roll-services.sh lawbid-staging "$IMAGE_TAG"
      - name: Smoke
        run: scripts/deploy/smoke.sh "${{ secrets.STAGING_API_URL }}" "${{ secrets.STAGING_ADMIN_URL }}" "$IMAGE_TAG"

  # Deploy speed 25.11: the prod job below holds the `deploy` group; GitHub
  # cancels an older PENDING job when a newer one joins, so the prod jobs must
  # join in run order (else an older commit could replace a newer one and the
  # newer one would never deploy). This job waits while an OLDER deploy run has
  # not put its prod job into the queue yet (scripts/ci/wait-earlier-prod-change.sh
  # older-deploys-queued). It never waits for a newer run: no deadlock.
  deploy-order:
    name: Deploy order (older releases queue first)
    needs: [gate, build, deploy-staging]
    if: ${{ vars.DEPLOY_ENABLED == 'true' && always() && (needs.gate.result == 'success' || needs.gate.result == 'skipped') && (needs.build.result == 'success' || needs.build.result == 'skipped') && (needs.deploy-staging.result == 'success' || needs.deploy-staging.result == 'skipped') }}
    runs-on: ubuntu-latest
    # The older run may still wait for its CI (gate: up to 3 h).
    timeout-minutes: 200
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts/ci
      - name: Older deploy runs have queued their prod job
        env:
          GH_TOKEN: ${{ github.token }}
          WAIT_PROD_TIMEOUT: "11400"
          WAIT_PROD_POLL: "20"
        run: scripts/ci/wait-earlier-prod-change.sh older-deploys-queued

  deploy-prod:
    name: Deploy production (manual approval)
    # `gate` is skipped only for a manual redeploy of an existing image_tag; a
    # failed gate (red CI) is neither success nor skipped and stops everything.
    needs: [gate, build, deploy-staging, deploy-order]
    if: ${{ vars.DEPLOY_ENABLED == 'true' && always() && (needs.gate.result == 'success' || needs.gate.result == 'skipped') && (needs.build.result == 'success' || needs.build.result == 'skipped') && (needs.deploy-staging.result == 'success' || needs.deploy-staging.result == 'skipped') && needs.deploy-order.result == 'success' }}
    runs-on: ubuntu-latest
    # One release in prod at a time (was the whole run's group, see the top).
    concurrency:
      group: deploy
      cancel-in-progress: false
    # The GitHub environment `production` carries the required reviewers:
    # docs/06 §7.3 "ручное подтверждение".
    # Rollout + alarm bake time (ROLL_TIMEOUT_SECONDS) + migrations + smoke
    # (+ the automatic rollback, D1-36).
    timeout-minutes: 150
    environment:
      name: production
    permissions:
      id-token: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # snapshot-if-contract.sh and i18n-needed.sh diff the running release
          # against this one: the whole history of commits and trees is needed.
          fetch-depth: 0
          # Deploy speed 25.11: without file contents (blobs) of old commits
          # (checkout took 55 s; the history carries ~3 GB of old binary seeds).
          # Git fetches a blob on demand when a script reads one (`git show`).
          filter: blob:none
      # KNOWN_ERRORS 90: one change to prod at a time (an admin cloud change
      # that started earlier finishes first).
      - name: Wait for an earlier cloud change from the admin
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/ci/wait-earlier-prod-change.sh infra-active
      # D1-38: a rollback that is running finishes first (a rollback never
      # waits for a deploy that is still here, so the two cannot deadlock).
      - name: Wait for an earlier rollback
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/ci/wait-earlier-prod-change.sh rollback-active
      - name: OIDC diagnostics (prints the token's sub, never the token)
        continue-on-error: true
        run: scripts/deploy/oidc-sub.sh
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_PROD }}
          aws-region: ${{ env.AWS_REGION }}
          role-duration-seconds: ${{ vars.AWS_DEPLOY_SESSION_SECONDS || 3600 }}
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Verify the image signatures (cosign, identity = this workflow on main)
        continue-on-error: ${{ vars.SIGN_REQUIRED != 'true' }}
        run: |
          set -eu
          for repo in lawbid-api lawbid-admin; do
            DIGEST=$(aws ecr describe-images --repository-name "$repo" --image-ids imageTag="$IMAGE_TAG" --query 'imageDetails[0].imageDigest' --output text)
            cosign verify "$ECR_REGISTRY/$repo@$DIGEST" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              --certificate-identity-regexp "(?i)^https://github\.com/${{ github.repository }}/\.github/workflows/deploy\.yml@refs/heads/main$" >/dev/null
            echo "signature OK: $repo@$DIGEST"
          done
      - name: Release running now (SSM last_good_tag)
        run: |
          LAST=$(aws ssm get-parameter --name "/lawbid-prod/deploy/last_good_tag" --query Parameter.Value --output text 2>/dev/null || true)
          echo "LAST_GOOD_TAG=${LAST}" >> "$GITHUB_ENV"
          echo "running release: ${LAST:-unknown}"
      # S11-14: the real check: the database's newest restorable point (RDS
      # LatestRestorableTime) must be younger than 26 h. BACKUP_CHECK_STRICT=true
      # (repository variable) also fails when the role may not read it.
      - name: Fresh backup exists (docs/06 §6.4 "перед каждой продовой миграцией")
        env:
          BACKUP_CHECK_STRICT: ${{ vars.BACKUP_CHECK_STRICT }}
        run: scripts/deploy/check-backup.sh
      # Cost switch: repository variable PRE_MIGRATE_SNAPSHOT=false turns it off.
      # A snapshot is taken only for a `contract` migration (rare), costs about
      # $0.095 per GB-month while it exists: delete it after a week (RDS -> Snapshots).
      - name: Snapshot before contract migrations (only when this release has one)
        if: ${{ vars.PRE_MIGRATE_SNAPSHOT != 'false' }}
        run: scripts/deploy/snapshot-if-contract.sh "$LAST_GOOD_TAG" "$IMAGE_TAG"
      - name: Config preflight (new image vs real env, before migrations)
        env:
          CLUSTER: lawbid-prod
          SECRET_PREFIX: lawbid-prod
        run: scripts/deploy/prod-admin-ecs.sh "$IMAGE_TAG" config
      # D1-40: never migrate or roll while the autoscaler resizes the
      # database or Redis (it waits, then fails clearly).
      - name: No database or Redis resize in progress
        env:
          DATA_STORES_WAIT_SECONDS: ${{ vars.DATA_STORES_WAIT_SECONDS || '1800' }}
          DATA_STORES_STRICT: ${{ vars.DATA_STORES_STRICT }}
        run: scripts/deploy/wait-data-stores-idle.sh lawbid-prod
      - name: Migrations (expand/contract only, docs/02 §7.1)
        env:
          # fail (default) | warn | off — prisma/verify-schema.mjs
          SCHEMA_DRIFT_CHECK: ${{ vars.SCHEMA_DRIFT_CHECK }}
        run: scripts/deploy/run-migrations.sh lawbid-prod "$IMAGE_TAG"
      # Deploy speed 25.11: the translations task (2m13) runs when anything it
      # reads differs from the running release (git object ids = content hash of
      # the seed, the importer, the schema, the migrations); byte-identical =
      # nothing new to add (it only adds missing texts). Repository variable
      # I18N_SEED_ALWAYS=true runs it every time as before.
      - name: Translations changed since the running release?
        id: i18n
        env:
          I18N_SEED_ALWAYS: ${{ vars.I18N_SEED_ALWAYS }}
        run: scripts/deploy/i18n-needed.sh "$LAST_GOOD_TAG" "$IMAGE_TAG" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Translations (all 85 languages from prisma/seed/translations)
        if: ${{ steps.i18n.outputs.needed != 'false' }}
        env:
          CLUSTER: lawbid-prod
          SECRET_PREFIX: lawbid-prod
        run: scripts/deploy/prod-admin-ecs.sh "$IMAGE_TAG" i18n
      # ECS rolls back on the circuit breaker or on the 5xx / p95 / unhealthy
      # alarms. The script waits for rolloutState COMPLETED of OUR revision
      # (not just "stable") and goes red on FAILED. S11-14: api first, smoked
      # against the tag, then worker and admin, so one bad shared change does not
      # hit all three services at once.
      # X1 (25.11): which canary runs. The ECS service itself says it: strategy
      # CANARY / LINEAR (Terraform var.api_native_deploy) = ECS's built-in
      # canary (green target group, api_canary_percent, bake, alarms + circuit
      # breaker, shift back by itself), and "Rolling deploy api" below waits for
      # that ECS deployment's result. Anything else (today, or the describe
      # failed) = our canary script exactly as before.
      - name: Api deployment strategy (ECS built-in canary or our canary script)
        id: strategy
        run: |
          S=$(aws ecs describe-services --cluster lawbid-prod --services api --query 'services[0].deploymentConfiguration.strategy' --output text 2>/dev/null || echo None)
          case "$S" in CANARY|LINEAR|BLUE_GREEN) N=true ;; *) N=false ;; esac
          echo "native=$N" >> "$GITHUB_OUTPUT"
          echo "api deployment strategy: ${S} (ECS built-in canary: ${N})" | tee -a "$GITHUB_STEP_SUMMARY"
      # Canary (D1-36: ON unless repository variable CANARY_ENABLED=false): one extra task
      # with the new image takes a little live traffic for CANARY_BAKE_MINUTES while
      # the api alarms are watched; a bad release stops here, before the real api.
      - name: Canary (1 task, watch alarms)
        if: ${{ steps.strategy.outputs.native != 'true' }}
        env:
          CANARY_ENABLED: ${{ vars.CANARY_ENABLED || 'true' }}
          CANARY_BAKE_MINUTES: ${{ vars.CANARY_BAKE_MINUTES || '5' }}
        run: scripts/deploy/canary.sh lawbid-prod "$IMAGE_TAG"
      # With the ECS built-in canary this step waits for ECS's own result
      # (SUCCESSFUL, or ROLLBACK_* = red); roll-services.sh reads the strategy.
      # Deploy speed 25.11 (run 45622584281: api 13m22, then worker + admin
      # 8m12 AFTER it). The order and every check stay: api first; worker and
      # admin are touched only after EVERY api task runs the new release and the
      # api smoke passed. What changed: ECS's alarm bake of the api (it watches
      # the 5xx / p95 / unhealthy alarms before it marks the rollout COMPLETED;
      # AWS: "the deployment might appear to take several minutes longer") now
      # runs while worker and admin roll, instead of before. An api alarm in its
      # bake still fails the job (and rolls all three back, see the end).
      - name: Rolling deploy api (until every api task runs this release)
        id: roll_api
        env:
          ROLL_TIMEOUT_SECONDS: "2400"
          ROLL_STATE: roll-state-api.env
        run: |
          ROLL_PHASE=start scripts/deploy/roll-services.sh lawbid-prod "$IMAGE_TAG" api
          ROLL_UNTIL=steady ROLL_PHASE="wait" scripts/deploy/roll-services.sh lawbid-prod "$IMAGE_TAG" api
      - name: Smoke api (the answering tasks run this tag)
        id: smoke_api
        run: scripts/deploy/smoke.sh "${{ secrets.PROD_API_URL }}" "${{ secrets.PROD_ADMIN_URL }}" "$IMAGE_TAG"
      # D1-37: the first session was taken before migrations, the canary and
      # up to 40 minutes of the api roll: a fresh one for the rest.
      - name: Fresh AWS session for the second roll
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_PROD }}
          aws-region: ${{ env.AWS_REGION }}
          role-duration-seconds: ${{ vars.AWS_DEPLOY_SESSION_SECONDS || 3600 }}
      - name: Start worker and admin (api bakes meanwhile)
        id: start_rest
        env:
          ROLL_STATE: roll-state-rest.env
          ROLL_PHASE: start
        run: scripts/deploy/roll-services.sh lawbid-prod "$IMAGE_TAG" "worker admin"
      - name: Api bake (ECS watches the alarms until COMPLETED)
        id: bake_api
        env:
          ROLL_TIMEOUT_SECONDS: "2400"
          ROLL_STATE: roll-state-api.env
          ROLL_PHASE: wait
        run: scripts/deploy/roll-services.sh lawbid-prod "$IMAGE_TAG" api
      - name: Rolling deploy worker and admin
        id: roll_rest
        env:
          ROLL_TIMEOUT_SECONDS: "2400"
          ROLL_STATE: roll-state-rest.env
          ROLL_PHASE: wait
        run: scripts/deploy/roll-services.sh lawbid-prod "$IMAGE_TAG" "worker admin"
      - name: Smoke (all services)
        id: smoke_all
        run: scripts/deploy/smoke.sh "${{ secrets.PROD_API_URL }}" "${{ secrets.PROD_ADMIN_URL }}" "$IMAGE_TAG"
      - name: Synthetic user flow (scripts/ops/synthetic-check.mjs)
        id: synthetic
        env:
          SYNTHETIC_IDENTIFIER: ${{ secrets.SYNTHETIC_IDENTIFIER }}
          SYNTHETIC_PASSWORD: ${{ secrets.SYNTHETIC_PASSWORD }}
        run: node scripts/ops/synthetic-check.mjs "${{ secrets.PROD_API_URL }}" --expect-version "$IMAGE_TAG"
      # Owner 15.11 («разреши "Авто" само применять обновления кода своих
      # функций без меня»): the autoscale Lambdas' source hash on main. The
      # API compares it with deploy/autoscale_code_applied (written by the
      # last Terraform apply) and «Авто» ships the code (aws.autoscale_code).
      # Same formula as infra/modules/stack; /deploy/* is the role's own path.
      - name: Remember the autoscale Lambda code on main
        continue-on-error: true
        run: |
          H=$(node scripts/deploy/autoscale-code-hash.mjs)
          aws ssm put-parameter --name "/lawbid-prod/deploy/autoscale_code_main" --type String --overwrite --value "$H" >/dev/null
          echo "autoscale_code_main = $H" >> "$GITHUB_STEP_SUMMARY"

      # S11-9: only a release that passed every check above becomes the
      # rollback default. Needs ssm:PutParameter on /lawbid-prod/deploy/* (infra/bootstrap);
      # until that is applied the deploy still succeeds (warning).
      - name: Remember this release as last_good_tag
        continue-on-error: true
        run: |
          if [ -n "${LAST_GOOD_TAG:-}" ] && [ "$LAST_GOOD_TAG" != "$IMAGE_TAG" ]; then
            aws ssm put-parameter --name "/lawbid-prod/deploy/previous_good_tag" --type String --overwrite --value "$LAST_GOOD_TAG" >/dev/null 2>&1 || true
          fi
          # Automation audit 2026-11-08: this failed silently from 28.10 on (the
          # role lacked ssm:PutParameter: infra/bootstrap not re-applied), so
          # Rollback's default target stayed two weeks old. Say it loudly.
          if ! aws ssm put-parameter --name "/lawbid-prod/deploy/last_good_tag" --type String --overwrite --value "$IMAGE_TAG" >/dev/null 2>ssm.err; then
            echo "::error::last_good_tag NOT written: $(head -c 300 ssm.err). Rollback would go to ${LAST_GOOD_TAG:-nothing}. Owner: terraform apply in infra/bootstrap (docs/dev/AUTOMATION_AUDIT_2026-11-08.md)."
            echo "❌ last_good_tag NOT written (rollback target stays ${LAST_GOOD_TAG:-none})" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "last_good_tag = $IMAGE_TAG (was ${LAST_GOOD_TAG:-none})" | tee -a "$GITHUB_STEP_SUMMARY"
      # D1-36 (13.11): ECS judged the api good, but a check after the roll
      # failed (api smoke, the worker / admin roll, the full smoke or the
      # synthetic user flow): put api, worker and admin (api-admin follows
      # api) back on the release that ran before, then smoke it.
      # Deploy speed 25.11: also when ECS rejected the api in its bake (it put
      # the api back itself, but worker / admin may already run the new release). Migrations
      # stay (expand/contract keeps the old code working). The job stays red
      # and the owner is told. Off with repository variable AUTO_ROLLBACK=false.
      - name: Fresh AWS session for the rollback
        if: ${{ failure() && vars.AUTO_ROLLBACK != 'false' && steps.roll_api.outcome == 'success' && env.LAST_GOOD_TAG != '' && env.LAST_GOOD_TAG != env.IMAGE_TAG && (steps.smoke_api.outcome == 'failure' || steps.start_rest.outcome == 'failure' || steps.bake_api.outcome == 'failure' || steps.roll_rest.outcome == 'failure' || steps.smoke_all.outcome == 'failure' || steps.synthetic.outcome == 'failure') }}
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_PROD }}
          aws-region: ${{ env.AWS_REGION }}
          role-duration-seconds: ${{ vars.AWS_DEPLOY_SESSION_SECONDS || 3600 }}
      - name: Automatic rollback to the release that ran before
        if: ${{ failure() && vars.AUTO_ROLLBACK != 'false' && steps.roll_api.outcome == 'success' && env.LAST_GOOD_TAG != '' && env.LAST_GOOD_TAG != env.IMAGE_TAG && (steps.smoke_api.outcome == 'failure' || steps.start_rest.outcome == 'failure' || steps.bake_api.outcome == 'failure' || steps.roll_rest.outcome == 'failure' || steps.smoke_all.outcome == 'failure' || steps.synthetic.outcome == 'failure') }}
        env:
          ROLL_TIMEOUT_SECONDS: "2400"
        run: |
          echo "::error::release $IMAGE_TAG failed a check after the roll; rolling back to $LAST_GOOD_TAG"
          echo "❌ $IMAGE_TAG failed after the roll; automatic rollback to **$LAST_GOOD_TAG**" >> "$GITHUB_STEP_SUMMARY"
          scripts/deploy/roll-services.sh lawbid-prod "$LAST_GOOD_TAG" "api worker admin"
          scripts/deploy/smoke.sh "${{ secrets.PROD_API_URL }}" "${{ secrets.PROD_ADMIN_URL }}" "$LAST_GOOD_TAG"
          echo "✅ production is back on $LAST_GOOD_TAG" >> "$GITHUB_STEP_SUMMARY"

  # Item 18 / M5 (25.11): the Bunny Stream encoding ladder lives in
  # scripts/deploy/bunny-stream-settings.json. Read-only check of the live library
  # (GET api.bunny.net/videolibrary/{id}); drift turns this job red and `notify`
  # tells the owner, the release itself is not held. Until the repository secrets
  # BUNNY_LIBRARY_ID / BUNNY_ACCOUNT_API_KEY exist it only writes a notice.
  # Fixing drift is the owner's explicit command (`... apply --yes`), never CI.
  bunny-settings:
    # «Deploy: …»: the CI gates of deploy.yml and web-deploy.yml skip «^Deploy»
    # checks, mobile-release.yml names it, so drift never closes a release gate.
    name: "Deploy: Bunny Stream settings match the code"
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.13.1"
      - name: Compare the live library with bunny-stream-settings.json (read-only)
        env:
          BUNNY_LIBRARY_ID: ${{ secrets.BUNNY_LIBRARY_ID }}
          BUNNY_ACCOUNT_API_KEY: ${{ secrets.BUNNY_ACCOUNT_API_KEY }}
        run: node scripts/deploy/bunny-stream-settings.mjs check --soft

  notify:
    name: Tell the owner
    needs: [gate, build-arch, build, deploy-staging, deploy-order, deploy-prod, bunny-settings]
    if: ${{ always() && contains(needs.*.result, 'failure') }}
    permissions:
      contents: read
      issues: write
      id-token: write
    uses: ./.github/workflows/notify-failure.yml
    with:
      title: "Production deploy failed (red CI gate, build, migration, roll or smoke) or Bunny Stream settings differ from the code"
      kind: deploy
    secrets: inherit
