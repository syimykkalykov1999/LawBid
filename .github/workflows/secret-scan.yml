# Secret scanning — docs/01_FOUNDATION_AUTH.md §16 DoD: "Ни один секрет не
# лежит в репозитории" (no secret ever committed). Deliberately NOT
# path-filtered to apps/api/** or apps/mobile/** like the other two
# workflows — a leaked secret can land anywhere in the repo (docs, infra/,
# root config), so this always runs on every PR and push to main/master.
#
# gitleaks-action's own default behavior is exactly what we want here: a
# full-history scan on push to a protected branch, and a diff-only scan of
# just the PR's changes on pull_request — so a real, already-merged secret
# from before this workflow existed doesn't retroactively fail every future
# PR, while any *new* secret in a PR's diff still blocks it.

name: Secret scan

on:
  merge_group:
    types: [checks_requested]
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

# S11-1: only a superseded PR run is cancelled; a push to main must always finish
# (its result is what the deploy gate reads) and a merge-queue run is never cancelled.
concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# gitleaks-action lists the PR's commits through the API.
permissions:
  contents: read
  pull-requests: read

jobs:
  gitleaks:
    name: gitleaks
    # gitleaks-action does not support the merge_group event; the PR run already scanned it.
    if: ${{ github.event_name != 'merge_group' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # S11-6: a failure on main / on a schedule reaches the owner (notify-failure.yml).
  notify:
    name: Notify the owner
    needs: [gitleaks]
    if: ${{ always() && contains(needs.*.result, 'failure') && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    permissions:
      contents: read
      issues: write
      id-token: write
    uses: ./.github/workflows/notify-failure.yml
    with:
      title: "Secret scan failed on main: a secret may be in the repository"
      kind: scan-secrets
      remind_after_minutes: 720
    secrets: inherit
