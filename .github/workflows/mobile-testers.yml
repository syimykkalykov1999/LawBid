# Owner 2026-10-31: no Mac. Every push to main that touches apps/mobile builds
# the prod app and ships it to the owner's phones as an ordinary update:
#   iOS     -> TestFlight (internal testers)
#   Android -> Google Play Internal testing (release status `completed`, so the
#              tester gets it as a normal Play update)
# Build number: NOT github.run_number (it is far below the versionCodes already
# on Play and would be rejected). The repo-wide automatic number is used on both
# platforms: minutes since 2026-01-01 UTC (android/app/build.gradle.kts
# autoBuildNumber, Runner build phase "Auto build number").
# iOS signing: Xcode cloud-managed signing through the App Store Connect API key
# (-allowProvisioningUpdates) - no .p12 and no profile, nothing is exported from
# a Mac. Store promotion (closed / production) stays in mobile-release.yml.
# CI audit 2026-11-01: OFF until the repository variable MOBILE_TESTERS_ENABLED is 'true'
# (set it once the secrets exist); without it the jobs are skipped instead of failing main
# on empty secrets and occupying macOS runners on every mobile merge.
# Setup: docs/runbooks/mobile-testers-ci.md. Secrets live in the `release` environment.
name: Mobile testers

on:
  push:
    branches: [main]
    paths: ["apps/mobile/**", ".github/workflows/mobile-testers.yml"]
  workflow_dispatch:
    inputs:
      platform:
        description: "What to ship"
        type: choice
        options: [both, android, ios]
        default: both

permissions:
  contents: read

# Builds queue one after another (an upload is never cancelled halfway).
concurrency:
  group: mobile-testers
  cancel-in-progress: false

jobs:
  android:
    name: Android -> Play Internal testing
    if: ${{ vars.MOBILE_TESTERS_ENABLED == 'true' && inputs.platform != 'ios' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with: { distribution: temurin, java-version: "17" }
      - name: Flutter version (apps/mobile/.fvmrc is the single pin)
        id: fv
        run: echo "v=$(jq -r .flutter apps/mobile/.fvmrc)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with: { flutter-version: "${{ steps.fv.outputs.v }}", channel: stable, cache: true }
      - uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1.336.0
        with: { ruby-version: "3.3", bundler-cache: true, working-directory: apps/mobile }
      - name: Dart defines + Firebase config + upload keystore
        working-directory: apps/mobile
        env:
          DART_DEFINES_JSON: ${{ secrets.MOBILE_DART_DEFINES_JSON }}
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          set -eu
          for v in DART_DEFINES_JSON GOOGLE_SERVICES_JSON_BASE64 ANDROID_KEYSTORE_BASE64 PLAY_SERVICE_ACCOUNT_JSON; do
            if [ -z "$(printenv "$v")" ]; then echo "::error::secret for $v is empty (docs/runbooks/mobile-testers-ci.md)"; exit 1; fi
          done
          printf '%s' "$DART_DEFINES_JSON" > config/prod.json
          mkdir -p android/app/src/prod
          echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > android/app/src/prod/google-services.json
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
          printf '%s' "$PLAY_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/play.json"
      - run: flutter pub get && dart run build_runner build --delete-conflicting-outputs
        working-directory: apps/mobile
      - name: fastlane build (signed AAB)
        working-directory: apps/mobile/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
        run: bundle exec fastlane android build flavor:prod
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-prod-aab
          path: apps/mobile/build/app/outputs/bundle/prodRelease/*.aab
          retention-days: 14
      - name: Upload to Play Internal testing
        working-directory: apps/mobile/android
        run: |
          bundle exec fastlane run upload_to_play_store \
            json_key:"$RUNNER_TEMP/play.json" package_name:com.lawbid.lawbid \
            track:internal release_status:completed \
            aab:"$GITHUB_WORKSPACE/apps/mobile/build/app/outputs/bundle/prodRelease/app-prod-release.aab" \
            skip_upload_metadata:true skip_upload_changelogs:true \
            skip_upload_images:true skip_upload_screenshots:true

  ios:
    name: iOS -> TestFlight
    if: ${{ vars.MOBILE_TESTERS_ENABLED == 'true' && inputs.platform != 'android' }}
    runs-on: macos-latest
    timeout-minutes: 90
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Flutter version (apps/mobile/.fvmrc is the single pin)
        id: fv
        run: echo "v=$(jq -r .flutter apps/mobile/.fvmrc)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with: { flutter-version: "${{ steps.fv.outputs.v }}", channel: stable, cache: true }
      - uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1.336.0
        with: { ruby-version: "3.3", bundler-cache: true, working-directory: apps/mobile }
      - name: Xcode with the current iOS SDK (fail now, not at the store upload)
        run: bash scripts/ci/select-xcode.sh
      - name: Dart defines + Firebase config + App Store Connect key
        working-directory: apps/mobile
        env:
          DART_DEFINES_JSON: ${{ secrets.MOBILE_DART_DEFINES_JSON }}
          GOOGLE_SERVICE_INFO_PLIST_BASE64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -eu
          for v in DART_DEFINES_JSON GOOGLE_SERVICE_INFO_PLIST_BASE64 ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_CONTENT APPLE_TEAM_ID; do
            if [ -z "$(printenv "$v")" ]; then echo "::error::secret for $v is empty (docs/runbooks/mobile-testers-ci.md)"; exit 1; fi
          done
          printf '%s' "$DART_DEFINES_JSON" > config/prod.json
          echo "$GOOGLE_SERVICE_INFO_PLIST_BASE64" | base64 -d > ios/Runner/GoogleService-Info.plist
          echo "$ASC_KEY_CONTENT" | base64 -d > "$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          sed -i "" "s/REPLACE_TEAM_ID/$APPLE_TEAM_ID/" ios/ExportOptions.plist
          # Key file for fastlane (pilot) in its api_key_path format.
          ruby -rjson -e 'puts JSON.generate(key_id: ENV["ASC_KEY_ID"], issuer_id: ENV["ASC_ISSUER_ID"], key: File.read("#{ENV["RUNNER_TEMP"]}/AuthKey_#{ENV["ASC_KEY_ID"]}.p8"), in_house: false)' > "$RUNNER_TEMP/asc.json"
      - run: flutter pub get && dart run build_runner build --delete-conflicting-outputs
        working-directory: apps/mobile
      - name: Flutter build (no signing; installs pods, obfuscated like the Fastfile build)
        working-directory: apps/mobile
        run: |
          flutter build ios --release --no-codesign --flavor prod -t lib/main_prod.dart \
            --obfuscate --split-debug-info=build/symbols/ios \
            --dart-define-from-file=config/prod.json
      - name: Archive + export (Xcode cloud-managed signing via the API key)
        working-directory: apps/mobile/ios
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -eu
          AUTH=(-allowProvisioningUpdates
                -authenticationKeyPath "$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
                -authenticationKeyID "$ASC_KEY_ID"
                -authenticationKeyIssuerID "$ASC_ISSUER_ID")
          xcodebuild archive -workspace Runner.xcworkspace -scheme prod -configuration Release-prod \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/LawBid.xcarchive" "${AUTH[@]}"
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/LawBid.xcarchive" \
            -exportPath "$RUNNER_TEMP/ipa" -exportOptionsPlist ExportOptions.plist "${AUTH[@]}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-prod-ipa
          path: ${{ runner.temp }}/ipa/*.ipa
          retention-days: 14
      - name: Upload to TestFlight
        working-directory: apps/mobile/ios
        run: |
          bundle exec fastlane run upload_to_testflight \
            api_key_path:"$RUNNER_TEMP/asc.json" ipa:"$(ls "$RUNNER_TEMP"/ipa/*.ipa | head -1)" \
            skip_waiting_for_build_processing:true
