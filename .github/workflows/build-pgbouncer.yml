# Builds our own connection pooler image (infra/pgbouncer: official Alpine +
# Alpine's pgbouncer package) for amd64 AND arm64 and pushes it to ECR
# `lawbid-pgbouncer` (docs/architecture/DB_POOLER.md). Fargate never pulls
# from Docker Hub, hence ECR.
#
# Run once before db_pooler_enabled = true: Actions -> "Build PgBouncer" ->
# Run workflow. Then set in the tfvars:
#   pgbouncer_image = "<ECR_REGISTRY>/lawbid-pgbouncer:<tag>"
# ECR tags are IMMUTABLE: to change the image, change infra/pgbouncer and use a
# new tag (the tag is also printed in the run summary).
# Secrets used: AWS_DEPLOY_ROLE_PROD, AWS_REGION, ECR_REGISTRY (same as deploy.yml).
# The repository lawbid-pgbouncer comes from infra/bootstrap. The push job checks
# that FIRST (scripts/ci/require-ecr.sh): a missing repository stops the run in
# seconds with the exact fix, not after a 10-minute multi-arch build
# (docs/runbooks/ECR_PRECONDITIONS.md).
name: Build PgBouncer

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag in ECR lawbid-pgbouncer (immutable)"
        required: false
        default: "1.24.0-1"
  pull_request:
    paths:
      - "infra/pgbouncer/**"
      - ".github/workflows/build-pgbouncer.yml"

permissions:
  id-token: write
  contents: read

concurrency:
  group: build-pgbouncer-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}

jobs:
  # Pull requests: build both architectures, push nothing.
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build amd64 + arm64 (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: infra/pgbouncer
          platforms: linux/amd64,linux/arm64
          push: false

  push:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_PROD }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7
      - name: The ECR repository exists (fail now, not after the build)
        run: scripts/ci/require-ecr.sh --repo lawbid-pgbouncer
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Does the tag exist already?
        id: exists
        env:
          TAG: ${{ inputs.tag }}
        run: |
          # 0 = found, 1 = tag absent -> build, 2 = anything else -> stop (not "absent")
          rc=0; scripts/ci/require-ecr.sh --probe "lawbid-pgbouncer:$TAG" || rc=$?
          case "$rc" in
            0) echo "::notice::lawbid-pgbouncer:$TAG already in ECR (tags are immutable), nothing to do"; echo "found=true" >>"$GITHUB_OUTPUT" ;;
            1) echo "found=false" >>"$GITHUB_OUTPUT" ;;
            *) exit 1 ;;
          esac
      - name: Build amd64 + arm64 and push
        if: steps.exists.outputs.found == 'false'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: infra/pgbouncer
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: ${{ env.ECR_REGISTRY }}/lawbid-pgbouncer:${{ inputs.tag }}
      - name: Proof - the image has both architectures
        env:
          TAG: ${{ inputs.tag }}
        run: |
          docker buildx imagetools inspect "$ECR_REGISTRY/lawbid-pgbouncer:$TAG" | tee /tmp/inspect.txt
          grep -q "linux/arm64" /tmp/inspect.txt && grep -q "linux/amd64" /tmp/inspect.txt
          echo "pgbouncer_image = \"$ECR_REGISTRY/lawbid-pgbouncer:$TAG\"" >>"$GITHUB_STEP_SUMMARY"
