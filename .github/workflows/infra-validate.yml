# Terraform fmt + validate on PRs that touch infra/. No AWS access and no state
# (`init -backend=false` only downloads providers). Not a required check on
# purpose: the public provider registry can flake; a red run is still a reason
# not to merge. apply / drift float on ">=1.9" (latest 1.x reads the owner's state);
# this pin is the newest release at least 7 days old (STRICT_RULES №10).
name: Infra validate

on:
  pull_request:
    paths:
      - "infra/**"
      - "apps/status-page/**" # read by infra/modules/status-page (filemd5)
      - ".github/workflows/infra-validate.yml"

permissions:
  contents: read

concurrency:
  group: infra-validate-${{ github.ref }}
  cancel-in-progress: true

env:
  # Same as load-test.yml (the version that creates the test stacks).
  TF_VERSION: "1.17.1"

jobs:
  validate:
    name: terraform fmt + validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - name: Format (terraform fmt -check)
        run: terraform fmt -check -recursive -diff infra
      - name: Validate every root module
        run: |
          # One provider download for every root (the AWS provider is several hundred MB).
          # Set here: the `runner` context is not available in workflow-level env.
          export TF_PLUGIN_CACHE_DIR="$RUNNER_TEMP/tf-plugin-cache"
          mkdir -p "$TF_PLUGIN_CACHE_DIR"
          fail=0
          for d in infra/envs/*/ infra/bootstrap*/; do
            echo "::group::validate $d"
            ( cd "$d" && terraform init -backend=false -input=false -no-color >/dev/null && terraform validate -no-color ) || { echo "::error::terraform validate failed in $d"; fail=1; }
            echo "::endgroup::"
          done
          exit $fail
      - name: Module tests (terraform test, mock providers, no AWS)
        run: |
          export TF_PLUGIN_CACHE_DIR="$RUNNER_TEMP/tf-plugin-cache"
          mkdir -p "$TF_PLUGIN_CACHE_DIR"
          fail=0
          # + infra/bootstrap (C5/C4 26.11: the CI roles can not change themselves).
          for f in infra/modules/*/tests/*.tftest.hcl infra/bootstrap/tests/*.tftest.hcl; do dirname "$(dirname "$f")"; done | sort -u > "$RUNNER_TEMP/tf-test-dirs"
          while read -r t; do
            echo "::group::test $t"
            ( cd "$t" && terraform init -backend=false -input=false -no-color >/dev/null && terraform test -no-color ) || { echo "::error::terraform test failed in $t"; fail=1; }
            echo "::endgroup::"
          done < "$RUNNER_TEMP/tf-test-dirs"
          exit $fail

  # SECOND_PASS_2026-11-26 X4 (AWS WA SEC01-BP06): Terraform/Dockerfile
  # misconfiguration scan, blocking on HIGH/CRITICAL. Trivy (Apache-2.0) runs
  # as the CLI image, like container-scan.yml (trivy-action tags no longer
  # resolve there), pinned by digest so a moved tag cannot change what runs
  # (0.76.2, built 2026-11-05). Accepted findings live in
  # infra/.trivyignore.yaml, each scoped to its files with a reason. No AWS
  # access, no state: the scan reads the .tf files only.
  trivy-config:
    name: terraform security scan (trivy config)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Trivy config (fail on HIGH/CRITICAL)
        run: |
          # Explicit timeout (KNOWN_ERRORS 132): a slow scan must fail as a
          # timeout, not hang. The read-only mount keeps the tree untouched.
          docker run --rm -v "$PWD:/src:ro" \
            aquasec/trivy:0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb \
            config --timeout 10m --severity HIGH,CRITICAL --exit-code 1 \
            --ignorefile /src/infra/.trivyignore.yaml \
            --format table /src/infra
