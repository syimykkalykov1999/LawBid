# X3 (SECOND_PASS_2026-11-26; AWS WA SEC11-BP02, OWASP WSTG): dynamic API
# testing. Schemathesis (MIT) generates requests from the OpenAPI contract
# (packages/api-contract/openapi.json) and sends them to the API of THIS
# commit, started on a throw-away stand inside the runner (postgres + valkey
# services, migrated schema, .env.test mocks) exactly like the Admin
# Lighthouse job in admin-ci.yml. Never prod or staging: the URL is localhost.
#
# Finding = an unhandled crash (HTTP 500) or a dropped connection.
# 401/403/404/422/429 and the stand's "not configured" 501-504 are expected
# (scripts/ci/dast/schemathesis.toml), so the auth guards are never flagged.
# Two bounded passes: anonymous (public routes + guards) and one signed-in
# admin (admin routes), at most 4 minutes each.
#
# Runner starvation: not on every API PR. PRs run it only when the contract
# changes (a new or changed route); otherwise nightly and by hand.
name: API DAST

on:
  pull_request:
    branches: [main, master]
    paths:
      - "packages/api-contract/openapi.json"
      - "scripts/ci/dast/**"
      - ".github/workflows/api-dast.yml"
  schedule:
    - cron: "15 4 * * *"
  workflow_dispatch:

concurrency:
  group: api-dast-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # 4.33.4 (2026-11-12): newest release at least 7 days old (STRICT_RULES №10),
  # pinned by digest so a moved tag cannot change what runs.
  SCHEMATHESIS_IMAGE: schemathesis/schemathesis:v4.33.4@sha256:708d934c8208a8f785bdf1b1610476e691f1efda0b7a3cb9ce7536d0f3280eec

jobs:
  schemathesis:
    name: API fuzzing (Schemathesis, local stand)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:18.6@sha256:e3d24f6906d0760bf4da0dae872415391ededefad23fd471c47dc53b0ddf3c42
        env:
          POSTGRES_USER: root
          POSTGRES_PASSWORD: lawbid
          POSTGRES_DB: lawbid_ci
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432
        options: >-
          --health-cmd "pg_isready -U root -d lawbid_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: valkey/valkey:9.1.3-alpine@sha256:bf09d58e96d6b4524a15396b65b242bbe18beebbcc15a04d8ee75ddac62fae0b
        ports:
          - 6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - name: Point the job at its service containers (random host ports)
        env:
          PG_PORT: ${{ job.services.postgres.ports['5432'] }}
          REDIS_PORT: ${{ job.services.redis.ports['6379'] }}
        run: scripts/ci/service-env.sh
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.13.1"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Prisma generate + migrate a clean database
        working-directory: apps/api
        run: npx prisma generate && npx prisma migrate deploy && node prisma/run-concurrent.mjs
      - name: Build and start the API (test env, this commit)
        working-directory: apps/api
        env:
          # nest build needs the same heap as the other API jobs (KNOWN_ERRORS 23 / N-1).
          NODE_OPTIONS: --max-old-space-size=6144
        run: |
          set -eu
          npm run build
          # Same stand as admin-ci.yml `lighthouse`: .env.test (mock SMS/email,
          # fixed OTP), the services' random ports win over the file's.
          DB="$DATABASE_URL"; RD="$REDIS_URL"
          set -a; . ./.env.test; set +a
          export DATABASE_URL="$DB" REDIS_URL="$RD" PORT=3000
          export ADMIN_LOGIN_LIMIT_PER_IP_PER_HOUR=1000
          nohup node dist/src/main.js > "$RUNNER_TEMP/api.log" 2>&1 &
          for _ in $(seq 1 180); do curl -fsS http://localhost:3000/health/live >/dev/null 2>&1 && break; sleep 2; done
          curl -fsS http://localhost:3000/health/live >/dev/null || { echo "::error::the API did not start in 6 min"; grep -v '"level":30' "$RUNNER_TEMP/api.log" | tail -40; exit 1; }
      - name: One admin signed in (token for the admin pass)
        working-directory: apps/api
        run: |
          set -eu
          DB="$DATABASE_URL"
          set -a; . ./.env.test; set +a
          export DATABASE_URL="$DB" API_URL=http://localhost:3000
          TOKEN=$(npx ts-node --transpile-only scripts/lhci-admin.ts)
          echo "::add-mask::$TOKEN"
          echo "DAST_ADMIN_TOKEN=$TOKEN" >> "$GITHUB_ENV"
      - name: Fuzz the contract (anonymous, then admin)
        run: |
          set -u
          # The image runs as its own non-root user: it must be able to write
          # the report folder of the runner (KNOWN_ERRORS 258).
          mkdir -p "$RUNNER_TEMP/dast" && chmod 0777 "$RUNNER_TEMP/dast"
          run_pass() {
            name="$1"; shift
            echo "::group::Schemathesis pass: $name"
            # --network host: the API listens on the runner's localhost only.
            docker run --rm --network host \
              -v "$PWD:/w:ro" -v "$RUNNER_TEMP/dast:/out" \
              "$SCHEMATHESIS_IMAGE" \
              --config-file /w/scripts/ci/dast/schemathesis.toml \
              run /w/packages/api-contract/openapi.json \
              --url http://localhost:3000/api/v1 \
              --checks not_a_server_error \
              --phases examples,coverage,fuzzing \
              --max-time 240 --workers 4 --request-timeout 15 \
              --report junit --report-dir "/out/$name" \
              --no-color "$@"
            rc=$?
            echo "::endgroup::"
            return $rc
          }
          fail=0
          run_pass anonymous || fail=1
          # Session-ending routes are left out of the signed-in pass: a random
          # logout would turn the rest of the pass into plain 401s.
          run_pass admin -H "Authorization: Bearer $DAST_ADMIN_TOKEN" \
            --include-path-regex '^/admin/' \
            --exclude-path-regex '(logout|sessions)' || fail=1
          if [ "$fail" -ne 0 ]; then
            echo "::error::Schemathesis found a 500 or a dropped connection (details and 'st replay' commands above; API log in the artifact)"
          fi
          exit "$fail"
      - name: API log for the findings (warn/error lines only)
        if: always()
        run: |
          [ -f "$RUNNER_TEMP/api.log" ] || exit 0
          grep -v '"level":30' "$RUNNER_TEMP/api.log" > "$RUNNER_TEMP/dast/api-warn-error.log" || true
          tail -60 "$RUNNER_TEMP/dast/api-warn-error.log"
      - name: Upload the reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: api-dast
          path: ${{ runner.temp }}/dast
          if-no-files-found: ignore

  # S11-6: a nightly failure reaches the owner (notify-failure.yml).
  notify:
    name: Notify the owner
    needs: [schemathesis]
    if: ${{ always() && contains(needs.*.result, 'failure') && github.event_name == 'schedule' }}
    permissions:
      contents: read
      issues: write
      id-token: write
    uses: ./.github/workflows/notify-failure.yml
    with:
      title: "API DAST found a server error (Schemathesis, nightly stand)"
      kind: dast
      remind_after_minutes: 720
    secrets: inherit
