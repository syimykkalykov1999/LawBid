# One-off, owner-triggered: a NEW Android upload key made in CI, so the old
# lawbid-upload.jks (on the Mac) is not needed. It writes the keystore and its
# passwords straight into the `release` environment secrets; only the PUBLIC
# certificate leaves as an artifact. Then, in Play Console -> Test and release ->
# App integrity -> App signing -> "Request upload key reset", the owner uploads
# that certificate (Google approves in about two days).
# Needs the secret GH_SECRETS_TOKEN (fine-grained PAT, this repo, Secrets: read/write).
# Run it only when the old key is lost: the old keystore secret is overwritten.
# Docs: docs/runbooks/mobile-testers-ci.md.
name: Android upload key (one-off)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type RESET to replace the ANDROID_KEYSTORE_* secrets"
        type: string
        required: true

permissions:
  contents: read

jobs:
  generate:
    if: ${{ inputs.confirm == 'RESET' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with: { distribution: temurin, java-version: "17" }
      - name: Generate keystore, store the secrets, publish the certificate
        env:
          GH_TOKEN: ${{ secrets.GH_SECRETS_TOKEN }}
        run: |
          set -eu
          if [ -z "$GH_TOKEN" ]; then echo "::error::GH_SECRETS_TOKEN is empty"; exit 1; fi
          PASS=$(openssl rand -hex 24); echo "::add-mask::$PASS"
          ALIAS=upload
          keytool -genkeypair -v -keystore upload.jks -storetype PKCS12 -alias "$ALIAS" \
            -keyalg RSA -keysize 2048 -validity 10000 -storepass "$PASS" -keypass "$PASS" \
            -dname "CN=LawBid, O=SiMA LLC, C=US" >/dev/null
          keytool -export -rfc -keystore upload.jks -alias "$ALIAS" -storepass "$PASS" -file upload_certificate.pem >/dev/null
          base64 -w0 upload.jks | gh secret set ANDROID_KEYSTORE_BASE64 --env release --repo "$GITHUB_REPOSITORY"
          printf '%s' "$PASS"  | gh secret set ANDROID_KEYSTORE_PASSWORD --env release --repo "$GITHUB_REPOSITORY"
          printf '%s' "$PASS"  | gh secret set ANDROID_KEY_PASSWORD --env release --repo "$GITHUB_REPOSITORY"
          printf '%s' "$ALIAS" | gh secret set ANDROID_KEY_ALIAS --env release --repo "$GITHUB_REPOSITORY"
          rm -f upload.jks
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: upload-certificate-PUBLIC
          path: upload_certificate.pem
          retention-days: 7
