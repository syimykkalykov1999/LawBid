<!doctype html>
<meta charset="utf-8">
<title>decode cost</title>
<!-- Image grid decoding cost (round 2 of docs/perf/LOCAL_LOAD_TEST_2026-10-28.md):
     a profile grid of 12 tiles, photos as the API links them (320 px preview,
     1080 px medium, 2048 px main), JPEG quality 0.82 like a phone photo.
     google-chrome --headless=new --dump-dom web_decode.html -->
<pre id="out">running</pre>
<script>
async function jpeg(px) {
  const c = new OffscreenCanvas(px, px);
  const g = c.getContext('2d');
  const img = g.createImageData(px, px);
  let s = 12345;
  for (let i = 0; i < img.data.length; i += 4) {
    s = (s * 1103515245 + 12345) & 0x7fffffff;
    const y = (i / 4 / px) | 0, x = (i / 4) % px;
    img.data[i] = (x * 255 / px + (s & 31)) & 255;
    img.data[i + 1] = (y * 255 / px + ((s >> 5) & 31)) & 255;
    img.data[i + 2] = ((x + y) * 128 / px + ((s >> 10) & 31)) & 255;
    img.data[i + 3] = 255;
  }
  g.putImageData(img, 0, 0);
  return c.convertToBlob({ type: 'image/jpeg', quality: 0.82 });
}
(async () => {
  const lines = [];
  for (const px of [320, 1080, 2048]) {
    const blob = await jpeg(px);
    const runs = [];
    for (let r = 0; r < 5; r++) {
      const t0 = performance.now();
      await Promise.all(Array.from({ length: 12 }, () => createImageBitmap(blob).then((b) => b.close())));
      runs.push(performance.now() - t0);
    }
    runs.sort((a, b) => a - b);
    lines.push(`${px}px  file ${(blob.size / 1024).toFixed(0)} KB  12 tiles decode median ${runs[2].toFixed(1)} ms  memory ${(12 * px * px * 4 / 1048576).toFixed(1)} MB`);
  }
  document.getElementById('out').textContent = lines.join('\n');
})();
</script>
