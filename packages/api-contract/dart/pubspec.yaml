name: lawbid_api
description: >-
  LawBid API client (docs/01_FOUNDATION_AUTH.md §6.3), generated from
  ../openapi.json by ../generate.sh. Never hand-edit lib/src.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.9.0

dependencies:
  dio: ^5.9.0
  json_annotation: ^4.12.0
  retrofit: ^4.10.0

# Generator toolchain — exact pins so a regeneration is byte-for-byte
# reproducible (CI "contract drift" check runs generate.sh + git diff).
dev_dependencies:
  build_runner: 2.16.1
  json_serializable: 6.14.1
  retrofit_generator: 10.2.11
  swagger_parser: 1.45.0
  test: ^1.25.0

swagger_parser:
  # ../openapi.json minus the non-/api/v1 health probes — written by
  # ../generate.sh (see there); not committed.
  schema_path: .dart_tool/openapi.client.json
  output_directory: lib/src
  name: lawbid_api
  language: dart
  json_serializer: json_serializable
  root_client: true
  root_client_name: LawbidApi
  export_file: true
  put_clients_in_folder: true
  client_postfix: Client
  path_method_name: false
  merge_clients: false
  enums_to_json: true
  enums_parent_prefix: true
  unknown_enum_value: true
  mark_files_as_generated: true
  original_http_response: false
  # The app's dio interceptors read RequestOptions.extra (skipAuth,
  # createsResource, noRetry — apps/mobile core/network/request_flags.dart).
  extras_parameter_by_default: true
  # Stamped by the app's IdempotencyInterceptor / HeadersInterceptor, not
  # by call sites.
  skipped_parameters:
    - Idempotency-Key
    - x-device-attestation
  use_multipart_file: true
  include_if_null: false
