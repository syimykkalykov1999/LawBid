# Own servers (owner 2026-11-11, «выкладка без AWS»): the production images
# (the same api / admin images the AWS deploy runs) with PostgreSQL 16, Redis 7
# and MinIO, every connection over TLS, NODE_ENV=production — no AWS service.
# docs/runbooks/selfhost-stack.md. Usage:
#   ./gen-env.sh && API_IMAGE=... ADMIN_IMAGE=... docker compose up -d
name: lawbid-selfhost
x-app: &app
  image: ${API_IMAGE:?set API_IMAGE (the lawbid-api image)}
  env_file: .env
  environment: &appenv
    NODE_ENV: production
    PORT: "3000"
    TRUST_PROXY_HOPS: "1"
    DATABASE_URL: postgresql://lawbid:${PG_PASS}@postgres:5432/lawbid?sslmode=require&sslcert=/certs/ca.crt
    REDIS_URL: rediss://:${REDIS_PASS}@redis:6379
    NODE_EXTRA_CA_CERTS: /certs/ca.crt
    S3_ENDPOINT: https://minio:9000
    S3_REGION: us-east-1
    S3_BUCKET_DOCUMENTS: lawbid-documents
    S3_BUCKET_MEDIA: lawbid-media
    S3_ACCESS_KEY_ID: ${MINIO_USER}
    S3_SECRET_ACCESS_KEY: ${MINIO_PASS}
    JWT_ACTIVE_KID: j1
    SECRETS_ACTIVE_KID: k1
    MESSAGE_ENC_ACTIVE_KID: m1
    EMAIL_PROVIDER: auto
    SMS_PROVIDER: auto
  volumes:
    - certs:/certs:ro
  depends_on:
    migrate: { condition: service_completed_successfully }

services:
  certs:
    image: postgres:16
    user: root
    entrypoint: ["sh", "/gen/gen-certs.sh"]
    volumes:
      - certs:/certs
      - ./gen-certs.sh:/gen/gen-certs.sh:ro

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: lawbid
      POSTGRES_PASSWORD: ${PG_PASS}
      POSTGRES_DB: lawbid
    command: >-
      postgres -c ssl=on -c ssl_cert_file=/certs/pg/server.crt
      -c ssl_key_file=/certs/pg/server.key
    volumes:
      - certs:/certs:ro
      - pg:/var/lib/postgresql/data
    depends_on:
      certs: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lawbid -d lawbid"]
      interval: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    command: >-
      redis-server --port 0 --tls-port 6379 --tls-cert-file /certs/redis.crt
      --tls-key-file /certs/redis.key --tls-ca-cert-file /certs/ca.crt
      --tls-auth-clients no --requirepass ${REDIS_PASS}
    volumes:
      - certs:/certs:ro
    depends_on:
      certs: { condition: service_completed_successfully }

  minio:
    image: quay.io/minio/minio:latest
    user: root
    command: server /data --certs-dir /certs/minio
    environment:
      MINIO_ROOT_USER: ${MINIO_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_PASS}
    volumes:
      - certs:/certs:ro
      - minio:/data
    depends_on:
      certs: { condition: service_completed_successfully }

  # The two buckets, with the AWS SDK the api image already has.
  buckets:
    image: ${API_IMAGE}
    env_file: .env
    environment:
      NODE_EXTRA_CA_CERTS: /certs/ca.crt
    volumes:
      - certs:/certs:ro
    command:
      - node
      - -e
      - |
        const { S3Client, CreateBucketCommand } = require('@aws-sdk/client-s3');
        const s3 = new S3Client({ endpoint: 'https://minio:9000', region: 'us-east-1', forcePathStyle: true,
          credentials: { accessKeyId: process.env.MINIO_USER, secretAccessKey: process.env.MINIO_PASS } });
        (async () => {
          for (let i = 0; i < 60; i++) {
            try {
              for (const b of ['lawbid-documents', 'lawbid-media'])
                await s3.send(new CreateBucketCommand({ Bucket: b })).catch((e) => { if (!/BucketAlready/.test(e.name)) throw e; });
              console.log('buckets ready'); return;
            } catch (e) { await new Promise((r) => setTimeout(r, 1000)); }
          }
          process.exit(1);
        })();
    depends_on: [minio]

  migrate:
    image: ${API_IMAGE}
    env_file: .env
    environment:
      <<: *appenv
      HOME: /tmp
      npm_config_cache: /tmp/npm-cache
    command: sh -c "npx prisma migrate deploy && node prisma/run-concurrent.mjs && node prisma/verify-schema.mjs"
    volumes:
      - certs:/certs:ro
    depends_on:
      postgres: { condition: service_healthy }
      buckets: { condition: service_completed_successfully }

  api:
    <<: *app
    command: ["node", "dist/src/main.js"]
    ports: ["127.0.0.1:3900:3000"]

  worker:
    <<: *app
    command: ["node", "dist/src/worker.js"]

  admin:
    image: ${ADMIN_IMAGE:?set ADMIN_IMAGE (the lawbid-admin image)}
    environment:
      NODE_ENV: production
      API_BASE_URL: http://api:3000/api/v1
      COOKIE_SECURE: "false"
    ports: ["127.0.0.1:3901:3001"]
    depends_on: [api]

volumes:
  certs:
  pg:
  minio:
